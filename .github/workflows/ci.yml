name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv .venv && uv pip install --python .venv/bin/python -e ".[dev]"
      - name: Lint
        run: .venv/bin/ruff check app tests
      - name: Content gate
        run: .venv/bin/python -m app.content.validate
      - name: Tests (coverage gate 85%)
        run: .venv/bin/python -m pytest
      - name: SAST
        run: .venv/bin/bandit -q -r app -c pyproject.toml
      - name: Dependency audit
        run: .venv/bin/pip-audit --skip-editable
      - name: OpenAPI contract
        run: .venv/bin/python -m app.export_openapi > openapi.json
      - uses: actions/upload-artifact@v4
        with: {name: openapi, path: backend/openapi.json}
  smoke:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv backend/.venv && cd backend && uv pip install --python .venv/bin/python -e ".[dev]"
      - run: ./scripts/qa-local.sh
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
  container:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t languaje-api:ci .
      - uses: aquasecurity/trivy-action@0.28.0
        with: {image-ref: "languaje-api:ci", severity: "CRITICAL,HIGH", exit-code: "1", ignore-unfixed: true}
