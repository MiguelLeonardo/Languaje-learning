name: Deploy
# Staging: automatic on main. Production: manual, protected environment with required reviewers.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment: {type: choice, options: [staging, production], default: staging}
permissions:
  contents: read
  id-token: write   # Workload Identity Federation, no long-lived keys
jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}
    env:
      REGION: ${{ vars.GCP_REGION }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/languaje/api:${{ github.sha }}
      SERVICE: languaje-api-${{ inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "$REGION-docker.pkg.dev" -q
      - run: docker build -f backend/Dockerfile -t "$IMAGE" . && docker push "$IMAGE"
      - name: Deploy (no traffic) then smoke, then shift traffic
        run: |
          gcloud run deploy "$SERVICE" --image "$IMAGE" --region "$REGION" --no-traffic --tag "c${GITHUB_SHA::7}"
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --format 'value(status.traffic[].url)' | tr ';' '\n' | grep "c${GITHUB_SHA::7}")
          API_BASE_URL="$URL" API_TOKEN="${{ secrets.QA_API_TOKEN }}" ./scripts/qa-cloud.sh
          gcloud run services update-traffic "$SERVICE" --region "$REGION" --to-tags "c${GITHUB_SHA::7}=100"
