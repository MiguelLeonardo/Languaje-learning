id: c2-executive-pitch
title: Pitching strategy and defending budget
title_es: Presentar estrategia y defender presupuesto
cefr: C2
topic: work-and-career
description: Presenta una iniciativa estratégica ante el comité directivo y defiende
  el retorno de inversión.
phrases:
- id: long-term-payoff
  text: While the upfront investment is substantial, the long-term payoff is undeniable.
  translation: Aunque la inversión inicial es considerable, el beneficio a largo plazo
    es innegable.
  visual_hint: 📈💼
  cloze:
  - 2
  - 7
  glossary:
  - word: upfront investment
    meaning: inversión inicial
    ipa: ˌʌpˈfrʌnt
  - word: payoff
    meaning: retorno / beneficio resultante
    ipa: ˈpeɪɔːf
- id: mitigate-risk
  text: We've built in clear milestones so we can course-correct if needed.
  translation: Hemos incorporado hitos claros para poder corregir el rumbo si fuera
    necesario.
  visual_hint: 🧭🎯
  cloze:
  - 4
  - 8
  glossary:
  - word: milestones
    meaning: hitos de control
    ipa: ˈmaɪlstoʊnz
  - word: course-correct
    meaning: corregir el rumbo sobre la marcha
- id: green-light
  text: With your green light today, we can kick off the pilot next month.
  translation: Con su visto bueno hoy, podemos poner en marcha el piloto el próximo
    mes.
  visual_hint: 🟢🚀
  cloze:
  - 2
  - 7
  glossary:
  - word: green light
    meaning: visto bueno / aprobación
  - word: kick off
    meaning: dar inicio / poner en marcha
- id: idm-bite-the-bullet
  text: It's time to bite the bullet and fund the migration.
  translation: 'Es hora de armarse de valor y financiar la migración. (bite the bullet:
    afrontar algo difícil)'
  visual_hint: 🔫😬
  cloze:
  - 3
  - 6
  glossary:
  - word: bite the bullet
    meaning: afrontar lo difícil
    ipa: baɪt ðə ˈbʊlɪt
  kind: idiom
  apply_sentence: The board finally decided to ____ and cut costs.
  apply_answer: bite the bullet
  apply_translation: La junta por fin decidió armarse de valor y recortar costes.
- id: idm-move-the-needle
  text: Small tweaks won't move the needle on our margins.
  translation: 'Pequeños ajustes no cambiarán de forma notable nuestros márgenes.
    (move the needle: marcar diferencia)'
  visual_hint: 📊🪡
  cloze:
  - 3
  - 6
  glossary:
  - word: move the needle
    meaning: marcar una diferencia real
    ipa: muːv ðə ˈniːdəl
  kind: idiom
  apply_sentence: Only a bold strategy can ____ on market share.
  apply_answer: move the needle
  apply_translation: Solo una estrategia audaz puede marcar la diferencia en la cuota
    de mercado.
roleplay:
  ai_role: chief financial officer
  user_role: product director
  setting: Executive boardroom quarterly budget review.
  turns:
  - speaker: ai
    text: Your proposal looks ambitious, but the initial budget request is quite steep.
  - speaker: user
    goal: Defiende el retorno a largo plazo pese a la inversión inicial.
    suggested_lines:
    - While the upfront investment is substantial, the long-term payoff is undeniable.
  - speaker: ai
    text: And how do you plan to contain risk if adoption is slower than projected?
  - speaker: user
    goal: Explica que hay hitos para corregir el rumbo y pide aprobación para el piloto.
    suggested_lines:
    - We've built in clear milestones so we can course-correct if needed.
    - With your green light today, we can kick off the pilot next month.
  - speaker: ai
    text: Fair enough. You have our green light for the phase-one pilot.
