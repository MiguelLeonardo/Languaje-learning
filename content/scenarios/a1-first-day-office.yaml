id: a1-first-day-office
title: First day at the office
title_es: Primer día en la oficina
cefr: A1
topic: work-and-career
description: Preséntate en recepción en tu primer día de trabajo, pregunta por tu
  escritorio y conoce a tu equipo.
phrases:
- id: first-day-here
  text: Good morning! Today is my first day in the marketing team.
  translation: ¡Buenos días! Hoy es mi primer día en el equipo de marketing.
  visual_hint: 💼😊
  cloze:
  - 4
  - 5
  - 9
  glossary:
  - word: first day
    meaning: primer día
    ipa: fɜːrst deɪ
  - word: team
    meaning: equipo
    ipa: tiːm
- id: where-is-my-desk
  text: Where is my desk, please?
  translation: ¿Dónde está mi escritorio, por favor?
  visual_hint: 🖥️🪑
  cloze:
  - 0
  - 3
  glossary:
  - word: where
    meaning: dónde
    ipa: wer
  - word: desk
    meaning: escritorio
    ipa: desk
- id: visitor-badge
  text: Here is my ID card for the office badge.
  translation: Aquí está mi identificación para la credencial de la oficina.
  visual_hint: 🪪🏢
  cloze:
  - 3
  - 8
  glossary:
  - word: ID card
    meaning: documento de identidad
    ipa: ˌaɪˈdiː kɑːrd
  - word: badge
    meaning: credencial / gafete
    ipa: bædʒ
- id: idm-piece-of-cake
  text: The computer login is a piece of cake today.
  translation: 'Entrar al ordenador hoy es muy fácil. (a piece of cake: algo muy fácil)'
  visual_hint: 🍰😎
  cloze:
  - 3
  - 6
  glossary:
  - word: a piece of cake
    meaning: pan comido, muy fácil
    ipa: piːs əv keɪk
  kind: idiom
  apply_sentence: This new report is a ____, I finished it fast.
  apply_answer: piece of cake
  apply_translation: Este informe nuevo es pan comido, lo terminé rápido.
- id: idm-sit-down
  text: Please sit down here, this is your new desk.
  translation: 'Siéntate aquí, por favor, este es tu escritorio nuevo. (sit down:
    sentarse)'
  visual_hint: 🪑👋
  cloze:
  - 3
  - 6
  glossary:
  - word: sit down
    meaning: sentarse
    ipa: sɪt daʊn
  kind: phrasal_verb
  apply_sentence: Let's ____ and drink some coffee with the team.
  apply_answer: sit down
  apply_translation: Sentémonos a tomar café con el equipo.
roleplay:
  ai_role: office manager
  user_role: new team member
  setting: Office reception area on Monday morning.
  turns:
  - speaker: ai
    text: Good morning! Welcome to BrightTech. How can I help you today?
  - speaker: user
    goal: Di que hoy es tu primer día en el equipo de marketing y muestra tu identificación.
    suggested_lines:
    - Good morning! Today is my first day in the marketing team.
    - Here is my ID card for the office badge.
  - speaker: ai
    text: Welcome aboard! Here is your security badge and laptop.
  - speaker: user
    goal: Pregunta dónde está tu escritorio y si la máquina de café está en este piso.
    suggested_lines:
    - Where is my desk, please?
    - Is the coffee machine on this floor?
  - speaker: ai
    text: Your desk is right by the window, and the kitchen with free coffee is down
      the hall.
  - speaker: user
    goal: Di que estás muy feliz de unirte al equipo.
    suggested_lines:
    - Nice to meet you! I am very happy to join the team.
    - Thank you! I am very happy to join the team.
  - speaker: ai
    text: Everyone is excited to meet you! Do you have any other questions?
  - speaker: user
    goal: Pregunta a qué hora suelen almorzar.
    suggested_lines:
    - What time do we usually have lunch?
    - What time is lunch?
  - speaker: ai
    text: We head out for lunch together around 12:30. Have a great first day!
