id: c2-global-reorg-townhall
title: Communicating a strategic reorganization
title_es: Comunicar reestructuración global en townhall
cefr: C2
topic: work-and-career
description: Explica en una asamblea global por qué la empresa pasa de silos regionales
  a unidades de producto globales sin recortes de personal.
phrases:
- id: shift-from-silos-to-pods
  text: Today we're realigning from regional silos into global product pods so decisions
    happen closest to the customer.
  translation: Hoy pasamos de silos regionales a unidades globales de producto para
    que las decisiones se tomen más cerca del cliente.
  visual_hint: 🌍🧭
  cloze:
  - 5
  - 11
  glossary:
  - word: silos
    meaning: departamentos aislados / silos
    ipa: ˈsaɪloʊz
- id: zero-headcount-reduction
  text: 'Let me state this upfront: this reorganization is about speed and clarity,
    with zero headcount reduction.'
  translation: 'Quiero decirlo desde el principio: esta reorganización busca velocidad
    y claridad, sin ningún recorte de personal.'
  visual_hint: 🛡️🤝
  cloze:
  - 5
  - 10
  glossary:
  - word: upfront
    meaning: de entrada / con total franqueza
    ipa: ˌʌpˈfrʌnt
- id: eliminate-duplicate-approvals
  text: Previously, launching a feature in three regions required fourteen sign-offs;
    under the new model, one pod lead owns it end-to-end.
  translation: Antes, lanzar una función en tres regiones requería catorce firmas;
    bajo el nuevo modelo, un líder la gestiona de principio a fin.
  visual_hint: ⚡✅
  cloze:
  - 6
  - 13
  glossary:
  - word: end-to-end
    meaning: de principio a fin / integralmente
    ipa: end tuː end
- id: idm-shake-up
  text: This reorganization is a major shake-up, and I understand the unease.
  translation: 'Esta reorganización es un gran cambio, y entiendo la inquietud. (shake-up:
    reestructuración drástica)'
  visual_hint: 🌪️🏢
  cloze:
  - 3
  - 7
  glossary:
  - word: shake-up
    meaning: sacudida, reestructuración
    ipa: ʃeɪk ʌp
  kind: expression
  apply_sentence: The CEO announced a ____ of the leadership team.
  apply_answer: shake-up
  apply_translation: El director ejecutivo anunció una reestructuración del equipo
    directivo.
- id: idm-keep-the-lights-on
  text: Some teams simply keep the lights on while others build.
  translation: 'Algunos equipos solo mantienen la operación mientras otros construyen.
    (keep the lights on: sostener lo básico)'
  visual_hint: 💡🏭
  cloze:
  - 3
  - 6
  glossary:
  - word: keep the lights on
    meaning: mantener lo básico
    ipa: kiːp ðə laɪts ɑːn
  kind: idiom
  apply_sentence: With fewer people, we can barely ____ in support.
  apply_answer: keep the lights on
  apply_translation: Con menos gente, apenas podemos mantener lo básico en soporte.
roleplay:
  ai_role: global employee
  user_role: chief operating officer
  setting: Global all-hands townhall broadcast across twelve offices.
  turns:
  - speaker: ai
    text: Thanks for hosting this townhall. Why are we changing our organizational
      structure right now?
  - speaker: user
    goal: Explica el paso de silos regionales a unidades globales cercanas al cliente.
    suggested_lines:
    - Today we're realigning from regional silos into global product pods so decisions
      happen closest to the customer.
    - 'Let me state this upfront: this reorganization is about speed and clarity,
      with zero headcount reduction.'
  - speaker: ai
    text: Whenever people hear the word 'reorg,' the first worry is layoffs—are any
      roles being eliminated?
  - speaker: user
    goal: Aclara desde el inicio que la reorganización no implica ningún recorte de
      personal.
    suggested_lines:
    - 'Let me state this upfront: this reorganization is about speed and clarity,
      with zero headcount reduction.'
    - Previously, launching a feature in three regions required fourteen sign-offs;
      under the new model, one pod lead owns it end-to-end.
  - speaker: ai
    text: How will this change our day-to-day workflow when shipping cross-border
      features?
  - speaker: user
    goal: Ilustra cómo se eliminan catorce firmas burocráticas dando autonomía de
      principio a fin.
    suggested_lines:
    - Previously, launching a feature in three regions required fourteen sign-offs;
      under the new model, one pod lead owns it end-to-end.
    - Every manager is holding 1-on-1 transition chats over the next forty-eight hours
      so everyone knows their pod and charter.
  - speaker: ai
    text: When will individual contributors find out which global pod they belong
      to?
  - speaker: user
    goal: Informa que en las próximas 48 horas cada persona tendrá su reunión individual
      de transición.
    suggested_lines:
    - Every manager is holding 1-on-1 transition chats over the next forty-eight hours
      so everyone knows their pod and charter.
    - To protect work-life balance across time zones, we're adopting asynchronous
      decision memos before scheduling meetings.
  - speaker: ai
    text: Wonderful! Everything is all set. Have a fantastic day!
