id: b2-disputing-minibar-charge
title: Disputing erroneous hotel checkout charges
title_es: Aclarar cargos erróneos al hacer checkout
cefr: B2
topic: hotel-and-shopping
description: Revisa el estado de cuenta al salir del hotel y pide eliminar cargos de minibar y gimnasio que no consumiste.
phrases:
- id: reviewing-folio-statement
  text: Good morning. I'm checking out of Room 612, and I noticed two erroneous charges on my folio.
  translation: Buenos días. Estoy entregando la habitación 612 y noté dos cargos erróneos en mi estado de cuenta.
  visual_hint: 🧾🏨
  cloze:
  - 5
  - 11
  glossary:
  - word: erroneous
    meaning: erróneos / equivocados
    ipa: ɪˈroʊniəs
- id: didnt-touch-minibar
  text: We never opened the minibar sensor tray—we only placed our own water bottles on top.
  translation: Nunca abrimos la bandeja con sensor del minibar; solo pusimos nuestras botellas de agua encima.
  visual_hint: 🍾🚫
  cloze:
  - 5
  - 10
  glossary:
  - word: sensor tray
    meaning: bandeja con sensor automático
    ipa: ˈsensər treɪ
- id: resort-fee-waived-tier
  text: Also, the daily spa access fee should be waived under our loyalty tier booking.
  translation: Además, el cargo diario de spa debería estar exento según nuestra reserva de categoría fidelidad.
  visual_hint: 🏅✨
  cloze:
  - 4
  - 9
  glossary:
  - word: waived
    meaning: exento / condonado
    ipa: weɪvd
- id: reprint-zero-balance
  text: Could you rerun the final charge and print an updated invoice for my expense report?
  translation: ¿Podría procesar el cargo corregido e imprimir la factura actualizada para mi reporte de gastos?
  visual_hint: 🖨️💼
  cloze:
  - 5
  - 10
  glossary:
  - word: expense report
    meaning: reporte de gastos
    ipa: ɪkˈspens rɪˈpɔːrt
- id: hold-bags-until-two
  text: May we leave our two bags with the bell desk until our 2:00 PM airport transfer?
  translation: ¿Podemos dejar dos maletas en custodia hasta nuestro traslado de las 2:00 PM?
  visual_hint: 🧳🕑
  cloze:
  - 5
  - 10
  glossary:
  - word: bell desk
    meaning: mostrador de botones / consigna
    ipa: bel desk
- id: wonderful-stay-overall
  text: Aside from that billing hiccup, we had a wonderful stay—thank you!
  translation: Fuera de ese detalle en la cuenta, tuvimos una estancia maravillosa; ¡gracias!
  visual_hint: 🌟🤝
  cloze:
  - 3
  - 7
  glossary:
  - word: hiccup
    meaning: pequeño contratiempo
    ipa: ˈhɪkʌp
roleplay:
  ai_role: front desk supervisor
  user_role: departing guest
  setting: Hotel reception desk during morning checkout.
  turns:
  - speaker: ai
    text: Good morning! I emailed your preliminary folio for Room 612. Did everything look okay?
  - speaker: user
    goal: Indica que entregas la habitación 612 y notaste dos cargos erróneos en la factura.
    suggested_lines:
    - Good morning. I'm checking out of Room 612, and I noticed two erroneous charges on my folio.
    - We never opened the minibar sensor tray—we only placed our own water bottles on top.
  - speaker: ai
    text: Which line items on the statement look incorrect to you?
  - speaker: user
    goal: Explica que nunca consumieron del minibar, solo apoyaron botellas de agua.
    suggested_lines:
    - We never opened the minibar sensor tray—we only placed our own water bottles on top.
    - Also, the daily spa access fee should be waived under our loyalty tier booking.
  - speaker: ai
    text: Ah, those optical weight sensors trigger if anything rests on the tray! I'll void the $42 minibar charge.
  - speaker: user
    goal: Recuerda que el cargo diario de spa está exento por tu nivel de fidelidad.
    suggested_lines:
    - Also, the daily spa access fee should be waived under our loyalty tier booking.
    - Could you rerun the final charge and print an updated invoice for my expense report?
  - speaker: ai
    text: You're completely right—Platinum bookings include complimentary spa access. I've removed both items.
  - speaker: user
    goal: Pide imprimir la factura corregida para tu reporte de gastos laborales.
    suggested_lines:
    - Could you rerun the final charge and print an updated invoice for my expense report?
    - May we leave our two bags with the bell desk until our 2:00 PM airport transfer?
  - speaker: ai
    text: Wonderful! Everything is all set. Have a fantastic day!
