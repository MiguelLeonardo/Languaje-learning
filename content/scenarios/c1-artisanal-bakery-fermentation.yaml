id: c1-artisanal-bakery-fermentation
title: Discussing sourdough fermentation
title_es: Conversar sobre masa madre y fermentación
cefr: C1
topic: food-and-drink
description: Habla con un maestro panadero sobre hidratación de harinas integrales,
  fermentación en frío y corteza.
phrases:
- id: high-hydration-crumb
  text: How do you achieve such an open, custardy crumb at eighty-percent hydration?
  translation: ¿Cómo logran una miga tan alveolada y cremosa con un ochenta por ciento
    de hidratación?
  visual_hint: 🍞🫧
  cloze:
  - 4
  - 8
  glossary:
  - word: crumb
    meaning: miga del pan
    ipa: krʌm
- id: cold-retard-overnight
  text: Does a twenty-four-hour cold retard in the walk-in sharpen the lactic tang?
  translation: ¿Una fermentación en frío de veinticuatro horas acentúa la acidez láctica?
  visual_hint: ❄️⏱️
  cloze:
  - 4
  - 8
  glossary:
  - word: cold retard
    meaning: fermentación lenta en frío
    ipa: koʊld rɪˈtɑːrd
- id: stone-milled-rye-starter
  text: Do you feed your levain with whole rye to boost enzymatic activity?
  translation: ¿Alimentan su masa madre con centeno integral para impulsar la actividad
    enzimática?
  visual_hint: 🌾🫙
  cloze:
  - 4
  - 8
  glossary:
  - word: levain
    meaning: masa madre activa / fermento
    ipa: ləˈvæn
- id: bread-and-butter
  text: That crusty country loaf is our bread and butter.
  translation: 'Esa hogaza rústica es nuestro sustento principal. (bread and butter:
    sustento básico)'
  visual_hint: 🍞🧈
  cloze:
  - 3
  - 6
  glossary:
  - word: bread and butter
    meaning: 'bread and butter: sustento principal'
    ipa: bred
  kind: idiom
  apply_sentence: Teaching is my ____, but I also write.
  apply_answer: bread and butter
  apply_translation: Enseñar es mi sustento principal, pero también escribo.
- id: good-things-come-to-those-who-wait
  text: Good things come to those who wait, especially with sourdough.
  translation: Lo bueno se hace esperar, sobre todo con la masa madre. (good things
    come to those who wait)
  visual_hint: ⏳🥖
  cloze:
  - 3
  - 6
  glossary:
  - word: good things come to those who wait
    meaning: 'good things come to those who wait: paciencia'
    ipa: weɪt
  kind: idiom
  apply_sentence: Don't rush; ____, after all.
  apply_answer: good things come to those who wait
  apply_translation: No te apresures; al fin y al cabo, lo bueno llega a quien sabe
    esperar.
roleplay:
  ai_role: master baker
  user_role: bread baker
  setting: An artisanal sourdough bakery counter after the morning bake.
  turns:
  - speaker: ai
    text: Here is a warm country loaf just out of the deck oven. Look at that blistered
      crust!
  - speaker: user
    goal: Pregunta cómo logran esa miga tan abierta con 80% de hidratación.
    suggested_lines:
    - How do you achieve such an open, custardy crumb at eighty-percent hydration?
    - Does a twenty-four-hour cold retard in the walk-in sharpen the lactic tang?
  - speaker: ai
    text: We do four gentle coil folds and use stone-milled heritage wheat.
  - speaker: user
    goal: Pregunta si la fermentación en frío de 24 horas acentúa el perfil láctico.
    suggested_lines:
    - Does a twenty-four-hour cold retard in the walk-in sharpen the lactic tang?
    - Do you feed your levain with whole rye to boost enzymatic activity?
  - speaker: ai
    text: Exactly—cold proofing at four degrees develops complex sweetness without
      harsh sourness.
  - speaker: user
    goal: Pregunta si alimentan la masa madre con centeno integral.
    suggested_lines:
    - Do you feed your levain with whole rye to boost enzymatic activity?
    - That caramelized, shattering crust clearly comes from heavy steam during the
      firstifteen minutes.
  - speaker: ai
    text: Yes, thirty percent dark rye keeps the starter vigorous year-round.
  - speaker: user
    goal: Comenta el efecto del vapor en la corteza caramelizada y compra una hogaza.
    suggested_lines:
    - That caramelized, shattering crust clearly comes from heavy steam during the
      firstifteen minutes.
    - Giving the flour a one-hour autolyse before adding salt makes extensibility
      effortless.
  - speaker: ai
    text: Wonderful! Everything is all set. Have a fantastic day!
