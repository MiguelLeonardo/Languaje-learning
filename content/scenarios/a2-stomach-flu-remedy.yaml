id: a2-stomach-flu-remedy
title: Getting stomach remedies at a pharmacy
title_es: Pedir suero oral por malestar estomacal
cefr: A2
topic: health-and-emergencies
description: Explica al farmacéutico que comiste algo que te cayó mal ayer y pide
  sales de rehidratación oral.
phrases:
- id: upset-stomach-since-last-night
  text: Hi, I've had an upset stomach and nausea since dinner last night.
  translation: Hola, tengo malestar estomacal y náuseas desde la cena de anoche.
  visual_hint: 🤢💊
  cloze:
  - 4
  - 8
  glossary:
  - word: upset stomach
    meaning: malestar estomacal / indigestión
    ipa: ʌpˈset ˈstʌmək
- id: rehydration-electrolyte-powder
  text: Do you have oral rehydration salts or electrolyte packets I can mix with water?
  translation: ¿Tienen sales de rehidratación oral o sobres de electrolitos para mezclar
    con agua?
  visual_hint: 💧🥤
  cloze:
  - 4
  - 9
  glossary:
  - word: packets
    meaning: sobres individuales
    ipa: ˈpækɪts
- id: gentle-on-the-stomach
  text: Is there a mild tablet that helps stop nausea without making me sleepy?
  translation: ¿Hay alguna pastilla suave para las náuseas que no dé sueño?
  visual_hint: 💊😌
  cloze:
  - 4
  - 8
  glossary:
  - word: sleepy
    meaning: con sueño / somnoliento
    ipa: ˈsliːpi
- id: idm-feel-like-a2
  text: I don't feel like eating anything today.
  translation: Hoy no tengo ganas de comer nada. (feel like = tener ganas de)
  visual_hint: 🤢🍽️
  cloze:
  - 2
  - 4
  glossary:
  - word: feel like
    meaning: tener ganas de
    ipa: fiːl laɪk
  kind: idiom
  apply_sentence: Do you ____ going out tonight?
  apply_answer: feel like
  apply_translation: ¿Tienes ganas de salir esta noche?
- id: idm-throw-up-a2
  text: I feel sick and I might throw up.
  translation: Me siento mal y podría vomitar. (throw up = vomitar)
  visual_hint: 🤮🚤
  cloze:
  - 2
  - 5
  glossary:
  - word: throw up
    meaning: vomitar
    ipa: θrəʊ ʌp
  kind: phrasal_verb
  apply_sentence: The boat moved so much that I thought I would ____.
  apply_answer: throw up
  apply_translation: El barco se movía tanto que pensé que vomitaría.
roleplay:
  ai_role: pharmacist
  user_role: traveler
  setting: Neighborhood pharmacy counter in the morning.
  turns:
  - speaker: ai
    text: Good morning! How can I help you feel better today?
  - speaker: user
    goal: Explica que tienes malestar estomacal y náuseas desde anoche.
    suggested_lines:
    - Hi, I've had an upset stomach and nausea since dinner last night.
    - Do you have oral rehydration salts or electrolyte packets I can mix with water?
  - speaker: ai
    text: I'm sorry to hear that! Staying hydrated is the most important thing.
  - speaker: user
    goal: Pregunta por sales de rehidratación o sobres de electrolitos.
    suggested_lines:
    - Do you have oral rehydration salts or electrolyte packets I can mix with water?
    - Is there a mild tablet that helps stop nausea without making me sleepy?
  - speaker: ai
    text: Yes, dissolve one of these lemon electrolyte sachets in a tall bottle of
      water.
  - speaker: user
    goal: Pregunta si tienen alguna pastilla para las náuseas que no dé sueño.
    suggested_lines:
    - Is there a mild tablet that helps stop nausea without making me sleepy?
    - Should I stick to plain toast, rice, and herbal tea for today?
  - speaker: ai
    text: These ginger and vitamin B6 tablets calm the stomach and are non-drowsy.
  - speaker: user
    goal: Pregunta si conviene comer solo pan tostado, arroz y té hoy.
    suggested_lines:
    - Should I stick to plain toast, rice, and herbal tea for today?
    - I don't have a fever, I just feel a bit tired and dehydrated.
  - speaker: ai
    text: Wonderful! Everything is all set. Have a fantastic day!
