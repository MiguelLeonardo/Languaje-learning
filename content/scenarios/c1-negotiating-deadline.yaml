id: c1-negotiating-deadline
title: Negotiating a deadline
title_es: Negociar un plazo de entrega
cefr: C1
topic: work
description: Explica un retraso con diplomacia y negocia una nueva fecha con tu cliente.
phrases:
  - id: heads-up
    text: I wanted to give you a heads-up that we're running slightly behind schedule.
    translation: Quería avisarte con antelación de que vamos un poco atrasados.
    visual_hint: "⏳📅"
    cloze: [6, 11]
    glossary:
      - {word: heads-up, meaning: "aviso anticipado (informal-profesional)"}
      - {word: behind schedule, meaning: "atrasado respecto al calendario"}
  - id: propose
    text: Would you be open to pushing the deadline back by a week?
    translation: ¿Estarías dispuesto a aplazar la fecha límite una semana?
    visual_hint: "↪️"
    cloze: [5, 7]
    glossary:
      - {word: open to, meaning: "dispuesto a considerar"}
      - {word: push back, meaning: "aplazar"}
  - id: trade-off
    text: That way we can deliver without compromising on quality.
    translation: Así podremos entregar sin sacrificar la calidad.
    visual_hint: "⚖️"
    cloze: [6]
    glossary:
      - {word: compromising, meaning: "comprometer / sacrificar", ipa: "ˈkɑːmprəmaɪzɪŋ"}
  - id: meet-halfway
    text: Perhaps we could meet halfway and ship the core features first.
    translation: Quizás podríamos llegar a un punto medio y entregar primero las funciones principales.
    visual_hint: "🤝"
    cloze: [3, 4]
    glossary:
      - {word: meet halfway, meaning: "llegar a un acuerdo intermedio"}
roleplay:
  ai_role: client project lead
  user_role: agency project manager
  setting: A weekly status call with an important client.
  turns:
    - {speaker: ai, text: "Morning! So, are we still on track for the launch on the fifteenth?"}
    - speaker: user
      goal: Avisa del retraso con diplomacia.
      suggested_lines: ["I wanted to give you a heads-up that we're running slightly behind schedule.", "Actually, we're running a bit behind schedule."]
    - {speaker: ai, text: "Hmm, that's not ideal. What are you proposing?"}
    - speaker: user
      goal: Propón aplazar una semana y justifícalo.
      suggested_lines: ["Would you be open to pushing the deadline back by a week? That way we can deliver without compromising on quality."]
    - {speaker: ai, text: "A full week is hard for us. Our marketing campaign is already booked."}
    - speaker: user
      goal: Ofrece un punto medio.
      suggested_lines: ["Perhaps we could meet halfway and ship the core features first.", "We could meet halfway and launch the core features on time."]
    - {speaker: ai, text: "That could work. Send me a revised plan by Friday."}
