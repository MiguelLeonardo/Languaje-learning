id: c1-maritime-port-clearance
title: Coordinating marina port clearance
title_es: Coordinar despacho portuario y atraque
cefr: C1
topic: travel-and-transport
description: Gestiona por radio VHF y en capitanía de puerto el atraque, conexión
  eléctrica y despacho de entrada.
phrases:
- id: request-berth-assignment
  text: Good afternoon, Harbormaster. We're a forty-five-foot sloop requesting a stern-to
    berth for three nights.
  translation: Buenas tardes, Capitán de Puerto. Somos un velero de cuarenta y cinco
    pies solicitando atraque de popa por tres noches.
  visual_hint: ⛵⚓
  cloze:
  - 4
  - 9
  glossary:
  - word: stern-to berth
    meaning: atraque de popa en muelle
    ipa: stɜːrn tuː bɜːrθ
- id: shore-power-and-water
  text: Does Slip C-14 have thirty-amp shore power and potable water hookups?
  translation: ¿El amarre C-14 cuenta con conexión eléctrica de treinta amperios y
    toma de agua potable?
  visual_hint: 🔌💧
  cloze:
  - 3
  - 7
  glossary:
  - word: shore power
    meaning: toma eléctrica de tierra
    ipa: ʃɔːr ˈpaʊər
- id: crew-list-and-registry
  text: Here are our ship's registry papers, hull insurance certificate, and stamped
    crew manifest.
  translation: Aquí están los documentos de registro del barco, póliza de casco y
    lista de tripulación sellada.
  visual_hint: 📑🛂
  cloze:
  - 4
  - 8
  glossary:
  - word: manifest
    meaning: rol de tripulación / manifiesto
    ipa: ˈmænɪfest
- id: marina-show-the-ropes
  text: The harbor master will show us the ropes at the marina.
  translation: El capitán de puerto nos enseñará cómo funcionan las cosas en la marina.
    (show the ropes = enseñar lo básico)
  visual_hint: ⚓🪢
  cloze:
  - 3
  - 7
  glossary:
  - word: show the ropes
    meaning: enseñar cómo funciona algo
    ipa: ʃəʊ ðə rəʊps
  kind: idiom
  apply_sentence: A veteran skipper showed the new crew ____ on the docks.
  apply_answer: the ropes
  apply_translation: Un capitán veterano enseñó a la nueva tripulación cómo funcionaba
    todo en los muelles.
- id: marina-smooth-sailing
  text: Once the paperwork is posted, it should be smooth sailing.
  translation: Una vez publicados los documentos, todo debería ir sobre ruedas. (smooth
    sailing = sin dificultades)
  visual_hint: ⛵😌
  cloze:
  - 3
  - 6
  glossary:
  - word: smooth sailing
    meaning: sin complicaciones
    ipa: smuːð ˈseɪlɪŋ
  kind: idiom
  apply_sentence: After customs, the rest of the trip was ____.
  apply_answer: smooth sailing
  apply_translation: Después de la aduana, el resto del viaje fue sobre ruedas.
roleplay:
  ai_role: harbormaster
  user_role: vessel captain
  setting: Port authority office at a Mediterranean marina.
  turns:
  - speaker: ai
    text: Harbormaster's office, welcome to Palma Marina! What is your vessel's length
      and draft?
  - speaker: user
    goal: Solicita un atraque de popa por tres noches para un velero de 45 pies.
    suggested_lines:
    - Good afternoon, Harbormaster. We're a forty-five-foot sloop requesting a stern-to
      berth for three nights.
    - Does Slip C-14 have thirty-amp shore power and potable water hookups?
  - speaker: ai
    text: With a two-meter draft, I can assign you to Slip C-14 on the outer pontoon.
  - speaker: user
    goal: Pregunta si el amarre C-14 tiene toma eléctrica y agua potable.
    suggested_lines:
    - Does Slip C-14 have thirty-amp shore power and potable water hookups?
    - Here are our ship's registry papers, hull insurance certificate, and stamped
      crew manifest.
  - speaker: ai
    text: Yes, C-14 has full pedestal utilities. May I inspect your vessel documents?
  - speaker: user
    goal: Entrega el registro de la embarcación, seguro y lista de tripulación.
    suggested_lines:
    - Here are our ship's registry papers, hull insurance certificate, and stamped
      crew manifest.
    - Tomorrow morning we'd like to top off diesel at the fuel dock before the charter
      guests embark.
  - speaker: ai
    text: All documents are in order. Here is your marina gate keycard.
  - speaker: user
    goal: Coordina recargar diésel mañana temprano antes de que suban los invitados.
    suggested_lines:
    - Tomorrow morning we'd like to top off diesel at the fuel dock before the charter
      guests embark.
    - We'll also schedule a holding-tank pump-out on Channel 9 prior to departure.
  - speaker: ai
    text: Wonderful! Everything is all set. Have a fantastic day!
