id: c1-private-dining-contract
title: Booking a private dining room
title_es: Contratar un salón privado en restaurante
cefr: C1
topic: food-and-drink
description: Negocia el consumo mínimo, la tarifa de descorche y el menú impreso para
  una cena ejecutiva de veinte personas.
phrases:
- id: minimum-food-spend
  text: Does the three-thousand-dollar minimum spend include service charges, or strictly
    food and beverage?
  translation: ¿El consumo mínimo de tres mil dólares incluye el cargo por servicio
    o estrictamente alimentos y bebidas?
  visual_hint: 📑🍷
  cloze:
  - 4
  - 8
  glossary:
  - word: minimum spend
    meaning: consumo mínimo
    ipa: ˈmɪnɪməm spend
- id: waive-corkage-fee
  text: If we order champagne through your cellar, would you waive corkage on two
    collector bottles?
  translation: Si pedimos el champán de su cava, ¿eximirían el descorche de dos botellas
    de colección?
  visual_hint: 🍾🤝
  cloze:
  - 5
  - 10
  glossary:
  - word: corkage
    meaning: derecho de descorche
    ipa: ˈkɔːrkɪdʒ
- id: three-choice-prix-fixe
  text: A three-course prix fixe with tableside entrée selection will keep service
    pacing brisk.
  translation: Un menú de precio fijo de tres tiempos con elección de plato fuerte
    en mesa mantendrá un ritmo ágil.
  visual_hint: 🍽️⏱️
  cloze:
  - 4
  - 8
  glossary:
  - word: prix fixe
    meaning: menú de precio fijo
    ipa: priː fɪks
- id: read-the-fine-print
  text: We should read the fine print before we sign.
  translation: 'Deberíamos leer la letra pequeña antes de firmar. (the fine print:
    letra pequeña)'
  visual_hint: 📄🔍
  cloze:
  - 3
  - 6
  glossary:
  - word: read the fine print
    meaning: 'read the fine print: leer la letra pequeña'
    ipa: faɪn prɪnt
  kind: idiom
  apply_sentence: Always ____ on any rental contract.
  apply_answer: read the fine print
  apply_translation: Lee siempre la letra pequeña en cualquier contrato de alquiler.
- id: iron-out
  text: We need to iron out the details of the minimum spend.
  translation: 'Debemos resolver los detalles del gasto mínimo. (iron out: resolver)'
  visual_hint: 📝🧩
  cloze:
  - 3
  - 7
  glossary:
  - word: iron out
    meaning: 'iron out: resolver, pulir'
    ipa: ˈaɪən
  kind: phrasal_verb
  apply_sentence: Let's ____ the last problems before Friday.
  apply_answer: iron out
  apply_translation: Resolvamos los últimos problemas antes del viernes.
roleplay:
  ai_role: private events director
  user_role: corporate host
  setting: Reviewing terms for an executive dinner in a private dining room.
  turns:
  - speaker: ai
    text: Our Glass Room seats twenty comfortably with a $3,000 minimum spend.
  - speaker: user
    goal: Pregunta si el consumo mínimo incluye el servicio o solo alimentos y bebidas.
    suggested_lines:
    - Does the three-thousand-dollar minimum spend include service charges, or strictly
      food and beverage?
    - If we order champagne through your cellar, would you waive corkage on two collector
      bottles?
  - speaker: ai
    text: It applies strictly to food and beverage before the 18% gratuity.
  - speaker: user
    goal: Propón que eximan el descorche de dos botellas si compran el champán allí.
    suggested_lines:
    - If we order champagne through your cellar, would you waive corkage on two collector
      bottles?
    - A three-course prix fixe with tableside entrée selection will keep service pacing
      brisk.
  - speaker: ai
    text: We can certainly waive corkage on two bottles. How would you like to structure
      the menu?
  - speaker: user
    goal: Elige un menú fijo de tres tiempos con selección en mesa para agilizar el
      servicio.
    suggested_lines:
    - A three-course prix fixe with tableside entrée selection will keep service pacing
      brisk.
    - Could you print bespoke menus featuring our company crest without listing individual
      prices?
  - speaker: ai
    text: Agreed—our kitchen handles tableside choices for up to twenty-four guests
      effortlessly.
  - speaker: user
    goal: Solicita menús impresos con su logotipo y sin precios individuales.
    suggested_lines:
    - Could you print bespoke menus featuring our company crest without listing individual
      prices?
    - We'll need a discreet screen for a ten-minute toast, then ambient lighting afterward.
  - speaker: ai
    text: Wonderful! Everything is all set. Have a fantastic day!
