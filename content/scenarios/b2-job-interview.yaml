id: b2-job-interview
title: Job interview small talk
title_es: Entrevista de trabajo
cefr: B2
topic: work-and-career
description: Preséntate profesionalmente, habla de tu experiencia y haz preguntas
  sobre el puesto.
phrases:
- id: tell-about-myself
  text: I've been working in customer support for about five years.
  translation: Llevo unos cinco años trabajando en atención al cliente.
  visual_hint: 💼🎧
  cloze:
  - 1
  - 2
  glossary:
  - word: been working
    meaning: 'present perfect continuous: acción que empezó en el pasado y continúa'
  - word: support
    meaning: soporte / atención
    ipa: səˈpɔːrt
- id: strength
  text: One of my main strengths is staying calm under pressure.
  translation: Una de mis principales fortalezas es mantener la calma bajo presión.
  visual_hint: 🧘
  cloze:
  - 4
  - 6
  glossary:
  - word: strengths
    meaning: fortalezas
    ipa: streŋkθs
  - word: under pressure
    meaning: bajo presión
- id: team-question
  text: Could you tell me a bit more about the team I'd be working with?
  translation: ¿Podría contarme un poco más sobre el equipo con el que trabajaría?
  visual_hint: 👥
  cloze:
  - 9
  glossary:
  - word: i'd
    meaning: I would (condicional)
- id: idm-break-the-ice
  text: Let me break the ice by saying I love your office.
  translation: 'Déjame romper el hielo diciendo que me encanta tu oficina. (break
    the ice: aliviar la tensión)'
  visual_hint: 🧊😄
  cloze:
  - 3
  - 7
  glossary:
  - word: break the ice
    meaning: romper el hielo
    ipa: breɪk ði aɪs
  kind: idiom
  apply_sentence: A quick joke helped ____ at the start of the panel.
  apply_answer: break the ice
  apply_translation: Un chiste rápido ayudó a romper el hielo al inicio del panel.
- id: idm-hit-the-ground-running
  text: I'm ready to hit the ground running if you hire me.
  translation: 'Estoy listo para empezar a toda marcha si me contratan. (hit the ground
    running: empezar con energía)'
  visual_hint: 🏃💼
  cloze:
  - 3
  - 7
  glossary:
  - word: hit the ground running
    meaning: empezar con fuerza
    ipa: hɪt ðə ɡraʊnd ˈrʌnɪŋ
  kind: idiom
  apply_sentence: The new director wanted to ____ during her first week.
  apply_answer: hit the ground running
  apply_translation: La nueva directora quería empezar a toda marcha durante su primera
    semana.
roleplay:
  ai_role: hiring manager
  user_role: candidate
  setting: A video interview for a customer success position.
  turns:
  - speaker: ai
    text: Thanks for joining us today. Could you start by telling me a little about
      yourself?
  - speaker: user
    goal: Resume tu experiencia.
    suggested_lines:
    - Sure. I've been working in customer support for about five years.
    - I've been working in sales for three years.
  - speaker: ai
    text: Interesting. What would you say is your biggest strength?
  - speaker: user
    goal: Describe una fortaleza.
    suggested_lines:
    - One of my main strengths is staying calm under pressure.
    - I'm very good at solving problems quickly.
  - speaker: ai
    text: That's important here. Do you have any questions for me?
  - speaker: user
    goal: Pregunta por el equipo o los próximos pasos.
    suggested_lines:
    - Could you tell me a bit more about the team I'd be working with?
    - What are the next steps in the hiring process?
  - speaker: ai
    text: Great question. We'll get back to you within a week with the next steps.
