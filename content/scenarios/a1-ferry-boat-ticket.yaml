id: a1-ferry-boat-ticket
title: Buying harbor ferry tickets
title_es: Comprar boletos de ferry
cefr: A1
topic: travel-and-transport
description: Compra dos boletos para el barco del puerto, pregunta si puedes sentarte
  afuera y a qué hora regresa.
phrases:
- id: two-ferry-tickets
  text: Two adult tickets for the island ferry, please.
  translation: Dos boletos de adulto para el ferry a la isla, por favor.
  visual_hint: ⛴️🎟️
  cloze:
  - 2
  - 5
  glossary:
  - word: island
    meaning: isla
    ipa: ˈaɪlənd
- id: sit-on-top-deck
  text: Can we sit outside on the top deck?
  translation: ¿Podemos sentarnos afuera en la cubierta superior?
  visual_hint: ☀️🌊
  cloze:
  - 2
  - 5
  glossary:
  - word: top deck
    meaning: cubierta superior
    ipa: tɑːp dek
- id: last-boat-back
  text: What time is the last boat back to the city?
  translation: ¿A qué hora sale el último barco de regreso a la ciudad?
  visual_hint: 🌇⛴️
  cloze:
  - 3
  - 6
  glossary:
  - word: last
    meaning: último
    ipa: læst
- id: ferry-take-a-seat
  text: Take a seat on the top deck and enjoy the view.
  translation: Siéntate en la cubierta superior y disfruta de la vista. (take a seat
    = sentarse)
  visual_hint: 💺⛴️
  cloze:
  - 3
  - 7
  glossary:
  - word: take a seat
    meaning: sentarse
    ipa: teɪk ə siːt
  kind: expression
  apply_sentence: Please ____ here while we wait for the boat.
  apply_answer: take a seat
  apply_translation: Por favor, siéntate aquí mientras esperamos el barco.
- id: ferry-have-a-look
  text: Let's have a look at the harbor map before the ferry leaves.
  translation: Echemos un vistazo al mapa del puerto antes de que salga el ferri.
    (have a look = echar un vistazo)
  visual_hint: 👀🗺️
  cloze:
  - 4
  - 8
  glossary:
  - word: have a look
    meaning: echar un vistazo
    ipa: hæv ə lʊk
  kind: expression
  apply_sentence: Can I ____ at your ticket, please?
  apply_answer: have a look
  apply_translation: ¿Puedo echar un vistazo a tu boleto, por favor?
roleplay:
  ai_role: ticket agent
  user_role: tourist
  setting: Harbor pier ticket booth on a sunny day.
  turns:
  - speaker: ai
    text: Welcome to the harbor pier! Where are you sailing today?
  - speaker: user
    goal: Pide dos boletos de adulto para el ferry a la isla.
    suggested_lines:
    - Two adult tickets for the island ferry, please.
    - Can we sit outside on the top deck?
  - speaker: ai
    text: Two adult tickets! The boat boards at Gate B in ten minutes.
  - speaker: user
    goal: Pregunta si pueden sentarse afuera en la cubierta superior.
    suggested_lines:
    - Can we sit outside on the top deck?
    - What time is the last boat back to the city?
  - speaker: ai
    text: Yes, the upper deck has open seats and great views of the bridge.
  - speaker: user
    goal: Pregunta a qué hora sale el último barco de regreso.
    suggested_lines:
    - What time is the last boat back to the city?
    - Is the boat ride thirty minutes long?
  - speaker: ai
    text: The last ferry back from the island leaves at 7:00 PM.
  - speaker: user
    goal: Pregunta si el viaje dura treinta minutos.
    suggested_lines:
    - Is the boat ride thirty minutes long?
    - Where do we wait for boarding?
  - speaker: ai
    text: Wonderful! Everything is all set. Have a fantastic day!
