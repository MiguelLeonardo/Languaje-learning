id: a2-requesting-vacation-days
title: Requesting two vacation days
title_es: Solicitar dos días de vacaciones
cefr: A2
topic: work-and-career
description: Pide a tu supervisora tomar libres el viernes y el lunes próximos y explica
  quién cubrirá tus tareas.
phrases:
- id: take-friday-monday-off
  text: Hi Elena, could I request this coming Friday and Monday as vacation days?
  translation: Hola Elena, ¿podría solicitar este próximo viernes y lunes como días
    de vacaciones?
  visual_hint: 🗓️✈️
  cloze:
  - 4
  - 8
  glossary:
  - word: request
    meaning: solicitar / pedir
    ipa: rɪˈkwest
- id: finish-tasks-by-thursday
  text: I will finish all my weekly reports before Thursday afternoon.
  translation: Terminaré todos mis reportes semanales antes del jueves por la tarde.
  visual_hint: 📊✅
  cloze:
  - 3
  - 6
  glossary:
  - word: before
    meaning: antes de
    ipa: bɪˈfɔːr
- id: carlos-can-cover-urgent
  text: Carlos agreed to cover any urgent client emails while I'm away.
  translation: Carlos aceptó cubrir cualquier correo urgente de clientes mientras
    no esté.
  visual_hint: 🤝📧
  cloze:
  - 3
  - 7
  glossary:
  - word: while I'm away
    meaning: mientras estoy ausente
    ipa: waɪl aɪm əˈweɪ
- id: idm-take-time-off
  text: I would like to take time off next Friday.
  translation: 'Me gustaría tomarme tiempo libre el próximo viernes. (take time off:
    pedir días libres)'
  visual_hint: 🏖️📅
  cloze:
  - 3
  - 6
  glossary:
  - word: take time off
    meaning: tomarse días libres
    ipa: teɪk taɪm ɔːf
  kind: expression
  apply_sentence: She wants to ____ in August to visit her family.
  apply_answer: take time off
  apply_translation: Ella quiere tomarse días libres en agosto para visitar a su familia.
- id: idm-fill-in
  text: Who can fill in for me while I am away?
  translation: '¿Quién puede sustituirme mientras estoy fuera? (fill in: suplir a
    alguien)'
  visual_hint: 🔄🧑‍💼
  cloze:
  - 3
  - 6
  glossary:
  - word: fill in
    meaning: sustituir
    ipa: fɪl ɪn
  kind: phrasal_verb
  apply_sentence: Tom will ____ for Maria at the front desk.
  apply_answer: fill in
  apply_translation: Tom sustituirá a María en recepción.
roleplay:
  ai_role: team manager
  user_role: employee
  setting: Quick check-in at your manager's office.
  turns:
  - speaker: ai
    text: Hi! Come on in. What did you want to chat about?
  - speaker: user
    goal: Solicita tomar el viernes y el lunes como días de vacaciones.
    suggested_lines:
    - Hi Elena, could I request this coming Friday and Monday as vacation days?
    - I will finish all my weekly reports before Thursday afternoon.
  - speaker: ai
    text: Let's look at the team calendar for next week. How are your current tasks
      looking?
  - speaker: user
    goal: Asegura que terminarás todos tus reportes antes del jueves por la tarde.
    suggested_lines:
    - I will finish all my weekly reports before Thursday afternoon.
    - Carlos agreed to cover any urgent client emails while I'm away.
  - speaker: ai
    text: That's great planning! Who can keep an eye on your client inbox on Friday?
  - speaker: user
    goal: Explica que Carlos cubrirá cualquier correo urgente en tu ausencia.
    suggested_lines:
    - Carlos agreed to cover any urgent client emails while I'm away.
    - I'll submit the dates in the HR portal right now for your approval.
  - speaker: ai
    text: Perfect! Go ahead and log the request in the system and I'll approve it
      today.
  - speaker: user
    goal: Indica que registrarás las fechas en el portal de RR. HH. para su aprobación.
    suggested_lines:
    - I'll submit the dates in the HR portal right now for your approval.
    - I'll also set up an automatic out-of-office email reply on Thursday evening.
  - speaker: ai
    text: Wonderful! Everything is all set. Have a fantastic day!
