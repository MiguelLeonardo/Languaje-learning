id: a1-fruit-market-stand
title: Buying fresh fruit at the market
title_es: Comprar fruta en el mercado
cefr: A1
topic: food-and-drink
description: Compra manzanas rojas, plátanos maduros y fresas en un puesto del mercado.
phrases:
- id: four-red-apples
  text: I would like four red apples, please.
  translation: Quisiera cuatro manzanas rojas, por favor.
  visual_hint: 🍎🧺
  cloze:
  - 2
  - 4
  glossary:
  - word: apples
    meaning: manzanas
    ipa: ˈæpəlz
- id: ripe-bananas
  text: Are these yellow bananas ripe for today?
  translation: ¿Estos plátanos amarillos están maduros para hoy?
  visual_hint: 🍌✨
  cloze:
  - 2
  - 4
  glossary:
  - word: ripe
    meaning: maduro
    ipa: raɪp
- id: box-of-berries
  text: I will also take one box of strawberries.
  translation: También me llevo una caja de fresas.
  visual_hint: 🍓📦
  cloze:
  - 2
  - 5
  glossary:
  - word: box
    meaning: caja
    ipa: bɑːks
- id: a-bunch-of
  text: I would like a bunch of ripe bananas, please.
  translation: 'Quisiera un racimo de plátanos maduros, por favor. (a bunch of: un
    manojo/racimo de)'
  visual_hint: 🍌🛒
  cloze:
  - 3
  - 6
  glossary:
  - word: a bunch of
    meaning: 'a bunch of: un manojo de'
    ipa: bʌntʃ
  kind: expression
  apply_sentence: She gave me ____ flowers for my birthday.
  apply_answer: a bunch of
  apply_translation: Ella me dio un ramo de flores por mi cumpleaños.
- id: have-a-look
  text: Can I have a look at those sweet oranges?
  translation: '¿Puedo echar un vistazo a esas naranjas dulces? (have a look: echar
    un vistazo)'
  visual_hint: 🍊👀
  cloze:
  - 3
  - 6
  glossary:
  - word: have a look
    meaning: 'have a look: echar un vistazo'
    ipa: lʊk
  kind: expression
  apply_sentence: Let me ____ at your photos from the trip.
  apply_answer: have a look
  apply_translation: Déjame echar un vistazo a tus fotos del viaje.
roleplay:
  ai_role: vendor
  user_role: shopper
  setting: An open-air morning fruit market.
  turns:
  - speaker: ai
    text: Good morning! Fresh fruit today. What would you like?
  - speaker: user
    goal: Pide cuatro manzanas rojas.
    suggested_lines:
    - I would like four red apples, please.
    - Are these yellow bananas ripe for today?
  - speaker: ai
    text: Four red apples! Anything else from the stand?
  - speaker: user
    goal: Pregunta si los plátanos están maduros.
    suggested_lines:
    - Are these yellow bananas ripe for today?
    - I will also take one box of strawberries.
  - speaker: ai
    text: Yes, they are sweet and ready to eat!
  - speaker: user
    goal: Agrega una caja de fresas.
    suggested_lines:
    - I will also take one box of strawberries.
    - How much is everything together?
  - speaker: ai
    text: One box of strawberries. I have my own bag right here.
  - speaker: user
    goal: Pregunta cuánto es todo junto.
    suggested_lines:
    - How much is everything together?
    - These oranges smell very fresh.
  - speaker: ai
    text: Wonderful! Everything is all set. Have a fantastic day!
