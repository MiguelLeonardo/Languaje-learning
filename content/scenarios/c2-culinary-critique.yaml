id: c2-culinary-critique
title: Gastronomic critique & chef's table
title_es: Crítica gastronómica en la mesa del chef
cefr: C2
topic: food-and-drink
description: Dialoga con el chef ejecutivo sobre técnicas de fermentación, contraste
  de texturas y trazabilidad de ingredientes.
phrases:
- id: textural-juxtaposition
  text: The textural juxtaposition between the crispy skin and the silky purée was
    sublime.
  translation: El contraste de texturas entre la piel crujiente y el puré sedoso fue
    sublime.
  visual_hint: 👨‍🍳✨
  cloze:
  - 1
  - 2
  - 9
  - 12
  glossary:
  - word: juxtaposition
    meaning: contraste / yuxtaposición
    ipa: ˌdʒʌkstəpəˈzɪʃən
  - word: sublime
    meaning: sublime / extraordinario
    ipa: səˈblaɪm
- id: umami-depth
  text: Fermenting the black garlic clearly imparted an extraordinary depth of umami
    to the broth.
  translation: Fermentar el ajo negro claramente aportó una extraordinaria profundidad
    de umami al caldo.
  visual_hint: 🧄🍲
  cloze:
  - 0
  - 5
  - 8
  - 13
  glossary:
  - word: imparted
    meaning: aportó / confirió
    ipa: ɪmˈpɑːrtɪd
  - word: broth
    meaning: caldo / consomé
    ipa: brɔːθ
- id: hyper-local-sourcing
  text: How do you maintain menu consistency while relying strictly on hyper-local
    foraging?
  translation: ¿Cómo mantienen la consistencia del menú dependiendo estrictamente
    de la recolección hiperlocal?
  visual_hint: 🍄🌱
  cloze:
  - 4
  - 7
  - 11
  glossary:
  - word: relying on
    meaning: dependiendo de / apoyándose en
    ipa: rɪˈlaɪɪŋ ɑːn
  - word: foraging
    meaning: recolección silvestre
    ipa: ˈfɔːrɪdʒɪŋ
- id: less-is-more
  text: In plating, less is more; he understood that perfectly.
  translation: 'En el emplatado, menos es más; él lo entendió perfectamente. (less
    is more: la sencillez es mejor)'
  visual_hint: 🍽️✨
  cloze:
  - 3
  - 6
  glossary:
  - word: less is more
    meaning: 'less is more: menos es más'
    ipa: les
  kind: idiom
  apply_sentence: With minimalist design, ____, as the architect says.
  apply_answer: less is more
  apply_translation: En el diseño minimalista, menos es más, como dice el arquitecto.
- id: damn-with-faint-praise
  text: Calling it 'competent' is to damn with faint praise.
  translation: Llamarlo 'competente' es condenar con un elogio tibio. (damn with faint
    praise)
  visual_hint: 📝😏
  cloze:
  - 3
  - 6
  glossary:
  - word: damn with faint praise
    meaning: 'damn with faint praise: elogiar tan poco que es crítica'
    ipa: feɪnt
  kind: idiom
  apply_sentence: To call her debut 'adequate' is to ____.
  apply_answer: damn with faint praise
  apply_translation: Llamar 'adecuado' a su debut es condenarlo con un elogio tibio.
roleplay:
  ai_role: executive chef
  user_role: culinary critic
  setting: Chef's counter at the end of a twelve-course tasting menu.
  turns:
  - speaker: ai
    text: Thank you for dining at the counter tonight. What did you think of the seared
      scallop and black garlic course?
  - speaker: user
    goal: Elogia el contraste de texturas y la profundidad umami del ajo negro fermentado.
    suggested_lines:
    - The textural juxtaposition between the crispy skin and the silky purée was sublime.
    - Fermenting the black garlic clearly imparted an extraordinary depth of umami
      to the broth.
  - speaker: ai
    text: We calibrate the cold-smoking to the second so we don't overwhelm the shellfish.
  - speaker: user
    goal: Comenta que un humo más intenso habría ocultado el dulzor de la vieira.
    suggested_lines:
    - Had the smoke infusion been even slightly heavier, it might have masked the
      scallop's sweetness.
    - The balance was exact; any heavier smoke would have masked the sweetness.
  - speaker: ai
    text: All our herbs and mushrooms are foraged within thirty miles of the kitchen
      each morning.
  - speaker: user
    goal: Pregunta cómo mantienen la consistencia dependiendo de ingredientes silvestres
      locales.
    suggested_lines:
    - How do you maintain menu consistency while relying strictly on hyper-local foraging?
    - How do you balance consistency with hyper-local foraging?
  - speaker: ai
    text: We adapt the micro-garnishes daily while keeping the core flavor architecture
      intact.
  - speaker: user
    goal: Destaca la sobriedad del emplatado y la narrativa cohesiva del menú.
    suggested_lines:
    - What struck me most was the restraint in plating—every element earned its place.
    - Each course unfolded like a cohesive narrative bridging ancestral technique
      and modern precision.
  - speaker: ai
    text: That means the world to our brigade. It was an honor cooking for you tonight.
