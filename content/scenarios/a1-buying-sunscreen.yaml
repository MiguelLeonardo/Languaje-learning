id: a1-buying-sunscreen
title: Buying sunscreen and aloe vera
title_es: Comprar protector solar en la farmacia
cefr: A1
topic: health-and-emergencies
description: Pide un bloqueador solar factor 50 y gel de aloe vera para una quemadura
  de sol en la playa.
phrases:
- id: sunscreen-fifty-spf
  text: Hello, do you have sunscreen with SPF 50?
  translation: Hola, ¿tienen protector solar con factor 50?
  visual_hint: 🧴☀️
  cloze:
  - 2
  - 5
  glossary:
  - word: sunscreen
    meaning: protector / bloqueador solar
    ipa: ˈsʌnskriːn
- id: red-shoulders-from-sun
  text: My shoulders are red from the sun today.
  translation: Mis hombros están rojos por el sol de hoy.
  visual_hint: 🏖️🔴
  cloze:
  - 2
  - 5
  glossary:
  - word: shoulders
    meaning: hombros
    ipa: ˈʃoʊldərz
- id: cooling-aloe-gel
  text: Do you have cold aloe vera gel for my skin?
  translation: ¿Tienen gel frío de aloe vera para mi piel?
  visual_hint: 🌿🧊
  cloze:
  - 3
  - 6
  glossary:
  - word: skin
    meaning: piel
    ipa: skɪn
- id: idm-put-on-a1
  text: Please put on sunscreen before you go to the beach.
  translation: Por favor, ponte protector solar antes de ir a la playa. (put on =
    aplicarse/ponerse)
  visual_hint: 🧴☀️
  cloze:
  - 3
  - 6
  glossary:
  - word: put on
    meaning: ponerse (ropa, crema)
    ipa: pʊt ɒn
  kind: phrasal_verb
  apply_sentence: It is cold today, so ____ your jacket.
  apply_answer: put on
  apply_translation: Hace frío hoy, así que ponte tu chaqueta.
- id: idm-pick-out-a1
  text: Can you help me pick out a good lotion?
  translation: ¿Puede ayudarme a elegir una buena loción? (pick out = elegir)
  visual_hint: 🛍️🧴
  cloze:
  - 3
  - 6
  glossary:
  - word: pick out
    meaning: elegir, escoger
    ipa: pɪk aʊt
  kind: phrasal_verb
  apply_sentence: I want to ____ a gift for my mother.
  apply_answer: pick out
  apply_translation: Quiero elegir un regalo para mi madre.
roleplay:
  ai_role: pharmacist
  user_role: beachgoer
  setting: A coastal pharmacy on a hot sunny day.
  turns:
  - speaker: ai
    text: Hello! Welcome to Beach Pharmacy. How can I help you?
  - speaker: user
    goal: Pregunta si tienen protector solar con factor 50.
    suggested_lines:
    - Hello, do you have sunscreen with SPF 50?
    - My shoulders are red from the sun today.
  - speaker: ai
    text: Yes, here is our waterproof SPF 50 lotion.
  - speaker: user
    goal: Explica que tus hombros están rojos por el sol.
    suggested_lines:
    - My shoulders are red from the sun today.
    - Do you have cold aloe vera gel for my skin?
  - speaker: ai
    text: Oh, a mild sunburn! You should put cooling gel on it.
  - speaker: user
    goal: Pide gel frío de aloe vera para tu piel.
    suggested_lines:
    - Do you have cold aloe vera gel for my skin?
    - I will also buy two big bottles of water.
  - speaker: ai
    text: This green aloe gel feels very cool and gentle.
  - speaker: user
    goal: Agrega dos botellas grandes de agua.
    suggested_lines:
    - I will also buy two big bottles of water.
    - Put the gel on three times a day.
  - speaker: ai
    text: Wonderful! Everything is all set. Have a fantastic day!
