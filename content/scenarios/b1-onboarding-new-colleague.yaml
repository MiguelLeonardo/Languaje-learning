id: b1-onboarding-new-colleague
title: Onboarding a new team member
title_es: Guiar a un nuevo compañero de equipo
cefr: B1
topic: work-and-career
description: Muéstrale a un compañero nuevo cómo están organizadas las carpetas compartidas
  y las reuniones semanales.
phrases:
- id: walk-through-shared-drive
  text: Welcome to the team, Lucas! Let me walk you through our shared Google Drive
    folders.
  translation: ¡Bienvenido al equipo, Lucas! Déjame mostrarte paso a paso nuestras
    carpetas compartidas.
  visual_hint: 📂🤝
  cloze:
  - 5
  - 10
  glossary:
  - word: walk you through
    meaning: explicarte paso a paso
    ipa: wɔːk juː θruː
- id: active-client-templates
  text: All the active client presentations and brand guidelines live inside this
    '01-Current' folder.
  translation: Todas las presentaciones activas y guías de marca están dentro de esta
    carpeta '01-Current'.
  visual_hint: 📊🗂️
  cloze:
  - 4
  - 8
  glossary:
  - word: guidelines
    meaning: lineamientos / guías
    ipa: ˈɡaɪdlaɪnz
- id: monday-kickoff-board
  text: Every Monday at nine thirty, we review the Kanban board together to assign
    priorities.
  translation: Cada lunes a las nueve y media revisamos juntos el tablero Kanban para
    asignar prioridades.
  visual_hint: 📋🕤
  cloze:
  - 4
  - 9
  glossary:
  - word: assign
    meaning: asignar
    ipa: əˈsaɪn
- id: idm-learn-the-ropes
  text: Don't worry, you'll soon learn the ropes around here.
  translation: 'No te preocupes, pronto aprenderás cómo funcionan las cosas aquí.
    (learn the ropes: aprender lo básico)'
  visual_hint: 🧭🧑‍💼
  cloze:
  - 3
  - 6
  glossary:
  - word: learn the ropes
    meaning: aprender los trucos
    ipa: lɜːrn ðə roʊps
  kind: idiom
  apply_sentence: It takes a few weeks to ____ in a new job.
  apply_answer: learn the ropes
  apply_translation: Se tarda unas semanas en aprender cómo funciona un trabajo nuevo.
- id: idm-feel-free
  text: Feel free to ask me anything about the tools.
  translation: 'Siéntete libre de preguntarme lo que quieras sobre las herramientas.
    (feel free: no dudes en)'
  visual_hint: 🙌💬
  cloze:
  - 3
  - 6
  glossary:
  - word: feel free
    meaning: no dudes en
    ipa: fiːl friː
  kind: expression
  apply_sentence: ____ to use my notes if they help you.
  apply_answer: Feel free
  apply_translation: Siéntete libre de usar mis notas si te ayudan.
roleplay:
  ai_role: new hire (Lucas)
  user_role: onboarding buddy
  setting: Sitting together at a shared desk during Lucas's first week.
  turns:
  - speaker: ai
    text: Thanks for being my onboarding buddy! Where do we keep the current project
      templates?
  - speaker: user
    goal: Dale la bienvenida y ofrécele mostrarle las carpetas compartidas.
    suggested_lines:
    - Welcome to the team, Lucas! Let me walk you through our shared Google Drive
      folders.
    - All the active client presentations and brand guidelines live inside this '01-Current'
      folder.
  - speaker: ai
    text: That folder structure is super clean! How does the team track weekly tasks?
  - speaker: user
    goal: Explica que las presentaciones y guías están en la carpeta '01-Current'.
    suggested_lines:
    - All the active client presentations and brand guidelines live inside this '01-Current'
      folder.
    - Every Monday at nine thirty, we review the Kanban board together to assign priorities.
  - speaker: ai
    text: Got it—I'll bookmark the Kanban board in my browser right now.
  - speaker: user
    goal: Cuenta que los lunes a las 9:30 revisan el tablero para asignar prioridades.
    suggested_lines:
    - Every Monday at nine thirty, we review the Kanban board together to assign priorities.
    - There's a lot to take in during week one, so ping me anytime if you get stuck!
  - speaker: ai
    text: Everyone has been so welcoming! What should I focus on finishing before
      Friday?
  - speaker: user
    goal: Anímalo a escribirte en cualquier momento si tiene dudas durante la primera
      semana.
    suggested_lines:
    - There's a lot to take in during week one, so ping me anytime if you get stuck!
    - Tomorrow you can shadow our client discovery call just to see how we run it.
  - speaker: ai
    text: Wonderful! Everything is all set. Have a fantastic day!
