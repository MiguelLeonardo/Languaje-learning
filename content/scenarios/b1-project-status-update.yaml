id: b1-project-status-update
title: Giving a daily standup update
title_es: Dar un avance diario de proyecto
cefr: B1
topic: work-and-career
description: Explica en la reunión diaria qué completaste ayer, en qué trabajas hoy
  y si tienes algún bloqueo.
phrases:
- id: wrapped-up-feature
  text: Yesterday I finished testing the payment page and fixed two small bugs.
  translation: Ayer terminé de probar la página de pagos y corregí dos pequeños errores.
  visual_hint: ✅💻
  cloze:
  - 2
  - 3
  - 8
  glossary:
  - word: testing
    meaning: probando / haciendo pruebas
    ipa: ˈtestɪŋ
  - word: bugs
    meaning: errores de código / fallos
    ipa: bʌɡz
- id: focusing-today-on
  text: Today my main priority is connecting the checkout form to the database.
  translation: Hoy mi prioridad principal es conectar el formulario de pago a la base
    de datos.
  visual_hint: 🎯🗄️
  cloze:
  - 2
  - 3
  - 6
  glossary:
  - word: priority
    meaning: prioridad
    ipa: praɪˈɔːrəti
  - word: checkout form
    meaning: formulario de compra
    ipa: ˈtʃekaʊt fɔːrm
- id: waiting-on-api
  text: I'm currently blocked waiting for the updated API keys from security.
  translation: Actualmente estoy bloqueado esperando las llaves de API actualizadas
    de seguridad.
  visual_hint: 🚧🔑
  cloze:
  - 2
  - 3
  - 7
  glossary:
  - word: blocked
    meaning: bloqueado / detenido
    ipa: blɑːkt
  - word: waiting for
    meaning: esperando por
    ipa: ˈweɪtɪŋ fɔːr
- id: idm-on-track
  text: Our project is on track to finish by Friday.
  translation: 'Nuestro proyecto va bien para terminar el viernes. (on track: según
    lo previsto)'
  visual_hint: 📈✅
  cloze:
  - 3
  - 6
  glossary:
  - word: on track
    meaning: según lo previsto
    ipa: ɑːn træk
  kind: idiom
  apply_sentence: Thanks to the extra help, we are still ____ for the release.
  apply_answer: on track
  apply_translation: Gracias a la ayuda extra, seguimos en camino para el lanzamiento.
- id: idm-run-into
  text: Yesterday I ran into a problem with the database.
  translation: 'Ayer me topé con un problema con la base de datos. (run into: encontrarse
    con)'
  visual_hint: 🚧🗄️
  cloze:
  - 3
  - 6
  glossary:
  - word: run into
    meaning: toparse con
    ipa: rʌn ˈɪntuː
  kind: phrasal_verb
  apply_sentence: Last week we ____ trouble with the server.
  apply_answer: ran into
  apply_translation: La semana pasada nos topamos con problemas con el servidor.
roleplay:
  ai_role: scrum master
  user_role: team member
  setting: Morning 10-minute agile daily standup.
  turns:
  - speaker: ai
    text: Morning everyone! Let's go around the room. How did the payment module go
      yesterday?
  - speaker: user
    goal: Cuenta que ayer terminaste de probar la página de pagos y corregiste dos
      bugs.
    suggested_lines:
    - Yesterday I finished testing the payment page and fixed two small bugs.
    - Today my main priority is connecting the checkout form to the database.
  - speaker: ai
    text: Nice progress! What are you focusing on today, and do you have any blockers?
  - speaker: user
    goal: Explica tu prioridad de hoy y que estás bloqueado esperando las llaves de
      API.
    suggested_lines:
    - I'm currently blocked waiting for the updated API keys from security.
    - Today my main priority is connecting the checkout form to the database.
  - speaker: ai
    text: I'll ping the security lead right now to get those keys unlocked. Will this
      impact Friday's release?
  - speaker: user
    goal: Confirma que en cuanto tengas acceso seguirán a tiempo para el viernes.
    suggested_lines:
    - Once I get access, we'll still be on track for Friday's release.
    - Other than that, everything is moving smoothly on my end.
  - speaker: ai
    text: Great to hear. Do you need anyone to review your code today?
  - speaker: user
    goal: Pide diez minutos después del standup para revisar el pull request.
    suggested_lines:
    - Could we sync for ten minutes after standup to review the pull request?
    - Yes, let's sync after standup to review the pull request.
  - speaker: ai
    text: Sure thing, let's stay on the line right after this!
