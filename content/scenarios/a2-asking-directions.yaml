id: a2-asking-directions
title: Asking for directions
title_es: Pedir indicaciones
cefr: A2
topic: travel-and-transport
description: Pregunta cómo llegar a un lugar y entiende indicaciones simples.
phrases:
- id: excuse-me
  text: Excuse me, is there a pharmacy near here?
  translation: Disculpe, ¿hay una farmacia cerca de aquí?
  visual_hint: 💊📍
  cloze:
  - 5
  - 6
  glossary:
  - word: pharmacy
    meaning: farmacia
    ipa: ˈfɑːrməsi
  - word: near
    meaning: cerca
    ipa: nɪr
- id: how-do-i-get
  text: How do I get to the train station?
  translation: ¿Cómo llego a la estación de tren?
  visual_hint: 🚉
  cloze:
  - 3
  glossary:
  - word: get to
    meaning: llegar a
    ipa: ɡet tuː
  - word: station
    meaning: estación
    ipa: ˈsteɪʃən
- id: is-it-far
  text: Is it far from here?
  translation: ¿Está lejos de aquí?
  visual_hint: 📏
  cloze:
  - 2
  glossary:
  - word: far
    meaning: lejos
    ipa: fɑːr
- id: directions-end-up
  text: If you turn left here, you will end up at the river.
  translation: Si giras a la izquierda aquí, terminarás en el río. (end up = terminar
    en)
  visual_hint: 🧭🌉
  cloze:
  - 4
  - 8
  glossary:
  - word: end up
    meaning: terminar en
    ipa: end ʌp
  kind: phrasal_verb
  apply_sentence: We took the wrong bus and ____ in another town.
  apply_answer: end up
  apply_translation: Tomamos el autobús equivocado y terminamos en otro pueblo.
- id: directions-turn-around
  text: You went too far, so turn around and walk back.
  translation: Fuiste demasiado lejos, así que date la vuelta y camina de regreso.
    (turn around = dar la vuelta)
  visual_hint: 🔄🗺️
  cloze:
  - 3
  - 6
  glossary:
  - word: turn around
    meaning: dar la vuelta
    ipa: tɜːn əˈraʊnd
  kind: phrasal_verb
  apply_sentence: The taxi driver had to ____ because the road was closed.
  apply_answer: turn around
  apply_translation: El taxista tuvo que dar la vuelta porque la calle estaba cerrada.
roleplay:
  ai_role: local resident
  user_role: tourist
  setting: A street corner in a city you are visiting.
  turns:
  - speaker: ai
    text: Hi there, you look a little lost. Can I help?
  - speaker: user
    goal: Pregunta cómo llegar a la estación de tren.
    suggested_lines:
    - Yes, please. How do I get to the train station?
    - How do I get to the train station?
  - speaker: ai
    text: Go straight for two blocks, then turn left at the bank.
  - speaker: user
    goal: Pide que repita.
    suggested_lines:
    - Sorry, could you repeat that, please?
    - Could you repeat that, please?
  - speaker: ai
    text: Of course. Two blocks straight, then left at the bank.
  - speaker: user
    goal: Pregunta si está lejos.
    suggested_lines:
    - Is it far from here?
    - Thanks. Is it far from here?
  - speaker: ai
    text: Not at all, about five minutes on foot.
