id: c1-sustainable-seafood-sourcing
title: Inquiring about sustainable seafood
title_es: Consultar sobre pesca sostenible y trazabilidad
cefr: C1
topic: food-and-drink
description: Conversa con el chef de un restaurante costero sobre pesca de anzuelo,
  vedas y trazabilidad marina.
phrases:
- id: line-caught-wild
  text: Is the halibut line-caught in local waters or sourced from offshore trawlers?
  translation: ¿El fletán es pescado con anzuelo en aguas locales o proviene de arrastreros
    de altura?
  visual_hint: 🎣🐟
  cloze:
  - 4
  - 8
  glossary:
  - word: line-caught
    meaning: pescado con caña / anzuelo
    ipa: laɪn kɔːt
- id: bycatch-mitigation
  text: We try to support fisheries that actively minimize bycatch and seabed disruption.
  translation: Intentamos apoyar pesquerías que minimizan activamente la captura incidental
    y el daño al fondo marino.
  visual_hint: 🌊🐢
  cloze:
  - 4
  - 8
  glossary:
  - word: bycatch
    meaning: captura incidental
    ipa: ˈbaɪkætʃ
- id: hand-harvested-scallops
  text: Knowing the scallops are hand-harvested by divers makes the dish even more
    compelling.
  translation: Saber que las vieiras son recolectadas a mano por buzos hace que el
    plato sea aún más atractivo.
  visual_hint: 🤿🐚
  cloze:
  - 4
  - 8
  glossary:
  - word: hand-harvested
    meaning: recolectadas a mano
    ipa: hænd ˈhɑːrvɪstɪd
- id: a-drop-in-the-ocean
  text: Our efforts are just a drop in the ocean, honestly.
  translation: 'Nuestros esfuerzos son solo una gota en el océano, la verdad. (a drop
    in the ocean: muy poco)'
  visual_hint: 🌊💧
  cloze:
  - 3
  - 6
  glossary:
  - word: a drop in the ocean
    meaning: 'a drop in the ocean: una gota en el mar'
    ipa: ˈəʊʃn
  kind: idiom
  apply_sentence: Those complaints were only ____.
  apply_answer: a drop in the ocean
  apply_translation: Esas quejas eran solo una gota en el océano.
- id: swimming-against-the-tide
  text: Sourcing only line-caught fish means swimming against the tide.
  translation: 'Comprar solo pescado de línea es ir contracorriente. (swimming against
    the tide: ir contracorriente)'
  visual_hint: 🐟🌊
  cloze:
  - 3
  - 6
  glossary:
  - word: swimming against the tide
    meaning: 'swim against the tide: ir contracorriente'
    ipa: taɪd
  kind: idiom
  apply_sentence: He felt he was ____ in that conservative office.
  apply_answer: swimming against the tide
  apply_translation: Sentía que iba contracorriente en esa oficina conservadora.
roleplay:
  ai_role: seafood chef
  user_role: conscious diner
  setting: An oceanfront seafood restaurant known for ethical sourcing.
  turns:
  - speaker: ai
    text: Good evening! Tonight our featured catch is Pacific halibut and diver scallops.
  - speaker: user
    goal: Pregunta si el fletán es de pesca artesanal con anzuelo.
    suggested_lines:
    - Is the halibut line-caught in local waters or sourced from offshore trawlers?
    - We try to support fisheries that actively minimize bycatch and seabed disruption.
  - speaker: ai
    text: All our halibut is hook-and-line caught by day-boats out of Half Moon Bay.
  - speaker: user
    goal: Explica que prefieren apoyar pesquerías que reducen la captura incidental.
    suggested_lines:
    - We try to support fisheries that actively minimize bycatch and seabed disruption.
    - Knowing the scallops are hand-harvested by divers makes the dish even more compelling.
  - speaker: ai
    text: That's our core philosophy too—we never buy dredged shellfish.
  - speaker: user
    goal: Celebra que las vieiras sean recolectadas a mano y pide ese plato.
    suggested_lines:
    - Knowing the scallops are hand-harvested by divers makes the dish even more compelling.
    - I love that your menu lists the vessel name and landing port for full traceability.
  - speaker: ai
    text: I'll fire an order of the diver scallops and halibut for your table right
      away!
  - speaker: user
    goal: Elogia la trazabilidad del menú indicando la embarcación y el puerto.
    suggested_lines:
    - I love that your menu lists the vessel name and landing port for full traceability.
    - Which of the cold-water oysters has the cleanest briny finish tonight?
  - speaker: ai
    text: Wonderful! Everything is all set. Have a fantastic day!
