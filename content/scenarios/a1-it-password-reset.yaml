id: a1-it-password-reset
title: Asking IT to reset a password
title_es: Pedir soporte técnico para contraseña
cefr: A1
topic: work-and-career
description: Pide ayuda al escritorio de soporte técnico porque tu contraseña de correo bloqueó tu cuenta.
phrases:
- id: locked-out-of-email
  text: Hi! I cannot log in to my work email this morning.
  translation: ¡Hola! No puedo entrar a mi correo del trabajo esta mañana.
  visual_hint: 💻🔒
  cloze:
  - 3
  - 7
  glossary:
  - word: log in
    meaning: iniciar sesión
    ipa: lɑːɡ ɪn
- id: forgot-new-password
  text: I typed my password three times and the screen locked.
  translation: Escribí mi contraseña tres veces y la pantalla se bloqueó.
  visual_hint: ⌨️❌
  cloze:
  - 3
  - 6
  glossary:
  - word: typed
    meaning: escribí / tecleé
    ipa: taɪpt
- id: temporary-login-code
  text: Can you send a temporary code to my mobile phone?
  translation: ¿Puede enviar un código temporal a mi teléfono móvil?
  visual_hint: 📱🔢
  cloze:
  - 3
  - 6
  glossary:
  - word: temporary
    meaning: temporal / provisorio
    ipa: ˈtempəreri
- id: type-new-password-now
  text: It works now! I will type a new password right away.
  translation: ¡Ya funciona! Escribiré una contraseña nueva de inmediato.
  visual_hint: ✅🔑
  cloze:
  - 3
  - 7
  glossary:
  - word: right away
    meaning: de inmediato / ahora mismo
    ipa: raɪt əˈweɪ
- id: connect-to-office-wifi
  text: My laptop is also connected to the fast office Wi-Fi.
  translation: Mi laptop también ya está conectada al wifi rápido de la oficina.
  visual_hint: 📶💻
  cloze:
  - 3
  - 6
  glossary:
  - word: connected
    meaning: conectada
    ipa: kəˈnektɪd
- id: thanks-it-help
  text: Thank you so much for fixing it so fast!
  translation: ¡Muchas gracias por arreglarlo tan rápido!
  visual_hint: 🙌😊
  cloze:
  - 3
  - 6
  glossary:
  - word: fixing
    meaning: reparar / arreglar
    ipa: ˈfɪksɪŋ
roleplay:
  ai_role: IT support technician
  user_role: employee
  setting: Office IT help desk on the second floor.
  turns:
  - speaker: ai
    text: Hello! Welcome to the IT Help Desk. What seems to be the problem?
  - speaker: user
    goal: Explica que no puedes iniciar sesión en tu correo de trabajo.
    suggested_lines:
    - Hi! I cannot log in to my work email this morning.
    - I typed my password three times and the screen locked.
  - speaker: ai
    text: No problem, that happens all the time! What is your employee username?
  - speaker: user
    goal: Cuenta que escribiste tu contraseña tres veces y se bloqueó.
    suggested_lines:
    - I typed my password three times and the screen locked.
    - Can you send a temporary code to my mobile phone?
  - speaker: ai
    text: I just unlocked your account and sent a six-digit reset code to your phone.
  - speaker: user
    goal: Pregunta si pueden enviar un código temporal a tu celular.
    suggested_lines:
    - Can you send a temporary code to my mobile phone?
    - It works now! I will type a new password right away.
  - speaker: ai
    text: Great! Just make sure your new password has at least eight letters and one number.
  - speaker: user
    goal: Confirma que ya funciona y crearás una contraseña nueva.
    suggested_lines:
    - It works now! I will type a new password right away.
    - My laptop is also connected to the fast office Wi-Fi.
  - speaker: ai
    text: Wonderful! Everything is all set. Have a fantastic day!
