id: a1-shoe-store-size
title: Trying on running shoes
title_es: Probarse zapatos deportivos
cefr: A1
topic: hotel-and-shopping
description: Pide unos tenis para correr en talla nueve, pruébatelos y comenta que
  son muy cómodos.
phrases:
- id: size-nine-shoes
  text: Do you have these blue running shoes in size nine?
  translation: ¿Tienen estos tenis azules para correr en talla nueve?
  visual_hint: 👟🔵
  cloze:
  - 3
  - 6
  glossary:
  - word: size
    meaning: talla / número
    ipa: saɪz
- id: try-both-on
  text: Can I sit here and try both shoes on?
  translation: ¿Puedo sentarme aquí y probarme ambos zapatos?
  visual_hint: 🪑👟
  cloze:
  - 3
  - 6
  glossary:
  - word: both
    meaning: ambos / los dos
    ipa: boʊθ
- id: very-comfortable
  text: They feel very light and comfortable on my feet.
  translation: Se sienten muy ligeros y cómodos en mis pies.
  visual_hint: 🦶✨
  cloze:
  - 3
  - 6
  glossary:
  - word: comfortable
    meaning: cómodos
    ipa: ˈkʌmfərtəbəl
- id: idm-put-on-sneakers
  text: Please sit down and put on the left sneaker first.
  translation: Por favor siéntese y póngase primero el tenis izquierdo.
  visual_hint: 👟🪑
  cloze:
  - 3
  - 6
  glossary:
  - word: put on
    meaning: ponerse (ropa o calzado)
    ipa: pʊt ɒn
  kind: phrasal_verb
  apply_sentence: I ____ my running shoes every morning before work.
  apply_answer: put on
  apply_translation: Me pongo mis tenis para correr cada mañana antes del trabajo.
- id: idm-sold-out-size
  text: Sorry, the black running shoes are sold out in size nine.
  translation: Lo siento, los tenis negros están agotados en talla nueve.
  visual_hint: 👟🚫
  cloze:
  - 3
  - 7
  glossary:
  - word: sold out
    meaning: agotado / vendido por completo
    ipa: soʊld aʊt
  kind: phrasal_verb
  apply_sentence: Those popular boots ____ fast during the winter sale.
  apply_answer: sold out
  apply_translation: Esas botas populares se agotaron rápido durante la rebaja de
    invierno.
roleplay:
  ai_role: shoe sales associate
  user_role: shopper
  setting: A sports shoe store on Main Street.
  turns:
  - speaker: ai
    text: Hi there! Let me know if you'd like to try on any shoes.
  - speaker: user
    goal: Pregunta si tienen los tenis azules en talla nueve.
    suggested_lines:
    - Do you have these blue running shoes in size nine?
    - Can I sit here and try both shoes on?
  - speaker: ai
    text: Here is a size nine in blue! Would you like to try them?
  - speaker: user
    goal: Pide sentarte y probarte ambos zapatos.
    suggested_lines:
    - Can I sit here and try both shoes on?
    - They feel very light and comfortable on my feet.
  - speaker: ai
    text: Take a walk around the mirror. How do they feel?
  - speaker: user
    goal: Comenta que se sienten muy ligeros y cómodos.
    suggested_lines:
    - They feel very light and comfortable on my feet.
    - I will take the shoes and one pack of white socks.
  - speaker: ai
    text: They look great on you! Ready to check out?
  - speaker: user
    goal: Di que te llevas los zapatos y un paquete de calcetines blancos.
    suggested_lines:
    - I will take the shoes and one pack of white socks.
    - Nine is my exact size; I don't need a bigger one.
  - speaker: ai
    text: Wonderful! Everything is all set. Have a fantastic day!
