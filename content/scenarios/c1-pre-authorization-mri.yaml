id: c1-pre-authorization-mri
title: Securing insurer pre-authorization for an MRI
title_es: Gestionar preautorización urgente de resonancia
cefr: C1
topic: health-and-emergencies
description: Coordina con el departamento médico de tu aseguradora la aprobación urgente
  de una resonancia magnética ambulatoria.
phrases:
- id: expedited-pre-authorization
  text: I'm calling to request expedited pre-authorization for a contrast-enhanced
    lumbar MRI ordered by my neurologist.
  translation: Llamo para solicitar preautorización urgente de una resonancia lumbar
    con contraste indicada por mi neurólogo.
  visual_hint: 🧲📋
  cloze:
  - 5
  - 10
  glossary:
  - word: expedited
    meaning: acelerada / de trámite urgente
    ipa: ˈekspədaɪtɪd
- id: clinical-notes-uploaded
  text: The clinic already uploaded the ICD-10 diagnostic codes and clinical notes
    documenting acute radiculopathy.
  translation: La clínica ya subió los códigos diagnósticos ICD-10 y las notas clínicas
    que documentan radiculopatía aguda.
  visual_hint: 🩺💻
  cloze:
  - 4
  - 9
  glossary:
  - word: acute
    meaning: aguda / de aparición intensa
    ipa: əˈkjuːt
- id: in-network-imaging-facility
  text: Because the imaging center is in-network, only my hundred-dollar copay should
    apply once you issue the guarantee of payment.
  translation: Como el centro de imagenología está dentro de la red, solo debe aplicar
    mi copago de cien dólares al emitir la carta garantía.
  visual_hint: 🏥💳
  cloze:
  - 6
  - 12
  glossary:
  - word: in-network
    meaning: dentro de la red médica afiliada
    ipa: ɪn ˈnetwɜːrk
- id: idm-go-the-extra-mile-c1
  text: I'd ask you to go the extra mile to get this approved.
  translation: Le pido que haga un esfuerzo extra para que esto se apruebe. (go the
    extra mile = esforzarse más)
  visual_hint: 🏃🧲
  cloze:
  - 4
  - 8
  glossary:
  - word: go the extra mile
    meaning: esforzarse más de lo esperado
    ipa: ɪkˈstrə maɪl
  kind: idiom
  apply_sentence: Dr. Lee will always ____ for her patients.
  apply_answer: go the extra mile
  apply_translation: La doctora Lee siempre hace un esfuerzo extra por sus pacientes.
- id: idm-the-ball-is-in-your-court-c1
  text: I've sent the documents, so now the ball is in your court.
  translation: Ya envié los documentos, así que ahora le toca a usted. (the ball is
    in your court)
  visual_hint: 🎾📋
  cloze:
  - 4
  - 8
  glossary:
  - word: the ball is in your court
    meaning: te toca actuar a ti
    ipa: kɔːt
  kind: idiom
  apply_sentence: I've done my part, so now ____.
  apply_answer: the ball is in your court
  apply_translation: Ya hice mi parte, así que ahora te toca a ti.
roleplay:
  ai_role: medical review coordinator
  user_role: insured patient
  setting: Phone call with the international health insurer's clinical desk.
  turns:
  - speaker: ai
    text: Clinical Pre-Authorization Desk, hello. I see your policy number on screen.
      What procedure was ordered?
  - speaker: user
    goal: Solicita preautorización urgente para una resonancia lumbar indicada por
      tu neurólogo.
    suggested_lines:
    - I'm calling to request expedited pre-authorization for a contrast-enhanced lumbar
      MRI ordered by my neurologist.
    - The clinic already uploaded the ICD-10 diagnostic codes and clinical notes documenting
      acute radiculopathy.
  - speaker: ai
    text: For expedited review, we need the ordering physician's clinical notes showing
      conservative care or red-flag symptoms.
  - speaker: user
    goal: Confirma que la clínica ya subió los códigos diagnósticos y notas médicas.
    suggested_lines:
    - The clinic already uploaded the ICD-10 diagnostic codes and clinical notes documenting
      acute radiculopathy.
    - Because the imaging center is in-network, only my hundred-dollar copay should
      apply once you issue the guarantee of payment.
  - speaker: ai
    text: I see the neurologist's PDF attachment right here—it clearly meets our urgent
      clinical criteria.
  - speaker: user
    goal: Verifica que al ser un centro de la red solo aplique el copago con carta
      garantía.
    suggested_lines:
    - Because the imaging center is in-network, only my hundred-dollar copay should
      apply once you issue the guarantee of payment.
    - Could you transmit the authorization code directly to the radiology scheduling
      desk before my 3:00 PM slot?
  - speaker: ai
    text: 'Approved under Authorization #MR-9042! Would you like me to email the Guarantee
      of Payment to the clinic?'
  - speaker: user
    goal: Pide que envíen el código de autorización a radiología antes de las 3:00
      PM.
    suggested_lines:
    - Could you transmit the authorization code directly to the radiology scheduling
      desk before my 3:00 PM slot?
    - Does this authorization bundle also cover Friday's follow-up consultation to
      review the scans?
  - speaker: ai
    text: Wonderful! Everything is all set. Have a fantastic day!
