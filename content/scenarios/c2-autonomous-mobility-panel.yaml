id: c2-autonomous-mobility-panel
title: Debating urban autonomous transit policy
title_es: Debatir políticas de movilidad autónoma
cefr: C2
topic: travel-and-transport
description: Participa en un panel de urbanismo sobre flotas autónomas compartidas, transporte público e infraestructura
  peatonal.
phrases:
- id: induced-congestion-paradox
  text: Replacing private cars one-for-one with empty roaming robotaxis risks worsening induced congestion.
  translation: Reemplazar autos privados uno por uno con robotaxis circulando vacíos corre el riesgo de agravar
    la congestión inducida.
  visual_hint: 🤖🚗
  cloze:
  - 4
  - 8
  glossary:
  - word: worsening
    meaning: empeorar / agravar
    ipa: ˈwɜːrsənɪŋ
- id: first-mile-feeder-integration
  text: Autonomous shuttles deliver the highest civic return when integrated as first-mile feeders into high-capacity
    rail.
  translation: Las lanzaderas autónomas rinden el mayor beneficio cívico cuando se integran como alimentadores de
    primera milla hacia el tren.
  visual_hint: 🚊🔄
  cloze:
  - 5
  - 10
  glossary:
  - word: first-mile feeders
    meaning: rutas alimentadoras de primera milla
    ipa: fɜːrst maɪl ˈfiːdərz
- id: curbside-pricing-telemetry
  text: Dynamic curbside pricing and anonymized telemetry sharing should be preconditions for operating permits.
  translation: La tarificación dinámica de bordillos y el intercambio de telemetría anónima deberían ser requisitos
    para los permisos.
  visual_hint: 📊🏙️
  cloze:
  - 4
  - 8
  glossary:
  - word: preconditions
    meaning: requisitos previos / condiciones
    ipa: ˌpriːkənˈdɪʃənz
- id: reclaim-streetscape-pedestrians
  text: Our ultimate metric of success is reclaiming asphalt for Micromobility, trees, and pedestrian plazas.
  translation: Nuestra métrica definitiva de éxito es recuperar el asfalto para micromovilidad, árboles y plazas
    peatonales.
  visual_hint: 🌳🚶‍♀️
  cloze:
  - 4
  - 9
  glossary:
  - word: reclaiming
    meaning: recuperar (espacio público)
    ipa: rɪˈkleɪmɪŋ
- id: equitable-suburban-access
  text: Subsidizing off-peak autonomous microtransit can bridge transit deserts in underserved suburbs.
  translation: Subsidiar el microtransporte autónomo fuera de hora punta puede cubrir zonas sin transporte en la
    periferia.
  visual_hint: 🏘️🚌
  cloze:
  - 3
  - 7
  glossary:
  - word: underserved
    meaning: desatendidos / con pocos servicios
    ipa: ˌʌndərˈsɜːrvd
- id: algorithmic-safety-audits
  text: Independent algorithmic safety audits must precede any expansion of driverless operating domains.
  translation: Las auditorías independientes de seguridad algorítmica deben preceder cualquier expansión operativa.
  visual_hint: 🛡️🔍
  cloze:
  - 4
  - 8
  glossary:
  - word: precede
    meaning: preceder / ir antes de
    ipa: prɪˈsiːd
roleplay:
  ai_role: urban transport commissioner
  user_role: mobility researcher
  setting: Keynote panel at a global smart-cities summit.
  turns:
  - speaker: ai
    text: Proponents claim autonomous vehicles will eliminate urban traffic overnight. What does your data show?
  - speaker: user
    goal: Advierte que sustituir autos por robotaxis vacíos puede aumentar la congestión.
    suggested_lines:
    - Replacing private cars one-for-one with empty roaming robotaxis risks worsening induced congestion.
    - Autonomous shuttles deliver the highest civic return when integrated as first-mile feeders into high-capacity
      rail.
  - speaker: ai
    text: So how should municipalities integrate autonomous fleets without cannibalizing mass transit?
  - speaker: user
    goal: Explica que su mayor valor está en conectar el primer tramo con el tren masivo.
    suggested_lines:
    - Autonomous shuttles deliver the highest civic return when integrated as first-mile feeders into high-capacity
      rail.
    - Dynamic curbside pricing and anonymized telemetry sharing should be preconditions for operating permits.
  - speaker: ai
    text: That's a compelling framework. What regulatory levers should cities retain over curb space?
  - speaker: user
    goal: Propón tarifas dinámicas de acera y telemetría anónima para otorgar permisos.
    suggested_lines:
    - Dynamic curbside pricing and anonymized telemetry sharing should be preconditions for operating permits.
    - Our ultimate metric of success is reclaiming asphalt for Micromobility, trees, and pedestrian plazas.
  - speaker: ai
    text: If we price drop-off zones dynamically, how should cities reinvest that revenue?
  - speaker: user
    goal: Concluye que el verdadero éxito es recuperar espacio público para los peatones.
    suggested_lines:
    - Our ultimate metric of success is reclaiming asphalt for Micromobility, trees, and pedestrian plazas.
    - Subsidizing off-peak autonomous microtransit can bridge transit deserts in underserved suburbs.
  - speaker: ai
    text: Wonderful! Everything is all set. Have a fantastic day!
