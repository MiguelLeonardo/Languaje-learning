id: a2-meeting-new-people
title: Introducing yourself and hobbies
title_es: Presentarse y hablar de hobbies
cefr: A2
topic: social-and-smalltalk
description: Preséntate en un evento social, cuenta a qué te dedicas y qué haces en tu tiempo libre.
phrases:
- id: nice-to-meet
  text: Hi, I'm Alex. It's really nice to meet you!
  translation: Hola, soy Alex. ¡Mucho gusto en conocerte!
  visual_hint: 👋😊
  cloze:
  - 5
  - 7
  glossary:
  - word: nice to meet you
    meaning: mucho gusto en conocerte
- id: what-do-you-do
  text: What do you like to do in your free time?
  translation: ¿Qué te gusta hacer en tu tiempo libre?
  visual_hint: 🎸🏃
  cloze:
  - 4
  - 8
  glossary:
  - word: free time
    meaning: tiempo libre
    ipa: friː taɪm
- id: into-hiking
  text: I'm really into hiking and cooking on weekends.
  translation: Me gusta mucho hacer senderismo y cocinar los fines de semana.
  visual_hint: 🥾🍳
  cloze:
  - 2
  - 3
  glossary:
  - word: into
    meaning: be into something = ser aficionado a algo
    ipa: ˈɪntuː
  - word: hiking
    meaning: senderismo / caminata en montaña
    ipa: ˈhaɪkɪŋ
- id: how-long-living-here
  text: How long have you been living in this city?
  translation: ¿Cuánto tiempo llevas viviendo en esta ciudad?
  visual_hint: 🏙️⏳
  cloze:
  - 1
  - 4
  - 8
  glossary:
  - word: how long
    meaning: cuánto tiempo
    ipa: haʊ lɔːŋ
  - word: living
    meaning: viviendo
    ipa: ˈlɪvɪŋ
- id: keep-in-touch
  text: It was great chatting with you; let's exchange numbers!
  translation: Fue genial charlar contigo; ¡intercambiemos números!
  visual_hint: 📱🤝
  cloze:
  - 2
  - 3
  - 7
  glossary:
  - word: chatting
    meaning: charlando / conversando
    ipa: ˈtʃætɪŋ
  - word: exchange
    meaning: intercambiar
    ipa: ɪksˈtʃeɪndʒ
- id: free-time-hobbies
  text: On weekends I usually go hiking or try new coffee shops.
  translation: Los fines de semana suelo ir de excursión o probar nuevas cafeterías.
  visual_hint: 🥾☕
  cloze:
  - 3
  - 5
  - 7
  glossary:
  - word: usually
    meaning: usualmente / normalmente
    ipa: ˈjuːʒuəli
  - word: hiking
    meaning: senderismo / caminata
    ipa: ˈhaɪkɪŋ
roleplay:
  ai_role: new neighbor
  user_role: resident
  setting: A casual neighborhood welcome gathering.
  turns:
  - speaker: ai
    text: Hi! I don't think we've met yet. I'm Sam from apartment four.
  - speaker: user
    goal: Preséntate con entusiasmo.
    suggested_lines:
    - Hi, I'm Alex. It's really nice to meet you!
  - speaker: ai
    text: Nice to meet you too! What do you usually do on weekends?
  - speaker: user
    goal: Cuenta tus hobbies y pregúntale qué hace en su tiempo libre.
    suggested_lines:
    - I'm really into hiking and cooking on weekends.
    - What do you like to do in your free time?
  - speaker: ai
    text: I love hiking too! We should check out the local trail sometime.
