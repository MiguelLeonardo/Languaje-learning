id: c2-shareholder-activist-qa
title: Fielding shareholder questions at an AGM
title_es: Responder a accionistas en asamblea anual
cefr: C2
topic: work-and-career
description: Defiende en la asamblea anual de accionistas la inversión en I+D de largo plazo frente a recompras
  de acciones de corto plazo.
phrases:
- id: balance-buybacks-with-rd
  text: Starving our R&D pipeline to fund short-term share buybacks would mortgage our competitive moat for a fleeting
    EPS bump.
  translation: Recortar nuestra inversión en I+D para financiar recompras de corto plazo hipotecaría nuestra ventaja
    competitiva por un alza efímera.
  visual_hint: 🏛️📈
  cloze:
  - 6
  - 12
  glossary:
  - word: competitive moat
    meaning: ventaja competitiva sostenible / foso defensivo
    ipa: kəmˈpetətɪv moʊt
- id: roic-hurdle-rate
  text: Every capital-allocation tranche must clear a twenty-percent return-on-invested-capital hurdle rate before
    release.
  translation: Cada tramo de asignación de capital debe superar una tasa mínima de retorno del veinte por ciento
    antes de liberarse.
  visual_hint: 🎯💹
  cloze:
  - 4
  - 8
  glossary:
  - word: hurdle rate
    meaning: tasa mínima aceptable de rentabilidad
    ipa: ˈhɜːrdəl reɪt
- id: patents-driving-new-arr
  text: Forty percent of this year's net-new enterprise bookings came directly from products commercialized out
    of our lab two years ago.
  translation: El cuarenta por ciento de las nuevas ventas corporativas de este año provino de productos creados
    en nuestro laboratorio hace dos años.
  visual_hint: 🔬🚀
  cloze:
  - 6
  - 13
  glossary:
  - word: commercialized
    meaning: llevados al mercado con éxito
    ipa: kəˈmɜːrʃəlaɪzd
- id: disciplined-dividend-growth
  text: Even while funding next-generation AI, we expanded free cash flow and raised our dividend for the ninth
    consecutive year.
  translation: Incluso financiando la nueva generación tecnológica, ampliamos el flujo de caja libre y subimos el
    dividendo por noveno año consecutivo.
  visual_hint: 🏦🌟
  cloze:
  - 6
  - 12
  glossary:
  - word: consecutive
    meaning: consecutivo / seguido
    ipa: kənˈsekjətɪv
- id: sunset-underperforming-bets
  text: We killed two underperforming initiatives in Q1 and redeployed those engineers to our highest-margin platform.
  translation: Cerramos dos iniciativas de bajo rendimiento en el primer trimestre y reasignamos ese talento a la
    plataforma de mayor margen.
  visual_hint: 🧭✂️
  cloze:
  - 5
  - 10
  glossary:
  - word: redeployed
    meaning: reasignamos estratégicamente
    ipa: ˌriːdɪˈplɔɪd
- id: long-term-compounding-value
  text: Our mandate is compounding intrinsic value over decades, not optimizing for a single quarter's headline.
  translation: Nuestro mandato es multiplicar el valor intrínseco por décadas, no optimizar el titular de un solo
    trimestre.
  visual_hint: 🤝⏳
  cloze:
  - 5
  - 10
  glossary:
  - word: intrinsic value
    meaning: valor intrínseco fundamental
    ipa: ɪnˈtrɪnzɪk ˈvæljuː
- id: idm-beat-around-the-bush
  text: 'I won''t beat around the bush: our margins did decline.'
  translation: 'No me andaré con rodeos: nuestros márgenes sí bajaron. (beat around the bush: andarse con rodeos)'
  visual_hint: 🌳🗣️
  cloze:
  - 3
  - 6
  glossary:
  - word: beat around the bush
    meaning: andarse por las ramas
    ipa: biːt əˈraʊnd ðə bʊʃ
  kind: idiom
  apply_sentence: Please don't ____ and tell us what really happened.
  apply_answer: beat around the bush
  apply_translation: Deja de andarte con rodeos y dinos qué pasó realmente.
- id: idm-bottom-line
  text: Ultimately, the bottom line is that shareholder value is growing.
  translation: 'En definitiva, lo esencial es que el valor para el accionista crece. (bottom line: lo fundamental)'
  visual_hint: 💰🎯
  cloze:
  - 3
  - 6
  glossary:
  - word: the bottom line
    meaning: lo esencial
    ipa: ˈbɑːtəm laɪn
  kind: idiom
  apply_sentence: Whatever the plan, the ____ is profit this year.
  apply_answer: bottom line
  apply_translation: Sea cual sea el plan, lo fundamental es el beneficio este año.
roleplay:
  ai_role: institutional shareholder
  user_role: chief executive officer
  setting: Annual General Meeting podium fielding live Q&A.
  turns:
  - speaker: ai
    text: Why is the board allocating eighteen percent of revenue to R&D instead of doubling the share buyback program?
  - speaker: user
    goal: Argumenta que recortar I+D por recompras de corto plazo hipotecaría la ventaja competitiva.
    suggested_lines:
    - Starving our R&D pipeline to fund short-term share buybacks would mortgage our competitive moat for a fleeting
      EPS bump.
    - Every capital-allocation tranche must clear a twenty-percent return-on-invested-capital hurdle rate before
      release.
  - speaker: ai
    text: How do shareholders know that R&D spend is disciplined rather than pet projects?
  - speaker: user
    goal: Explica que cada inversión debe superar una rentabilidad mínima del 20%.
    suggested_lines:
    - Every capital-allocation tranche must clear a twenty-percent return-on-invested-capital hurdle rate before
      release.
    - Forty percent of this year's net-new enterprise bookings came directly from products commercialized out of
      our lab two years ago.
  - speaker: ai
    text: Can you point to tangible top-line revenue generated by those previous R&D cohorts?
  - speaker: user
    goal: Demuestra con datos que el 40% de las nuevas ventas proviene de innovaciones de hace dos años.
    suggested_lines:
    - Forty percent of this year's net-new enterprise bookings came directly from products commercialized out of
      our lab two years ago.
    - Even while funding next-generation AI, we expanded free cash flow and raised our dividend for the ninth consecutive
      year.
  - speaker: ai
    text: That conversion from lab to enterprise bookings is impressive context.
  - speaker: user
    goal: Cierra destacando el crecimiento del flujo de caja libre y nueve años subiendo el dividendo.
    suggested_lines:
    - Even while funding next-generation AI, we expanded free cash flow and raised our dividend for the ninth consecutive
      year.
    - We killed two underperforming initiatives in Q1 and redeployed those engineers to our highest-margin platform.
  - speaker: ai
    text: Wonderful! Everything is all set. Have a fantastic day!
