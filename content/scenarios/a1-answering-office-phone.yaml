id: a1-answering-office-phone
title: Taking a phone message at work
title_es: Tomar un recado telefónico en la oficina
cefr: A1
topic: work-and-career
description: Contesta el teléfono de la oficina, explica que tu jefa está en una reunión y anota el nombre y número.
phrases:
- id: good-morning-sales-desk
  text: Good morning, BrightTech office, how can I help you?
  translation: Buenos días, oficina de BrightTech, ¿en qué puedo ayudarle?
  visual_hint: ☎️🏢
  cloze:
  - 3
  - 6
  glossary:
  - word: how can I help
    meaning: ¿en qué puedo ayudarle?
    ipa: haʊ kæn aɪ help
- id: she-is-in-a-meeting
  text: I am sorry, Laura is in a meeting until eleven.
  translation: Lo siento, Laura está en una reunión hasta las once.
  visual_hint: 🕚👥
  cloze:
  - 3
  - 6
  glossary:
  - word: meeting
    meaning: reunión / junta
    ipa: ˈmiːtɪŋ
- id: can-i-take-a-message
  text: Can I take your name and phone number for her?
  translation: ¿Puedo tomar su nombre y número de teléfono para ella?
  visual_hint: 📝📞
  cloze:
  - 3
  - 6
  glossary:
  - word: phone number
    meaning: número de teléfono
    ipa: foʊn ˈnʌmbər
- id: spell-your-last-name
  text: Could you spell your last name for me, please?
  translation: ¿Podría deletrearme su apellido, por favor?
  visual_hint: 🔤✍️
  cloze:
  - 3
  - 6
  glossary:
  - word: spell
    meaning: deletrear
    ipa: spel
- id: put-note-on-her-desk
  text: I will put this note on her desk right now.
  translation: Pondré esta nota en su escritorio ahora mismo.
  visual_hint: 📌🖥️
  cloze:
  - 3
  - 6
  glossary:
  - word: note
    meaning: nota / recado
    ipa: noʊt
- id: she-will-call-you-back
  text: Thank you, Mr. Evans. She will call you back soon!
  translation: Gracias, Sr. Evans. ¡Ella le devolverá la llamada pronto!
  visual_hint: 📲✅
  cloze:
  - 3
  - 6
  glossary:
  - word: call back
    meaning: devolver la llamada
    ipa: kɔːl bæk
roleplay:
  ai_role: caller (Mr. Evans)
  user_role: assistant
  setting: At your office desk when the landline rings.
  turns:
  - speaker: ai
    text: Hello, may I speak with Laura Gomez, please?
  - speaker: user
    goal: Contesta el teléfono saludando en nombre de la oficina.
    suggested_lines:
    - Good morning, BrightTech office, how can I help you?
    - I am sorry, Laura is in a meeting until eleven.
  - speaker: ai
    text: Oh, I see. When will she be back at her desk?
  - speaker: user
    goal: Explica que Laura está en una reunión hasta las once.
    suggested_lines:
    - I am sorry, Laura is in a meeting until eleven.
    - Can I take your name and phone number for her?
  - speaker: ai
    text: Yes, please tell her Paul Evans called about the Friday order.
  - speaker: user
    goal: Pregunta si puedes anotar su nombre y número de teléfono.
    suggested_lines:
    - Can I take your name and phone number for her?
    - Could you spell your last name for me, please?
  - speaker: ai
    text: Sure, it is E-V-A-N-S, and my number is 555-0192.
  - speaker: user
    goal: Pídele que deletree su apellido para anotarlo bien.
    suggested_lines:
    - Could you spell your last name for me, please?
    - I will put this note on her desk right now.
  - speaker: ai
    text: Wonderful! Everything is all set. Have a fantastic day!
