id: b1-housewarming-gift
title: Attending a friend's housewarming party
title_es: Ir a una fiesta de inauguración de casa
cefr: B1
topic: social-and-smalltalk
description: Felicita a tus amigos por su nuevo departamento, entrégales una planta para la sala y elogia la luz
  natural.
phrases:
- id: congrats-on-new-place
  text: Congratulations on the new apartment! We're so excited to see it.
  translation: ¡Felicidades por el nuevo departamento! Qué ilusión conocerlo.
  visual_hint: 🏡🎉
  cloze:
  - 3
  - 7
  glossary:
  - word: excited
    meaning: emocionados / ilusionados
    ipa: ɪkˈsaɪtɪd
- id: low-maintenance-plant
  text: We brought you this potted olive tree for the balcony—it's super easy to care for.
  translation: Les trajimos este pequeño olivo en maceta para el balcón; es muy fácil de cuidar.
  visual_hint: 🪴🌿
  cloze:
  - 5
  - 10
  glossary:
  - word: care for
    meaning: cuidar
    ipa: ker fɔːr
- id: tons-of-natural-light
  text: These floor-to-ceiling windows let in so much natural light!
  translation: ¡Estas ventanas de piso a techo dejan entrar muchísima luz natural!
  visual_hint: 🪟☀️
  cloze:
  - 3
  - 6
  glossary:
  - word: let in
    meaning: dejar entrar
    ipa: let ɪn
- id: open-kitchen-layout
  text: I love how the open kitchen flows right into the living room.
  translation: Me encanta cómo la cocina abierta se conecta directo con la sala.
  visual_hint: 🍳🛋️
  cloze:
  - 4
  - 8
  glossary:
  - word: flows into
    meaning: se integra / fluye hacia
    ipa: floʊz ˈɪntuː
- id: cozy-reading-nook
  text: That bookshelf alcove by the window makes the perfect reading nook.
  translation: Ese rincón con librero junto a la ventana es perfecto para leer.
  visual_hint: 📚🪑
  cloze:
  - 3
  - 7
  glossary:
  - word: nook
    meaning: rincón acogedor
    ipa: nʊk
- id: toast-to-new-memories
  text: Here's to many happy years and great dinners in your new home!
  translation: ¡Por muchos años felices y grandes cenas en su nuevo hogar!
  visual_hint: 🥂🏠
  cloze:
  - 4
  - 8
  glossary:
  - word: here's to
    meaning: brindemos por
    ipa: hɪrz tuː
- id: idm-b1hg-make-yourself
  text: Come in and make yourself at home, the kitchen's through there.
  translation: Pasa y siéntete como en casa, la cocina está por allá (ponte cómodo).
  visual_hint: 🏡🎁
  cloze:
  - 3
  - 7
  glossary:
  - word: make yourself at home
    meaning: ponte cómodo
    ipa: həʊm
  kind: expression
  apply_sentence: Please take off your coat and ____ at home.
  apply_answer: make yourself
  apply_translation: Por favor quítate el abrigo y siéntete como en casa.
- id: idm-b1hg-show-around
  text: Let me show you around before everyone else arrives, okay?
  translation: Déjame mostrarte la casa antes de que llegue todos los demás (hacer un recorrido).
  visual_hint: 🔑🚪
  cloze:
  - 3
  - 6
  glossary:
  - word: show around
    meaning: mostrar el lugar
    ipa: ʃəʊ
  kind: phrasal_verb
  apply_sentence: The manager will ____ the new office this afternoon.
  apply_answer: show you around
  apply_translation: El gerente te mostrará la nueva oficina esta tarde.
roleplay:
  ai_role: new homeowner
  user_role: guest
  setting: Arriving at a friend's bright new apartment for a housewarming.
  turns:
  - speaker: ai
    text: Come on in! Welcome to our new place—we finally unpacked the last box yesterday!
  - speaker: user
    goal: Felicita a tus amigos por su nuevo departamento.
    suggested_lines:
    - Congratulations on the new apartment! We're so excited to see it.
    - We brought you this potted olive tree for the balcony—it's super easy to care for.
  - speaker: ai
    text: Aw, you didn't have to bring a gift! What a beautiful plant!
  - speaker: user
    goal: Entrégales la planta en maceta y di que es muy fácil de cuidar.
    suggested_lines:
    - We brought you this potted olive tree for the balcony—it's super easy to care for.
    - These floor-to-ceiling windows let in so much natural light!
  - speaker: ai
    text: It'll look amazing on the sunny corner of our balcony. Let me give you the grand tour!
  - speaker: user
    goal: Elogia la cantidad de luz natural que entra por los ventanales.
    suggested_lines:
    - These floor-to-ceiling windows let in so much natural light!
    - I love how the open kitchen flows right into the living room.
  - speaker: ai
    text: The natural light was the main reason we fell in love with this unit.
  - speaker: user
    goal: Comenta lo bien que se integra la cocina abierta con la sala.
    suggested_lines:
    - I love how the open kitchen flows right into the living room.
    - That bookshelf alcove by the window makes the perfect reading nook.
  - speaker: ai
    text: Wonderful! Everything is all set. Have a fantastic day!
