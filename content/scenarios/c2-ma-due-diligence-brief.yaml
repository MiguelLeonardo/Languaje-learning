id: c2-ma-due-diligence-brief
title: Defending valuation in M&A due diligence
title_es: Defender valuación en auditoría de compra (M&A)
cefr: C2
topic: work-and-career
description: Defiende ante el comité de adquisiciones la retención neta de ingresos,
  la propiedad intelectual y las sinergias operativas.
phrases:
- id: net-dollar-retention-cohorts
  text: Across our enterprise cohorts, net dollar retention has compounded at a hundred
    and twenty-eight percent over twelve quarters.
  translation: En nuestras cohortes empresariales, la retención neta en dólares se
    ha compuesto al ciento veintiocho por ciento durante doce trimestres.
  visual_hint: 📈🏛️
  cloze:
  - 6
  - 12
  glossary:
  - word: compounded
    meaning: crecido de forma compuesta
    ipa: kəmˈpaʊndɪd
- id: clean-ip-chain-of-title
  text: Our external IP counsel completed a comprehensive open-source audit confirming
    an unencumbered chain of title across all core patents.
  translation: Nuestros asesores de propiedad intelectual completaron una auditoría
    exhaustiva confirmando titularidad limpia en todas las patentes clave.
  visual_hint: ⚖️🔐
  cloze:
  - 6
  - 12
  glossary:
  - word: unencumbered
    meaning: libre de gravámenes o reclamos
    ipa: ˌʌnɪnˈkʌmbərd
- id: cross-sell-accretive-margin
  text: Integrating our compliance module into your global salesforce becomes accretive
    to EBITDA within two quarters of closing.
  translation: Integrar nuestro módulo de cumplimiento en su fuerza de ventas global
    aporta positivamente al EBITDA en dos trimestres tras el cierre.
  visual_hint: 💹🤝
  cloze:
  - 5
  - 11
  glossary:
  - word: accretive
    meaning: que incrementa el valor / margen por acción
    ipa: əˈkriːtɪv
- id: idm-moving-goalposts
  text: It feels like you keep moving the goalposts on our valuation.
  translation: 'Parece que siguen cambiando las reglas sobre nuestra valoración. (move
    the goalposts: cambiar condiciones)'
  visual_hint: 🥅↔️
  cloze:
  - 3
  - 7
  glossary:
  - word: moving the goalposts
    meaning: cambiar las reglas
    ipa: ˈmuːvɪŋ ðə ˈɡoʊlpoʊsts
  kind: idiom
  apply_sentence: The buyer started ____ once the numbers looked strong.
  apply_answer: moving the goalposts
  apply_translation: El comprador empezó a cambiar las reglas cuando las cifras se
    vieron sólidas.
- id: idm-red-flag
  text: Nothing in our books should raise a red flag.
  translation: 'Nada en nuestros libros debería levantar una señal de alarma. (red
    flag: señal de peligro)'
  visual_hint: 🚩🔎
  cloze:
  - 3
  - 6
  glossary:
  - word: red flag
    meaning: señal de alarma
    ipa: rɛd flæɡ
  kind: idiom
  apply_sentence: The sudden change in auditors was a ____ for investors.
  apply_answer: red flag
  apply_translation: El cambio repentino de auditores fue una señal de alarma para
    los inversores.
roleplay:
  ai_role: managing director (acquirer)
  user_role: chief strategy officer
  setting: Confirmatory M&A due diligence session.
  turns:
  - speaker: ai
    text: Let's examine customer stickiness—how resilient is your recurring revenue
      if macro budgets tighten?
  - speaker: user
    goal: Destaca la retención neta de ingresos del 128% sostenida durante doce trimestres.
    suggested_lines:
    - Across our enterprise cohorts, net dollar retention has compounded at a hundred
      and twenty-eight percent over twelve quarters.
    - Our external IP counsel completed a comprehensive open-source audit confirming
      an unencumbered chain of title across all core patents.
  - speaker: ai
    text: And did the technical audit surface any copyleft contamination in your proprietary
      inference engine?
  - speaker: user
    goal: Confirma que la auditoría de propiedad intelectual verificó titularidad
      limpia.
    suggested_lines:
    - Our external IP counsel completed a comprehensive open-source audit confirming
      an unencumbered chain of title across all core patents.
    - Integrating our compliance module into your global salesforce becomes accretive
      to EBITDA within two quarters of closing.
  - speaker: ai
    text: How quickly do the commercial synergies materialize post-acquisition?
  - speaker: user
    goal: Explica que la venta cruzada incrementará el EBITDA en solo dos trimestres.
    suggested_lines:
    - Integrating our compliance module into your global salesforce becomes accretive
      to EBITDA within two quarters of closing.
    - Given the clean audit findings, we propose capping the general indemnity escrow
      at five percent with a twelve-month survival period.
  - speaker: ai
    text: Our diligence committee is satisfied with both the cohort data and the IP
      clearance.
  - speaker: user
    goal: Propón limitar la retención en garantía al 5% durante doce meses.
    suggested_lines:
    - Given the clean audit findings, we propose capping the general indemnity escrow
      at five percent with a twelve-month survival period.
    - Restructuring the unvested equity into milestone retention grants keeps the
      founding engineering leads locked in.
  - speaker: ai
    text: Wonderful! Everything is all set. Have a fantastic day!
