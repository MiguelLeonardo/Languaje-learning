id: a1-fast-food-combo
title: Ordering a burger combo
title_es: Pedir un combo de hamburguesa
cefr: A1
topic: food-and-drink
description: Ordena una hamburguesa con queso, papas fritas sin sal y una limonada.
phrases:
- id: cheeseburger-combo
  text: Can I get the cheeseburger combo, please?
  translation: ¿Me da el combo de hamburguesa con queso, por favor?
  visual_hint: 🍔🍟
  cloze:
  - 2
  - 4
  glossary:
  - word: combo
    meaning: menú completo / combo
    ipa: ˈkɑːmboʊ
- id: french-fries
  text: Medium french fries with ketchup, please.
  translation: Papas fritas medianas con kétchup, por favor.
  visual_hint: 🍟🍅
  cloze:
  - 2
  - 4
  glossary:
  - word: french fries
    meaning: papas fritas
    ipa: frentʃ fraɪz
- id: iced-lemonade
  text: I want an iced lemonade to drink.
  translation: Quiero una limonada con hielo para tomar.
  visual_hint: 🍋🧊
  cloze:
  - 2
  - 4
  glossary:
  - word: iced
    meaning: con hielo / helada
    ipa: aɪst
- id: run-out-of
  text: They always run out of fries at lunchtime, sir.
  translation: 'Siempre se quedan sin papas fritas a la hora del almuerzo, señor.
    (run out of: quedarse sin)'
  visual_hint: 🍟😕
  cloze:
  - 3
  - 6
  glossary:
  - word: run out of
    meaning: 'run out of: quedarse sin'
    ipa: rʌn aʊt
  kind: phrasal_verb
  apply_sentence: Let's buy more rice before we ____ it.
  apply_answer: run out of
  apply_translation: Compremos más arroz antes de quedarnos sin él.
- id: hurry-up
  text: Hurry up, my burger combo is getting cold!
  translation: '¡Date prisa, mi combo de hamburguesa se está enfriando! (hurry up:
    apresurarse)'
  visual_hint: 🍔⏰
  cloze:
  - 2
  - 5
  glossary:
  - word: hurry up
    meaning: 'hurry up: darse prisa'
    ipa: ˈhʌri
  kind: phrasal_verb
  apply_sentence: Please ____, the bus leaves in five minutes.
  apply_answer: hurry up
  apply_translation: Por favor, date prisa, el autobús sale en cinco minutos.
roleplay:
  ai_role: cashier
  user_role: customer
  setting: A casual burger counter at lunchtime.
  turns:
  - speaker: ai
    text: Welcome! What can I get started for you?
  - speaker: user
    goal: Pide el combo de hamburguesa con queso.
    suggested_lines:
    - Can I get the cheeseburger combo, please?
    - Medium french fries with ketchup, please.
  - speaker: ai
    text: Sure! What size fries and sauce would you like?
  - speaker: user
    goal: Elige papas medianas con kétchup.
    suggested_lines:
    - Medium french fries with ketchup, please.
    - I want an iced lemonade to drink.
  - speaker: ai
    text: And what drink comes with your meal?
  - speaker: user
    goal: Pide una limonada con hielo para tomar.
    suggested_lines:
    - I want an iced lemonade to drink.
    - We will eat here at a table.
  - speaker: ai
    text: Got it! Is that for here or to go?
  - speaker: user
    goal: Indica que comerán aquí en una mesa.
    suggested_lines:
    - We will eat here at a table.
    - No onions on the burger, please.
  - speaker: ai
    text: Wonderful! Everything is all set. Have a fantastic day!
