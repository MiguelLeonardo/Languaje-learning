id: a2-gym-workout-buddy
title: Chatting at a fitness class
title_es: Conversar en una clase del gimnasio
cefr: A2
topic: social-and-smalltalk
description: Saluda a un compañero en la clase de ciclismo bajo techo, comparte pesas
  y comenten el entrenamiento.
phrases:
- id: first-time-in-class
  text: Hi! Is this spot next to you taken? It's my first time in this class.
  translation: ¡Hola! ¿Está ocupado este lugar junto a ti? Es mi primera vez en esta
    clase.
  visual_hint: 🏋️‍♀️👋
  cloze:
  - 5
  - 10
  glossary:
  - word: taken
    meaning: ocupado (un lugar)
    ipa: ˈteɪkən
- id: which-dumbbells-to-use
  text: Which weight dumbbells do you recommend for the shoulder exercises?
  translation: ¿Qué peso de mancuernas recomiendas para los ejercicios de hombros?
  visual_hint: 💪🏋️
  cloze:
  - 3
  - 6
  glossary:
  - word: dumbbells
    meaning: mancuernas / pesas
    ipa: ˈdʌmbelz
- id: great-upbeat-playlist
  text: I love the upbeat music playlist she uses for the warm-up!
  translation: ¡Me encanta la lista de música animada que usa para el calentamiento!
  visual_hint: 🎵🔥
  cloze:
  - 3
  - 7
  glossary:
  - word: upbeat
    meaning: animada / con energía
    ipa: ˈʌpbiːt
- id: idm-a2gw-work-out
  text: I try to work out three times a week after work.
  translation: Intento hacer ejercicio tres veces por semana después del trabajo.
  visual_hint: 🏋️💪
  cloze:
  - 3
  - 7
  glossary:
  - word: work out
    meaning: hacer ejercicio
    ipa: wɜːk
  kind: phrasal_verb
  apply_sentence: My brother likes to ____ every morning in the garden.
  apply_answer: work out
  apply_translation: A mi hermano le gusta hacer ejercicio cada mañana en el jardín.
- id: idm-a2gw-no-pain
  text: Keep going! No pain, no gain, my friend, remember that.
  translation: ¡Sigue! Sin esfuerzo no hay recompensa, amigo (hay que sacrificarse).
  visual_hint: 😅🏃
  cloze:
  - 3
  - 6
  glossary:
  - word: no pain, no gain
    meaning: sin esfuerzo no hay recompensa
    ipa: peɪn
  kind: idiom
  apply_sentence: Studying is hard, but ____, no gain.
  apply_answer: no pain
  apply_translation: Estudiar es difícil, pero sin dolor no hay ganancia.
roleplay:
  ai_role: gym member
  user_role: fitness class participant
  setting: Studio room before an evening spin and strength class.
  turns:
  - speaker: ai
    text: Hey there! Welcome to the 6:00 PM strength and cardio session!
  - speaker: user
    goal: Pregunta si el lugar está libre y comenta que es tu primera vez en la clase.
    suggested_lines:
    - Hi! Is this spot next to you taken? It's my first time in this class.
    - Which weight dumbbells do you recommend for the shoulder exercises?
  - speaker: ai
    text: Not taken at all, grab that mat! The instructor, Maya, is super encouraging.
  - speaker: user
    goal: Pregunta qué peso de mancuernas recomienda para hombros.
    suggested_lines:
    - Which weight dumbbells do you recommend for the shoulder exercises?
    - I love the upbeat music playlist she uses for the warm-up!
  - speaker: ai
    text: Start with the ten-pound dumbbells—we do a lot of repetitions!
  - speaker: user
    goal: Comenta que te gusta mucho la música del calentamiento.
    suggested_lines:
    - I love the upbeat music playlist she uses for the warm-up!
    - That was a great workout! Do you come to the Tuesday and Thursday sessions?
  - speaker: ai
    text: Whew, we survived the final plank challenge! How do you feel?
  - speaker: user
    goal: Dile que fue un gran entrenamiento y pregunta si viene martes y jueves.
    suggested_lines:
    - That was a great workout! Do you come to the Tuesday and Thursday sessions?
    - Here are the disinfectant wipes to clean our mats and weights.
  - speaker: ai
    text: Wonderful! Everything is all set. Have a fantastic day!
