id: b2-hosting-business-lunch
title: Hosting a business lunch
title_es: Anfitrión en un almuerzo de negocios
cefr: B2
topic: food-and-drink
description: Da la bienvenida a clientes en un restaurante, sugiere entradas para
  compartir y hazte cargo de la cuenta con cortesía.
phrases:
- id: reserved-table-under
  text: Good afternoon, we have a reservation for four under the name Martinez.
  translation: Buenas tardes, tenemos una reservación para cuatro a nombre de Martínez.
  visual_hint: 📋🍽️
  cloze:
  - 4
  - 8
  glossary:
  - word: reservation
    meaning: reservación
    ipa: ˌrezərˈveɪʃən
  - word: under the name
    meaning: a nombre de
    ipa: ˈʌndər ðə neɪm
- id: order-appetizers
  text: Shall we order a few appetizers for the table while we look over the menu?
  translation: ¿Pedimos algunas entradas para la mesa mientras revisamos el menú?
  visual_hint: 🥗🥖
  cloze:
  - 2
  - 5
  - 11
  glossary:
  - word: appetizers
    meaning: entradas / aperitivos
    ipa: ˈæpɪtaɪzərz
  - word: look over
    meaning: revisar / echar un vistazo
    ipa: lʊk ˈoʊvər
- id: seasonal-specials
  text: Could you tell us about today's seasonal specials and fresh catch?
  translation: ¿Podría contarnos sobre los platos especiales de temporada de hoy y
    la pesca del día?
  visual_hint: 🐟🌿
  cloze:
  - 6
  - 7
  - 10
  glossary:
  - word: seasonal
    meaning: de temporada
    ipa: ˈsiːzənəl
  - word: fresh catch
    meaning: pesca fresca del día
    ipa: freʃ kætʃ
- id: break-the-ice
  text: A relaxed appetizer is a good way to break the ice.
  translation: 'Un aperitivo relajado es buena forma de romper el hielo. (break the
    ice: romper el hielo)'
  visual_hint: 🧊🤝
  cloze:
  - 3
  - 7
  glossary:
  - word: break the ice
    meaning: 'break the ice: romper el hielo'
    ipa: aɪs
  kind: idiom
  apply_sentence: He told a joke to ____ at the meeting.
  apply_answer: break the ice
  apply_translation: Contó un chiste para romper el hielo en la reunión.
- id: pick-up-the-tab
  text: Please let me pick up the tab; I'm hosting today.
  translation: 'Permítame pagar la cuenta; hoy soy el anfitrión. (pick up the tab:
    pagar la cuenta)'
  visual_hint: 🧾💼
  cloze:
  - 3
  - 6
  glossary:
  - word: pick up the tab
    meaning: 'pick up the tab: pagar la cuenta'
    ipa: tæb
  kind: idiom
  apply_sentence: My boss offered to ____ for the whole team.
  apply_answer: pick up the tab
  apply_translation: Mi jefe se ofreció a pagar la cuenta de todo el equipo.
roleplay:
  ai_role: head waiter
  user_role: business host
  setting: A modern upscale bistro during a client lunch meeting.
  turns:
  - speaker: ai
    text: Good afternoon! Welcome to The Olive Tree. Do you have a reservation with
      us?
  - speaker: user
    goal: Indica que tienes una reservación para cuatro a nombre de Martínez.
    suggested_lines:
    - Good afternoon, we have a reservation for four under the name Martinez.
    - Yes, a table for four under Martinez, please.
  - speaker: ai
    text: Right this way. Here are your menus. Would you like to start with something
      for the table?
  - speaker: user
    goal: Pregunta por las especialidades de temporada y sugiere pedir entradas.
    suggested_lines:
    - Could you tell us about today's seasonal specials and fresh catch?
    - Shall we order a few appetizers for the table while we look over the menu?
  - speaker: ai
    text: Today we have wild sea bass and prime ribeye. What can I get for your main
      course?
  - speaker: user
    goal: Ordena el corte de carne término medio-rojo con espárragos.
    suggested_lines:
    - I'd like the ribeye cooked medium-rare with roasted asparagus on the side.
    - I'll have the ribeye medium-rare with asparagus, please.
  - speaker: ai
    text: Wonderful. Now that you've finished your mains, how should I prepare the
      bill?
  - speaker: user
    goal: Pide todo en una sola cuenta e indica que tú invitas.
    suggested_lines:
    - Please put everything on one check; this lunch is on us today.
    - One check for the whole table, please.
  - speaker: ai
    text: Certainly! I'll bring the card terminal right over.
