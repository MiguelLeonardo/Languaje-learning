id: b1-joining-running-club
title: Joining a Saturday running club
title_es: Integrarse a un club de corredores local
cefr: B1
topic: social-and-smalltalk
description: Preséntate en un grupo de corredores de fin de semana, pregunta el ritmo por kilómetro y la ruta.
phrases:
- id: first-time-joining-group
  text: Morning! I saw your club on Instagram and decided to join for the first time today.
  translation: ¡Buenos días! Vi su club en Instagram y decidí unirme por primera vez hoy.
  visual_hint: 👟🌅
  cloze:
  - 5
  - 10
  glossary:
  - word: decided
    meaning: decidí
    ipa: dɪˈsaɪdɪd
- id: pace-groups-five-k
  text: Do you split into different pace groups for the eight-kilometer loop?
  translation: ¿Se dividen en distintos grupos de ritmo para el circuito de ocho kilómetros?
  visual_hint: ⏱️🏃‍♀️
  cloze:
  - 3
  - 7
  glossary:
  - word: pace
    meaning: ritmo de carrera
    ipa: peɪs
- id: conversational-pace-group
  text: I'll stick with the five-thirty per kilometer group so I can chat along the way.
  translation: Me uniré al grupo de cinco treinta por kilómetro para poder conversar en el camino.
  visual_hint: 💬🏃
  cloze:
  - 5
  - 10
  glossary:
  - word: stick with
    meaning: mantenerse con / ir en
    ipa: stɪk wɪð
- id: coffee-stop-after-run
  text: Does everyone really grab pastries and coffee together at the finish line?
  translation: ¿De verdad todos van por pan dulce y café juntos al llegar a la meta?
  visual_hint: 🥐☕
  cloze:
  - 4
  - 8
  glossary:
  - word: finish line
    meaning: línea de meta / final
    ipa: ˈfɪnɪʃ laɪn
- id: bag-drop-in-van
  text: Can I leave my sweatshirt in the club's gear bag while we run?
  translation: ¿Puedo dejar mi sudadera en la bolsa del club mientras corremos?
  visual_hint: 🧥🎒
  cloze:
  - 4
  - 8
  glossary:
  - word: sweatshirt
    meaning: sudadera
    ipa: ˈswetʃɜːrt
- id: great-way-start-weekend
  text: Running with a group makes the kilometers fly by—see you next Saturday!
  translation: Correr en grupo hace que los kilómetros pasen volando; ¡nos vemos el próximo sábado!
  visual_hint: 🙌🏅
  cloze:
  - 4
  - 8
  glossary:
  - word: fly by
    meaning: pasar volando (el tiempo)
    ipa: flaɪ baɪ
roleplay:
  ai_role: run club pacer
  user_role: new runner
  setting: Saturday morning warmup stretch by the river promenade.
  turns:
  - speaker: ai
    text: Good morning and welcome! We're just starting our dynamic warm-up stretches.
  - speaker: user
    goal: Saluda y cuenta que viste el club en Instagram y vienes por primera vez.
    suggested_lines:
    - Morning! I saw your club on Instagram and decided to join for the first time today.
    - Do you split into different pace groups for the eight-kilometer loop?
  - speaker: ai
    text: So glad you came out! What distance and pace do you usually enjoy running?
  - speaker: user
    goal: Pregunta si se dividen en distintos grupos de ritmo para el recorrido.
    suggested_lines:
    - Do you split into different pace groups for the eight-kilometer loop?
    - I'll stick with the five-thirty per kilometer group so I can chat along the way.
  - speaker: ai
    text: Yes! We have a fast group, a 5:30 conversational pace group, and a run-walk group.
  - speaker: user
    goal: Elige el grupo de ritmo conversacional de 5:30 por kilómetro.
    suggested_lines:
    - I'll stick with the five-thirty per kilometer group so I can chat along the way.
    - Does everyone really grab pastries and coffee together at the finish line?
  - speaker: ai
    text: I'm pacing the 5:30 group today! It's a flat loop along the river bridges.
  - speaker: user
    goal: Pregunta por la tradición de tomar café juntos al terminar la carrera.
    suggested_lines:
    - Does everyone really grab pastries and coffee together at the finish line?
    - Can I leave my sweatshirt in the club's gear bag while we run?
  - speaker: ai
    text: Wonderful! Everything is all set. Have a fantastic day!
