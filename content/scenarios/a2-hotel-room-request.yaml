id: a2-hotel-room-request
title: Requesting hotel room amenities
title_es: Pedir servicios a la habitación del hotel
cefr: A2
topic: hotel-and-shopping
description: Llama a recepción desde tu habitación para pedir toallas extra, una almohada
  adicional y preguntar la clave del wifi.
phrases:
- id: extra-towels
  text: Could you send two extra bath towels to room 304, please?
  translation: ¿Podría enviar dos toallas de baño extra a la habitación 304, por favor?
  visual_hint: 🛁🧺
  cloze:
  - 2
  - 5
  - 8
  glossary:
  - word: bath towels
    meaning: toallas de baño
    ipa: bæθ ˈtaʊəlz
  - word: extra
    meaning: adicionales / extra
    ipa: ˈekstrə
- id: wifi-password
  text: What is the password for the guest Wi-Fi network?
  translation: ¿Cuál es la contraseña de la red wifi para huéspedes?
  visual_hint: 📶🔑
  cloze:
  - 3
  - 6
  - 8
  glossary:
  - word: password
    meaning: contraseña
    ipa: ˈpæswɜːrd
  - word: guest
    meaning: huésped / invitado
    ipa: ɡest
- id: air-conditioning-warm
  text: The air conditioning in my room is not cooling properly.
  translation: El aire acondicionado de mi habitación no está enfriando bien.
  visual_hint: ❄️🌡️
  cloze:
  - 1
  - 2
  - 8
  glossary:
  - word: air conditioning
    meaning: aire acondicionado
    ipa: er kənˈdɪʃənɪŋ
  - word: cooling
    meaning: enfriando
    ipa: ˈkuːlɪŋ
- id: idm-drop-off-towels
  text: Could housekeeping drop off two extra bath towels in room 402?
  translation: ¿Podría el servicio de limpieza pasar a dejar dos toallas extra en
    la habitación 402?
  visual_hint: 🧺🚪
  cloze:
  - 3
  - 7
  glossary:
  - word: drop off
    meaning: pasar a dejar / entregar
    ipa: drɒp ɒf
  kind: phrasal_verb
  apply_sentence: Please ____ the clean pillows whenever someone is free.
  apply_answer: drop off
  apply_translation: Por favor pasen a dejar las almohadas limpias cuando alguien
    esté libre.
- id: idm-make-yourself-home
  text: Everything is ready for you, so please make yourself at home.
  translation: Todo está listo para usted, así que por favor siéntase como en casa.
  visual_hint: 🛋️😊
  cloze:
  - 3
  - 7
  glossary:
  - word: make yourself at home
    meaning: sentirse como en casa
    ipa: meɪk jɔːrˈself æt hoʊm
  kind: idiom
  apply_sentence: The host smiled and told us to ____ in the lounge.
  apply_answer: make yourself at home
  apply_translation: El anfitrión sonrió y nos dijo que nos sintiéramos como en casa
    en la sala.
roleplay:
  ai_role: front desk agent
  user_role: hotel guest
  setting: Calling the hotel reception desk from Room 304.
  turns:
  - speaker: ai
    text: Front desk, good evening! How can I make your stay more comfortable?
  - speaker: user
    goal: Pide dos toallas de baño extra y una almohada para la habitación 304.
    suggested_lines:
    - Could you send two extra bath towels to room 304, please?
    - May I also get an extra pillow and a blanket?
  - speaker: ai
    text: Right away! Housekeeping will bring them up in five minutes. Anything else?
  - speaker: user
    goal: Comenta que el aire acondicionado no está enfriando bien.
    suggested_lines:
    - The air conditioning in my room is not cooling properly.
    - Also, do you have a clothes iron we can borrow for tonight?
  - speaker: ai
    text: I'll send our maintenance technician to check the thermostat right now.
  - speaker: user
    goal: Pregunta la contraseña del wifi para huéspedes.
    suggested_lines:
    - What is the password for the guest Wi-Fi network?
    - Could you tell me the guest Wi-Fi password?
  - speaker: ai
    text: It's 'GrandStay2026' with a capital G and S. Would you like a morning wake-up
      call?
  - speaker: user
    goal: Pide una llamada despertador a las 6:30 de la mañana.
    suggested_lines:
    - Could you set a wake-up call for six thirty tomorrow morning?
    - Yes, please set a wake-up call for six thirty.
  - speaker: ai
    text: All set for 6:30 AM. Have a restful night!
