id: a2-picnic-in-the-park
title: Organizing a Sunday park picnic
title_es: Organizar un picnic en el parque
cefr: A2
topic: social-and-smalltalk
description: Coordina con tus amigos quién lleva la manta, los sándwiches y el altavoz Bluetooth para el domingo.
phrases:
- id: meet-by-lake-fountain
  text: Let's meet by the big fountain near the lake at one o'clock on Sunday.
  translation: Encontrémonos junto a la fuente grande cerca del lago el domingo a la una.
  visual_hint: ⛲🌳
  cloze:
  - 4
  - 9
  glossary:
  - word: fountain
    meaning: fuente de agua
    ipa: ˈfaʊntən
- id: bring-waterproof-blanket
  text: I'll bring a large waterproof picnic blanket and paper plates.
  translation: Yo llevaré una manta impermeable grande para picnic y platos de cartón.
  visual_hint: 🧺🍽️
  cloze:
  - 3
  - 6
  glossary:
  - word: waterproof
    meaning: impermeable
    ipa: ˈwɔːtərpruːf
- id: fresh-caprese-sandwiches
  text: Could you bring a cooler with cold lemonade and some fruit?
  translation: ¿Podrías traer una hielera con limonada fría y algo de fruta?
  visual_hint: 🧊🍓
  cloze:
  - 3
  - 7
  glossary:
  - word: cooler
    meaning: hielera / nevera portátil
    ipa: ˈkuːlər
- id: bluetooth-speaker-frisbee
  text: I also packed a Frisbee and a small speaker for background music.
  translation: También guardé un frisbi y una bocina pequeña para poner música de fondo.
  visual_hint: 🥏🎶
  cloze:
  - 4
  - 8
  glossary:
  - word: background music
    meaning: música de fondo
    ipa: ˈbækɡraʊnd ˈmjuːzɪk
- id: sit-under-oak-trees
  text: There is plenty of shade under the big oak trees by the water.
  translation: Hay mucha sombra bajo los grandes robles junto al agua.
  visual_hint: 🌳☀️
  cloze:
  - 4
  - 8
  glossary:
  - word: shade
    meaning: sombra
    ipa: ʃeɪd
- id: bring-sunscreen-and-hat
  text: Remind everyone in the group chat to bring sunglasses and sunscreen!
  translation: ¡Recuérdales a todos en el chat grupal traer lentes de sol y bloqueador!
  visual_hint: 🕶️🧴
  cloze:
  - 3
  - 7
  glossary:
  - word: remind
    meaning: recordar a alguien
    ipa: rɪˈmaɪnd
roleplay:
  ai_role: friend (Sam)
  user_role: organizer
  setting: Planning a Sunday afternoon picnic by the lake.
  turns:
  - speaker: ai
    text: The forecast for Sunday is 24 degrees and sunny! Where should we set up our picnic?
  - speaker: user
    goal: Propón encontrarse junto a la fuente del lago el domingo a la una.
    suggested_lines:
    - Let's meet by the big fountain near the lake at one o'clock on Sunday.
    - I'll bring a large waterproof picnic blanket and paper plates.
  - speaker: ai
    text: 1:00 PM by the lake fountain is easy for everyone to find. What should I bring?
  - speaker: user
    goal: Ofrece llevar una manta impermeable grande y platos.
    suggested_lines:
    - I'll bring a large waterproof picnic blanket and paper plates.
    - Could you bring a cooler with cold lemonade and some fruit?
  - speaker: ai
    text: I can make fresh baguette sandwiches! What about drinks and snacks?
  - speaker: user
    goal: Pídele llevar una hielera con limonada fría y fruta.
    suggested_lines:
    - Could you bring a cooler with cold lemonade and some fruit?
    - I also packed a Frisbee and a small speaker for background music.
  - speaker: ai
    text: Consider it done—watermelon, grapes, and homemade lemonade!
  - speaker: user
    goal: Di que llevarás un frisbi y una bocina pequeña para música.
    suggested_lines:
    - I also packed a Frisbee and a small speaker for background music.
    - There is plenty of shade under the big oak trees by the water.
  - speaker: ai
    text: Wonderful! Everything is all set. Have a fantastic day!
