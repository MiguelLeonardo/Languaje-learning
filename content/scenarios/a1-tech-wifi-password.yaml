id: a1-tech-wifi-password
title: Asking for the Wi-Fi password
title_es: Pedir la contraseña del Wi-Fi
cefr: A1
topic: daily-tech-and-media
description: Pide la contraseña del Wi-Fi en una cafetería y confirma que tu teléfono se conectó.
phrases:
- id: wifi-password-please
  text: Excuse me, what is the Wi-Fi password here?
  translation: Disculpa, ¿cuál es la contraseña del Wi-Fi aquí?
  visual_hint: 📶🔑
  cloze:
  - 5
  - 6
  glossary:
  - word: password
    meaning: contraseña
    ipa: ˈpæswɜːrd
- id: connect-my-phone
  text: I want to connect my phone to the internet.
  translation: Quiero conectar mi teléfono a internet.
  visual_hint: 📱🌐
  cloze:
  - 3
  - 5
  glossary:
  - word: connect
    meaning: conectar
    ipa: kəˈnekt
- id: signal-is-strong
  text: The signal is strong at this table.
  translation: La señal es fuerte en esta mesa.
  visual_hint: 📡💪
  cloze:
  - 1
  - 3
  glossary:
  - word: signal
    meaning: señal
    ipa: ˈsɪɡnəl
- id: idm-log-on
  text: I need to log on to check my messages.
  translation: 'Necesito conectarme para revisar mis mensajes. (log on: conectarse / iniciar
    sesión)'
  visual_hint: 💬📲
  cloze:
  - 3
  - 4
  glossary:
  - word: log on
    meaning: conectarse / iniciar sesión
    ipa: lɔːɡ ɑːn
  kind: phrasal_verb
  apply_sentence: You can ____ with the free guest code.
  apply_answer: log on
  apply_translation: Puedes conectarte con el código gratuito de invitado.
- id: idm-no-problem
  text: No problem, I can type it slowly.
  translation: 'No hay problema, puedo escribirla despacio. (no problem: no hay problema)'
  visual_hint: ⌨️😊
  cloze:
  - 0
  - 1
  glossary:
  - word: no problem
    meaning: no hay problema
    ipa: noʊ ˈprɑːbləm
  kind: expression
  apply_sentence: ____, here is the paper with the code.
  apply_answer: No problem
  apply_translation: No hay problema, aquí está el papel con el código.
roleplay:
  ai_role: café barista
  user_role: customer
  setting: A quiet neighborhood café with free Wi-Fi for customers.
  turns:
  - speaker: ai
    text: Hi there! Welcome to Sunny Café. Can I help you?
  - speaker: user
    goal: Pide la contraseña del Wi-Fi porque quieres conectar tu teléfono.
    suggested_lines:
    - Excuse me, what is the Wi-Fi password here?
    - I want to connect my phone to the internet.
  - speaker: ai
    text: Sure! The network is SunnyCafe and the password is coffee2026.
  - speaker: user
    goal: Di que necesitas conectarte para revisar tus mensajes y que la señal es buena.
    suggested_lines:
    - I need to log on to check my messages.
    - The signal is strong at this table.
  - speaker: ai
    text: Great! Let me know if you need anything else.
