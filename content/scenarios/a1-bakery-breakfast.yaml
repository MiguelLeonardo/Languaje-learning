id: a1-bakery-breakfast
title: Buying bread at a bakery
title_es: Comprar pan en la panadería
cefr: A1
topic: food-and-drink
description: Pide croissants recién horneados, jugo de naranja y pregunta el precio
  en una panadería.
phrases:
- id: two-croissants
  text: Can I have two warm croissants, please?
  translation: ¿Me da dos croissants calientes, por favor?
  visual_hint: 🥐🔥
  cloze:
  - 2
  - 4
  glossary:
  - word: warm
    meaning: caliente / tibio
    ipa: wɔːrm
- id: orange-juice
  text: And one fresh orange juice, please.
  translation: Y un jugo de naranja natural, por favor.
  visual_hint: 🍊🧃
  cloze:
  - 2
  - 4
  glossary:
  - word: fresh
    meaning: fresco / natural
    ipa: freʃ
- id: slice-of-cake
  text: Is that chocolate cake sweet?
  translation: ¿Ese pastel de chocolate es dulce?
  visual_hint: 🍰🍫
  cloze:
  - 1
  - 3
  glossary:
  - word: sweet
    meaning: dulce
    ipa: swiːt
- id: pick-up
  text: I pick up fresh bread every morning at this bakery.
  translation: 'Recojo pan fresco cada mañana en esta panadería. (pick up: recoger)'
  visual_hint: 🥖🛍️
  cloze:
  - 3
  - 6
  glossary:
  - word: pick up
    meaning: 'pick up: recoger'
    ipa: pɪk ʌp
  kind: phrasal_verb
  apply_sentence: Can you ____ my bag from the table, please?
  apply_answer: pick up
  apply_translation: ¿Puedes recoger mi bolso de la mesa, por favor?
- id: a-piece-of-cake
  text: Speaking English at the bakery is a piece of cake now.
  translation: 'Hablar inglés en la panadería ya es pan comido. (a piece of cake:
    algo muy fácil)'
  visual_hint: 🍰👍
  cloze:
  - 3
  - 7
  glossary:
  - word: a piece of cake
    meaning: 'a piece of cake: algo muy fácil'
    ipa: keɪk
  kind: idiom
  apply_sentence: The test was ____, so I finished early.
  apply_answer: a piece of cake
  apply_translation: El examen fue pan comido, así que terminé temprano.
roleplay:
  ai_role: baker
  user_role: customer
  setting: A neighborhood bakery at 8 AM.
  turns:
  - speaker: ai
    text: Good morning! Everything is fresh out of the oven. What would you like?
  - speaker: user
    goal: Pide dos croissants calientes.
    suggested_lines:
    - Can I have two warm croissants, please?
    - And one fresh orange juice, please.
  - speaker: ai
    text: Two warm croissants. Would you like something to drink?
  - speaker: user
    goal: Agrega un jugo de naranja natural.
    suggested_lines:
    - And one fresh orange juice, please.
    - Is that chocolate cake sweet?
  - speaker: ai
    text: Yes, one orange juice! Anything else from the display case?
  - speaker: user
    goal: Pregunta por el pastel y pide una bolsa.
    suggested_lines:
    - Is that chocolate cake sweet?
    - Put them in a paper bag, please.
  - speaker: ai
    text: It's delicious! That will be six dollars in total.
  - speaker: user
    goal: Pide pagar con efectivo.
    suggested_lines:
    - Put them in a paper bag, please.
    - Here is ten dollars in cash.
  - speaker: ai
    text: Wonderful! Everything is all set. Have a fantastic day!
