id: c2-clinical-trial-informed-consent
title: Evaluating clinical trial informed consent
title_es: Evaluar consentimiento en ensayo clínico
cefr: C2
topic: health-and-emergencies
description: Analiza con el investigador principal el diseño cruzado del estudio,
  el perfil de efectos adversos y el derecho de retiro.
phrases:
- id: crossover-arm-guarantee
  text: If I'm randomized into the placebo control arm initially, does the protocol
    guarantee open-label crossover at week twelve?
  translation: Si soy asignado por azar al brazo placebo inicialmente, ¿el protocolo
    garantiza el cruce al fármaco activo en la semana doce?
  visual_hint: 🧬🔬
  cloze:
  - 6
  - 12
  glossary:
  - word: randomized
    meaning: asignado aleatoriamente
    ipa: ˈrændəmaɪzd
- id: dose-limiting-toxicities
  text: What were the most prevalent dose-limiting toxicities observed during the
    Phase II dose-escalation cohort?
  translation: ¿Cuáles fueron las toxicidades limitantes de dosis más frecuentes observadas
    durante la Fase II?
  visual_hint: 📊🩺
  cloze:
  - 4
  - 9
  glossary:
  - word: prevalent
    meaning: frecuentes / prevalentes
    ipa: ˈprevələnt
- id: unblind-in-emergency
  text: Should an unexpected adverse event arise, can my primary physician break the
    blind immediately?
  translation: En caso de surgir un evento adverso imprevisto, ¿puede mi médico de
    cabecera abrir el ciego de inmediato?
  visual_hint: 🔓🏥
  cloze:
  - 4
  - 9
  glossary:
  - word: break the blind
    meaning: revelar la asignación del estudio por urgencia médica
    ipa: breɪk ðə blaɪnd
- id: idm-read-between-the-lines-c2
  text: Patients must learn to read between the lines of consent forms.
  translation: Los pacientes deben aprender a leer entre líneas en los consentimientos.
    (read between the lines)
  visual_hint: 📜🧐
  cloze:
  - 3
  - 7
  glossary:
  - word: read between the lines
    meaning: leer entre líneas
    ipa: laɪnz
  kind: idiom
  apply_sentence: She can ____ in his polite emails.
  apply_answer: read between the lines
  apply_translation: Ella sabe leer entre líneas en sus correos educados.
- id: idm-the-devil-is-in-the-details-c2
  text: With consent forms, the devil is in the details.
  translation: En los consentimientos, el diablo está en los detalles. (the devil
    is in the details)
  visual_hint: 😈🔬
  cloze:
  - 3
  - 6
  glossary:
  - word: the devil is in the details
    meaning: la dificultad está en los detalles
    ipa: ˈdetelz
  kind: idiom
  apply_sentence: The plan sounds simple, but ____.
  apply_answer: the devil is in the details
  apply_translation: El plan parece simple, pero el diablo está en los detalles.
roleplay:
  ai_role: principal investigator
  user_role: prospective participant
  setting: Academic medical center clinical research consultation.
  turns:
  - speaker: ai
    text: Thank you for reviewing the informed consent dossier for our Phase III targeted
      biologics trial.
  - speaker: user
    goal: Pregunta si quienes entran al grupo placebo pasan al tratamiento activo
      en la semana doce.
    suggested_lines:
    - If I'm randomized into the placebo control arm initially, does the protocol
      guarantee open-label crossover at week twelve?
    - What were the most prevalent dose-limiting toxicities observed during the Phase
      II dose-escalation cohort?
  - speaker: ai
    text: Yes, every participant in the control arm transitions to the active biologic
      at the twelve-week mark.
  - speaker: user
    goal: Pregunta qué efectos adversos limitantes se observaron durante la Fase II.
    suggested_lines:
    - What were the most prevalent dose-limiting toxicities observed during the Phase
      II dose-escalation cohort?
    - Should an unexpected adverse event arise, can my primary physician break the
      blind immediately?
  - speaker: ai
    text: Phase II showed transient mild transaminase elevations in six percent of
      patients, all reversible.
  - speaker: user
    goal: Verifica que tu médico pueda conocer la asignación de inmediato ante cualquier
      urgencia.
    suggested_lines:
    - Should an unexpected adverse event arise, can my primary physician break the
      blind immediately?
    - I appreciate that consent is voluntary and that I may withdraw at any point
      without affecting my standard clinical care.
  - speaker: ai
    text: 24-hour emergency unblinding is built into the pharmacy portal, and you
      can withdraw at any time.
  - speaker: user
    goal: Confirma tu derecho a retirarte en cualquier momento sin afectar tu atención
      médica.
    suggested_lines:
    - I appreciate that consent is voluntary and that I may withdraw at any point
      without affecting my standard clinical care.
    - Are the biweekly pharmacokinetic blood draws coordinated with my regular morning
      lab visits?
  - speaker: ai
    text: Wonderful! Everything is all set. Have a fantastic day!
