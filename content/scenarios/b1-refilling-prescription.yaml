id: b1-refilling-prescription
title: Replacing lost medication while traveling
title_es: Solicitar reposición de receta médica en viaje
cefr: B1
topic: health-and-emergencies
description: Explica en una clínica de viajeros que tu equipaje con tu medicamento
  para la presión se extravió y muestras la foto de tu receta.
phrases:
- id: airline-delayed-my-bag
  text: Hello Doctor. The airline delayed my suitcase containing my daily blood pressure
    medication.
  translation: Hola doctor. La aerolínea demoró mi maleta donde venía mi medicamento
    diario para la presión.
  visual_hint: 🧳💊
  cloze:
  - 4
  - 8
  glossary:
  - word: blood pressure
    meaning: presión arterial
    ipa: blʌd ˈpreʃər
- id: photo-of-prescription-label
  text: I have a clear photo on my phone showing the generic ingredient name and ten-milligram
    dosage.
  translation: Tengo una foto clara en mi teléfono que muestra el nombre genérico
    y la dosis de diez miligramos.
  visual_hint: 📱🔍
  cloze:
  - 5
  - 10
  glossary:
  - word: dosage
    meaning: dosis
    ipa: ˈdoʊsɪdʒ
- id: two-week-supply-enough
  text: I only need a fourteen-day supply to cover the rest of my trip until I fly
    home.
  translation: Solo necesito suministro para catorce días para cubrir el resto de
    mi viaje hasta regresar a casa.
  visual_hint: 🗓️✈️
  cloze:
  - 5
  - 11
  glossary:
  - word: supply
    meaning: suministro / cantidad de pastillas
    ipa: səˈplaɪ
- id: idm-lose-track-of-b1
  text: I always lose track of my pills when I travel.
  translation: Siempre pierdo la cuenta de mis pastillas cuando viajo. (lose track
    of = perder la cuenta)
  visual_hint: 💊🧳
  cloze:
  - 3
  - 6
  glossary:
  - word: lose track of
    meaning: perder la cuenta de
    ipa: luːz træk ʌv
  kind: idiom
  apply_sentence: Don't ____ time while you are studying.
  apply_answer: lose track of
  apply_translation: No pierdas la noción del tiempo mientras estudias.
- id: idm-just-in-case-b1
  text: I'll carry a spare prescription just in case.
  translation: Llevaré una receta de repuesto por si acaso. (just in case)
  visual_hint: 📄🛡️
  cloze:
  - 2
  - 5
  glossary:
  - word: just in case
    meaning: por si acaso
    ipa: dʒʌst ɪn keɪs
  kind: expression
  apply_sentence: Take a sweater, ____ it gets cold.
  apply_answer: just in case
  apply_translation: Lleva un suéter, por si hace frío.
roleplay:
  ai_role: clinic physician
  user_role: traveler
  setting: Walk-in travel clinic consultation room.
  turns:
  - speaker: ai
    text: Hello! Come sit down. What brings you to the travel clinic today?
  - speaker: user
    goal: Explica que la aerolínea demoró tu maleta con tu medicamento para la presión.
    suggested_lines:
    - Hello Doctor. The airline delayed my suitcase containing my daily blood pressure
      medication.
    - I have a clear photo on my phone showing the generic ingredient name and ten-milligram
      dosage.
  - speaker: ai
    text: Never skip blood pressure medication! Do you know the exact chemical name
      and dose?
  - speaker: user
    goal: Muestra en tu teléfono la foto con el ingrediente activo y la dosis de 10
      mg.
    suggested_lines:
    - I have a clear photo on my phone showing the generic ingredient name and ten-milligram
      dosage.
    - I only need a fourteen-day supply to cover the rest of my trip until I fly home.
  - speaker: ai
    text: Amlodipine 10mg—that is widely available here under the exact same generic
      name.
  - speaker: user
    goal: Indica que solo necesitas suministro para catorce días hasta volver a casa.
    suggested_lines:
    - I only need a fourteen-day supply to cover the rest of my trip until I fly home.
    - Can I take this local prescription straight to the pharmacy next door?
  - speaker: ai
    text: Let me check your blood pressure cuff reading quickly, and I'll write you
      a 14-day script.
  - speaker: user
    goal: Pregunta si puedes surtir esa receta en la farmacia de al lado.
    suggested_lines:
    - Can I take this local prescription straight to the pharmacy next door?
    - My blood pressure is 120 over 80—I take one tablet every morning with breakfast.
  - speaker: ai
    text: Wonderful! Everything is all set. Have a fantastic day!
