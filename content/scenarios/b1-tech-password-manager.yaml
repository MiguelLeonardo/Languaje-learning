id: b1-tech-password-manager
title: Using a password manager
title_es: Usar un gestor de contraseñas
cefr: B1
topic: daily-tech-and-media
description: Deja de repetir contraseñas y organiza tus accesos de forma segura con un gestor digital.
phrases:
- id: stop-reusing-passwords
  text: You should stop reusing the same password on every site.
  translation: Deberías dejar de reutilizar la misma contraseña en cada sitio.
  visual_hint: 🔑⚠️
  cloze:
  - 3
  - 6
  glossary:
  - word: reusing
    meaning: reutilizar / volver a usar
    ipa: riːˈjuːzɪŋ
- id: generate-random-passwords
  text: A password manager can generate strong random passwords automatically.
  translation: Un gestor de contraseñas puede generar contraseñas aleatorias seguras automáticamente.
  visual_hint: 🔐⚙️
  cloze:
  - 4
  - 6
  glossary:
  - word: random
    meaning: aleatorio / al azar
    ipa: ˈrændəm
- id: autofill-login-form
  text: Browser autofill saves time when signing into trusted accounts.
  translation: El autocompletado del navegador ahorra tiempo al iniciar sesión en cuentas de confianza.
  visual_hint: 🌐✅
  cloze:
  - 1
  - 7
  glossary:
  - word: autofill
    meaning: autocompletado
    ipa: ˈɔːtoʊfɪl
- id: idm-keep-track-of
  text: It is impossible to keep track of fifty different logins by memory.
  translation: 'Es imposible llevar la cuenta de cincuenta accesos distintos de memoria. (keep track of: llevar registro / recordar)'
  visual_hint: 🧠📋
  cloze:
  - 4
  - 5
  glossary:
  - word: keep track of
    meaning: llevar la cuenta de / hacer seguimiento
    ipa: kiːp træk əv
  kind: expression
  apply_sentence: Use a spreadsheet to ____ your monthly software subscriptions.
  apply_answer: keep track of
  apply_translation: Usa una hoja de cálculo para llevar la cuenta de tus suscripciones mensuales de software.
- id: idm-back-up
  text: Always back up your recovery key in a safe offline place.
  translation: 'Siempre haz una copia de respaldo de tu clave de recuperación en un lugar seguro sin conexión. (back up: respaldar)'
  visual_hint: 💾🔒
  cloze:
  - 1
  - 2
  glossary:
  - word: back up
    meaning: respaldar / hacer copia de seguridad
    ipa: bæk ʌp
  kind: phrasal_verb
  apply_sentence: Remember to ____ your vault settings before resetting your phone.
  apply_answer: back up
  apply_translation: Recuerda respaldar la configuración de tu bóveda antes de restablecer tu teléfono.
roleplay:
  ai_role: friend
  user_role: tech-savvy peer
  setting: Working together at a study table with laptops open.
  turns:
  - speaker: ai
    text: Ugh, I forgot my bank password again because I keep changing one number at the end.
  - speaker: user
    goal: Advierte que no debe reutilizar contraseñas y que es imposible recordar tantas de memoria.
    suggested_lines:
    - You should stop reusing the same password on every site.
    - It is impossible to keep track of fifty different logins by memory.
  - speaker: ai
    text: True, but how do you remember long complicated passwords?
  - speaker: user
    goal: Explica que un gestor genera contraseñas aleatorias y que el autocompletado ahorra tiempo.
    suggested_lines:
    - A password manager can generate strong random passwords automatically.
    - Browser autofill saves time when signing into trusted accounts.
  - speaker: ai
    text: What if I lose access to the main vault?
  - speaker: user
    goal: Aconseja respaldar la clave de recuperación en un lugar seguro sin conexión.
    suggested_lines:
    - Always back up your recovery key in a safe offline place.
