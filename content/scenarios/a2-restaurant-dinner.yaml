id: a2-restaurant-dinner
title: Ordering dinner at a restaurant
title_es: Cenar en un restaurante
cefr: A2
topic: food-and-drink
description: Pide una mesa para dos, ordena el plato principal y solicita la cuenta.
phrases:
- id: table-for-two
  text: Could we have a table for two, please?
  translation: ¿Nos podría dar una mesa para dos, por favor?
  visual_hint: 🍽️👥
  cloze:
  - 4
  - 6
  glossary:
  - word: table for two
    meaning: mesa para dos personas
    ipa: ˈteɪbəl fər tuː
- id: order-salmon
  text: I'd like the grilled salmon with salad.
  translation: Me gustaría el salmón a la parrilla con ensalada.
  visual_hint: 🐟🥗
  cloze:
  - 1
  - 4
  glossary:
  - word: I'd like
    meaning: Me gustaría (forma cortés de pedir comida)
    ipa: aɪd laɪk
  - word: grilled
    meaning: a la parrilla / a la plancha
    ipa: ɡrɪld
- id: glass-of-water
  text: Can I get a glass of water, please?
  translation: ¿Me trae un vaso de agua, por favor?
  visual_hint: 🥛💧
  cloze:
  - 4
  - 6
  glossary:
  - word: glass of water
    meaning: vaso de agua
    ipa: ɡlæs əv ˈwɔːtər
- id: go-dutch
  text: Let's go Dutch and split the bill tonight.
  translation: 'Paguemos cada uno lo suyo esta noche. (go Dutch: pagar a medias)'
  visual_hint: 🍽️💶
  cloze:
  - 2
  - 5
  glossary:
  - word: go Dutch
    meaning: 'go Dutch: pagar cada uno lo suyo'
    ipa: dʌtʃ
  kind: idiom
  apply_sentence: We always ____ when we eat out with friends.
  apply_answer: go Dutch
  apply_translation: Siempre pagamos cada uno lo suyo cuando salimos a comer con amigos.
- id: fully-booked
  text: Sorry, we are fully booked until nine o'clock tonight.
  translation: 'Lo siento, estamos completamente reservados hasta las nueve de esta
    noche. (fully booked: sin mesas libres)'
  visual_hint: 📅🚫
  cloze:
  - 3
  - 6
  glossary:
  - word: fully booked
    meaning: 'fully booked: totalmente reservado'
    ipa: bʊkt
  kind: expression
  apply_sentence: The hotel was ____ during the summer festival.
  apply_answer: fully booked
  apply_translation: El hotel estaba completamente lleno durante el festival de verano.
roleplay:
  ai_role: restaurant waiter
  user_role: diner
  setting: A cozy neighborhood restaurant in the evening.
  turns:
  - speaker: ai
    text: Good evening! Welcome to Bistro Nine. How many are in your party?
  - speaker: user
    goal: Pide una mesa para dos personas.
    suggested_lines:
    - Could we have a table for two, please?
    - A table for two, please.
  - speaker: ai
    text: Right this way. Are you ready to order your main course?
  - speaker: user
    goal: Pide el salmón a la parrilla con ensalada y un vaso de agua.
    suggested_lines:
    - I'd like the grilled salmon with salad.
    - Can I get a glass of water, please?
  - speaker: ai
    text: Wonderful choice. Anything else after dinner?
  - speaker: user
    goal: Pide la cuenta amablemente.
    suggested_lines:
    - Could we have the bill, please?
    - Just the bill, please.
  - speaker: ai
    text: I'll bring that right over. Thank you!
