id: b2-dental-emergency
title: Urgent dental appointment abroad
title_es: Urgencia dental durante un viaje
cefr: B2
topic: health-and-emergencies
description: Explica en una clínica dental que se te fracturó un empaste durante un
  viaje y necesitas atención de urgencia.
phrases:
- id: cracked-filling
  text: I cracked a filling on my upper molar last night and have sharp sensitivity
    to cold.
  translation: Se me fracturó un empaste en la muela superior anoche y tengo una sensibilidad
    aguda al frío.
  visual_hint: 🦷⚡
  cloze:
  - 1
  - 3
  - 6
  - 13
  glossary:
  - word: filling
    meaning: empaste / tapadura dental
    ipa: ˈfɪlɪŋ
  - word: molar
    meaning: muela / molar
    ipa: ˈmoʊlər
- id: fit-me-in-today
  text: Since I'm flying out on Thursday, could the dentist squeeze me in for an emergency
    slot today?
  translation: Como mi vuelo sale el jueves, ¿podría el dentista hacerme un hueco
    de urgencia hoy?
  visual_hint: 📅✈️
  cloze:
  - 9
  - 14
  - 15
  glossary:
  - word: squeeze me in
    meaning: hacerme un espacio en la agenda
    ipa: skwiːz miː ɪn
  - word: slot
    meaning: turno / espacio disponible
    ipa: slɑːt
- id: temporary-crown
  text: Would a temporary composite restoration hold up until I see my regular dentist
    back home?
  translation: ¿Aguantaría una restauración temporal de resina hasta que vea a mi
    dentista habitual en casa?
  visual_hint: 🛡️🦷
  cloze:
  - 2
  - 4
  - 5
  glossary:
  - word: temporary
    meaning: temporal / provisional
    ipa: ˈtempəreri
  - word: hold up
    meaning: resistir / aguantar
    ipa: hoʊld ʌp
- id: idm-grin-and-bear-it-b2
  text: I'll just have to grin and bear it until Monday.
  translation: Tendré que aguantarme hasta el lunes. (grin and bear it = soportar
    con paciencia)
  visual_hint: 🦷😬
  cloze:
  - 3
  - 6
  glossary:
  - word: grin and bear it
    meaning: aguantarse
    ipa: ɡrɪn ænd beər ɪt
  kind: idiom
  apply_sentence: The queue is slow, but we'll have to ____.
  apply_answer: grin and bear it
  apply_translation: La fila es lenta, pero tendremos que aguantarnos.
- id: idm-put-off-b2
  text: I shouldn't have put off going to the dentist.
  translation: No debí haber postergado ir al dentista. (put off = posponer)
  visual_hint: 🦷⏳
  cloze:
  - 3
  - 6
  glossary:
  - word: put off
    meaning: posponer
    ipa: pʊt ɒf
  kind: phrasal_verb
  apply_sentence: Don't ____ your homework until the last minute.
  apply_answer: put off
  apply_translation: No pospongas tu tarea hasta el último minuto.
roleplay:
  ai_role: dentist
  user_role: patient
  setting: Dental clinic in London during an urgent walk-in visit.
  turns:
  - speaker: ai
    text: Hello, come on in. Our receptionist mentioned you're traveling and having
      tooth pain. What happened?
  - speaker: user
    goal: Explica que se te rompió un empaste anoche y tienes sensibilidad al frío.
    suggested_lines:
    - I cracked a filling on my upper molar last night and have sharp sensitivity
      to cold.
    - Since I'm flying out on Thursday, could the dentist squeeze me in for an emergency
      slot today?
  - speaker: ai
    text: 'Let''s take a quick bitewing X-ray. Good news: the nerve is healthy, so
      we can place a bonded composite filling right now.'
  - speaker: user
    goal: Pregunta si la restauración aguantará hasta volver a casa y comenta sobre
      la anestesia local.
    suggested_lines:
    - Would a temporary composite restoration hold up until I see my regular dentist
      back home?
    - I have no adverse reactions to local anesthetic, though I prefer a numbing gel
      first.
  - speaker: ai
    text: Actually, this UV-cured composite is a full permanent restoration, and I'll
      apply topical numbing gel first.
  - speaker: user
    goal: Pregunta cuánto tiempo esperar antes de masticar sólidos de ese lado.
    suggested_lines:
    - How long should I wait before chewing solid food on that side?
    - When can I chew solid food on that side?
  - speaker: ai
    text: Wait about two hours until the numbness wears off completely so you don't
      bite your cheek.
  - speaker: user
    goal: Pide que te envíen por correo la radiografía digital y las notas para tu
      seguro de viaje.
    suggested_lines:
    - Could you email me the digital X-ray and treatment notes for my travel insurance?
    - Please email me the X-ray and treatment notes for my insurance.
  - speaker: ai
    text: Our front desk will email the full PDF packet and itemized receipt right
      now. Safe flight on Thursday!
