id: c1-defusing-awkward-topic
title: Gracefully pivoting a tense dinner topic
title_es: Cambiar de tema con diplomacia en una cena
cefr: C1
topic: social-and-smalltalk
description: Suaviza con humor y tacto una discusión acalorada en una cena, validando
  a ambos invitados y cambiando de tema.
phrases:
- id: passion-at-the-table
  text: It's clear you both care deeply about this issue—and we're definitely not
    solving municipal tax policy before dessert!
  translation: Está claro que a ambos les importa mucho este tema, ¡y seguro no resolveremos
    la política fiscal antes del postre!
  visual_hint: 🍷😊
  cloze:
  - 6
  - 12
  glossary:
  - word: care deeply
    meaning: importar profundamente
    ipa: ker ˈdiːpli
- id: agree-to-disagree-gracefully
  text: Let's chalk that one up to a spirited 'agree to disagree' while the tiramisu
    is still chilled.
  translation: Dejemos eso en un cordial 'acordemos disentir' mientras el tiramisú
    sigue frío.
  visual_hint: 🍰🤝
  cloze:
  - 5
  - 11
  glossary:
  - word: agree to disagree
    meaning: acordar disentir con respeto
    ipa: əˈɡriː tuː ˌdɪsəˈɡriː
- id: pivot-to-shared-passion
  text: Speaking of Italy, didn't you two both hike the Dolomites last autumn?
  translation: Hablando de Italia, ¿no hicieron ambos senderismo en los Dolomitas
    el otoño pasado?
  visual_hint: 🏔️🥾
  cloze:
  - 4
  - 8
  glossary:
  - word: speaking of
    meaning: hablando de... (para cambiar de tema)
    ipa: ˈspiːkɪŋ əv
- id: idm-c1da-change-subject
  text: Why don't we steer clear of politics and talk about the trip instead?
  translation: ¿Por qué no evitamos la política y hablamos mejor del viaje? (mantenerse
    alejado)
  visual_hint: 🍷🙊
  cloze:
  - 4
  - 8
  glossary:
  - word: steer clear of
    meaning: evitar
    ipa: stɪər
  kind: idiom
  apply_sentence: You'd better ____ clear of that topic at dinner.
  apply_answer: steer
  apply_translation: Será mejor que evites ese tema en la cena.
- id: idm-c1da-clear-the-air
  text: Let's clear the air before dessert so nobody feels uncomfortable.
  translation: Aclaremos las cosas antes del postre para que nadie se sienta incómodo
    (eliminar tensión).
  visual_hint: 🌬️🕊️
  cloze:
  - 3
  - 6
  glossary:
  - word: clear the air
    meaning: disipar tensiones
    ipa: eər
  kind: idiom
  apply_sentence: After the argument, we sat down to ____ the air.
  apply_answer: clear
  apply_translation: Después de la discusión, nos sentamos a aclarar las cosas.
roleplay:
  ai_role: opinionated dinner guest
  user_role: diplomatic host
  setting: Around a dinner party table when a political debate gets heated.
  turns:
  - speaker: ai
    text: Well, I just think the city council's zoning plan is completely short-sighted!
  - speaker: user
    goal: Reconoce con humor el entusiasmo de ambos para distender el ambiente.
    suggested_lines:
    - It's clear you both care deeply about this issue—and we're definitely not solving
      municipal tax policy before dessert!
    - Let's chalk that one up to a spirited 'agree to disagree' while the tiramisu
      is still chilled.
  - speaker: ai
    text: (Chuckles around the table) Fair enough, I might have gotten carried away
      on my soapbox!
  - speaker: user
    goal: Invita a dejar el punto en un respetuoso 'acordemos disentir' para servir
      el postre.
    suggested_lines:
    - Let's chalk that one up to a spirited 'agree to disagree' while the tiramisu
      is still chilled.
    - Speaking of Italy, didn't you two both hike the Dolomites last autumn?
  - speaker: ai
    text: Thank you for rescuing us! That tiramisu looks incredible.
  - speaker: user
    goal: Redirige la conversación hacia el viaje de senderismo que ambos hicieron
      en los Dolomitas.
    suggested_lines:
    - Speaking of Italy, didn't you two both hike the Dolomites last autumn?
    - Tell the table about those high-altitude refuges—we're planning a trip there
      in September!
  - speaker: ai
    text: Wait, you hiked the Alta Via 1 too? Which mountain hut was your favorite?
  - speaker: user
    goal: Pídeles que cuenten sobre los refugios de montaña para integrar a toda la
      mesa.
    suggested_lines:
    - Tell the table about those high-altitude refuges—we're planning a trip there
      in September!
    - Let me top up everyone's wine glasses while you compare trail routes.
  - speaker: ai
    text: Wonderful! Everything is all set. Have a fantastic day!
