id: c2-dinner-debate
title: Debating at a dinner party
title_es: Debatir en una cena
cefr: C2
topic: social-and-smalltalk
description: Expresa matices, discrepa con elegancia y usa expresiones idiomáticas
  en una conversación social.
phrases:
- id: devils-advocate
  text: Just to play devil's advocate, couldn't remote work actually isolate people?
  translation: Solo por llevar la contraria, ¿no podría el teletrabajo aislar a las
    personas?
  visual_hint: 😈⚖️
  cloze:
  - 3
  - 4
  glossary:
  - word: devil's advocate
    meaning: 'abogado del diablo: defender la postura contraria para debatir'
  - word: isolate
    meaning: aislar
    ipa: ˈaɪsəleɪt
- id: see-where
  text: I see where you're coming from, but I'd take that with a grain of salt.
  translation: Entiendo tu punto de vista, pero yo lo tomaría con pinzas.
  visual_hint: 🧂
  cloze:
  - 4
  - 12
  glossary:
  - word: coming from
    meaning: where you're coming from = tu perspectiva
  - word: grain of salt
    meaning: with a grain of salt = con escepticismo
- id: nuance
  text: It's not so much a question of productivity as one of belonging.
  translation: No es tanto una cuestión de productividad como de pertenencia.
  visual_hint: 🧩
  cloze:
  - 7
  - 11
  glossary:
  - word: not so much ... as
    meaning: no tanto ... como
  - word: belonging
    meaning: pertenencia
    ipa: bɪˈlɔːŋɪŋ
- id: idm-c2dd-devils-advocate
  text: Allow me to play devil's advocate for a moment, if I may.
  translation: Permítame hacer de abogado del diablo un momento, si me lo permite
    (defender lo contrario).
  visual_hint: 🍷⚖️
  cloze:
  - 4
  - 8
  glossary:
  - word: play devil's advocate
    meaning: hacer de abogado del diablo
    ipa: ˈdevlz
  kind: idiom
  apply_sentence: He loves to play ____ advocate at every dinner.
  apply_answer: devil's
  apply_translation: Le encanta hacer de abogado del diablo en cada cena.
- id: idm-c2dd-bite-bullet
  text: Sooner or later, we'll have to bite the bullet and decide.
  translation: Tarde o temprano tendremos que apechugar y decidir (aceptar algo difícil).
  visual_hint: 🔫😬
  cloze:
  - 3
  - 7
  glossary:
  - word: bite the bullet
    meaning: apechugar
    ipa: ˈbʊlɪt
  kind: idiom
  apply_sentence: She decided to ____ the bullet and admit the mistake.
  apply_answer: bite
  apply_translation: Decidió apechugar y admitir el error.
roleplay:
  ai_role: opinionated dinner guest
  user_role: fellow guest
  setting: A relaxed dinner party among friends discussing the future of work.
  turns:
  - speaker: ai
    text: Honestly, I think offices are obsolete. Remote work is better in every way.
  - speaker: user
    goal: Haz de abogado del diablo.
    suggested_lines:
    - Just to play devil's advocate, couldn't remote work actually isolate people?
  - speaker: ai
    text: But the productivity studies are overwhelmingly positive!
  - speaker: user
    goal: Reconoce su punto pero matiza.
    suggested_lines:
    - I see where you're coming from, but I'd take that with a grain of salt. It's
      not so much a question of productivity as one of belonging.
  - speaker: ai
    text: Belonging? People can build community online just as well.
  - speaker: user
    goal: Cierra el debate con elegancia.
    suggested_lines:
    - Fair enough, let's agree to disagree on that one.
  - speaker: ai
    text: Ha, deal. More wine?
