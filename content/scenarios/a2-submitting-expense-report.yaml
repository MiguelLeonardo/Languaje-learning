id: a2-submitting-expense-report
title: Submitting travel expense receipts
title_es: Subir recibos de gastos de viaje
cefr: A2
topic: work-and-career
description: Pregunta a contabilidad cómo subir las fotos de los recibos del hotel y taxi en la aplicación de gastos.
phrases:
- id: upload-trip-receipts
  text: Hi! Could you show me how to submit my receipts from the Boston conference?
  translation: ¡Hola! ¿Podrías mostrarme cómo subir mis recibos del congreso de Boston?
  visual_hint: 🧾💼
  cloze:
  - 4
  - 9
  glossary:
  - word: submit
    meaning: enviar / presentar
    ipa: səbˈmɪt
- id: take-photo-with-app
  text: Can I just take a photo of the taxi and dinner receipts with the mobile app?
  translation: ¿Puedo simplemente tomar una foto de los recibos de taxi y cena con la app móvil?
  visual_hint: 📱📸
  cloze:
  - 5
  - 10
  glossary:
  - word: receipts
    meaning: recibos / comprobantes
    ipa: rɪˈsiːts
- id: select-project-code
  text: Which project code should I choose from the dropdown menu?
  translation: ¿Qué código de proyecto debo elegir en el menú desplegable?
  visual_hint: 💻📂
  cloze:
  - 3
  - 6
  glossary:
  - word: dropdown menu
    meaning: menú desplegable
    ipa: ˈdrɑːpdaʊn ˈmenjuː
- id: reimbursed-next-paycheck
  text: Will the reimbursement be added to my next paycheck at the end of the month?
  translation: ¿El reembolso se sumará a mi próximo pago a fin de mes?
  visual_hint: 🏦📅
  cloze:
  - 5
  - 10
  glossary:
  - word: paycheck
    meaning: pago de nómina / sueldo
    ipa: ˈpeɪtʃek
- id: hotel-itemized-pdf
  text: I also attached the PDF invoice that the hotel emailed me.
  translation: También adjunté la factura en PDF que me envió el hotel por correo.
  visual_hint: 📎🏨
  cloze:
  - 3
  - 7
  glossary:
  - word: attached
    meaning: adjunté
    ipa: əˈtætʃt
- id: thanks-that-was-easy
  text: Done! That took less than five minutes—thank you!
  translation: ¡Listo! Eso tomó menos de cinco minutos; ¡gracias!
  visual_hint: 🙌✅
  cloze:
  - 2
  - 5
  glossary:
  - word: less than
    meaning: menos de
    ipa: les ðæn
roleplay:
  ai_role: accounting specialist
  user_role: employee
  setting: Stopping by the finance desk after a business trip.
  turns:
  - speaker: ai
    text: Hi! Welcome back from Boston. Ready to file your travel expenses?
  - speaker: user
    goal: Pide que te muestre cómo subir tus recibos del viaje a Boston.
    suggested_lines:
    - Hi! Could you show me how to submit my receipts from the Boston conference?
    - Can I just take a photo of the taxi and dinner receipts with the mobile app?
  - speaker: ai
    text: It's super easy! Do you still have the paper receipts and hotel invoice?
  - speaker: user
    goal: Pregunta si puedes tomar fotos de los recibos desde la app móvil.
    suggested_lines:
    - Can I just take a photo of the taxi and dinner receipts with the mobile app?
    - Which project code should I choose from the dropdown menu?
  - speaker: ai
    text: Yes, the app scans the date and total amount automatically from your photo.
  - speaker: user
    goal: Pregunta qué código de proyecto elegir en el menú desplegable.
    suggested_lines:
    - Which project code should I choose from the dropdown menu?
    - Will the reimbursement be added to my next paycheck at the end of the month?
  - speaker: ai
    text: Select 'Q3-Events-204' and click 'Send to Manager'.
  - speaker: user
    goal: Pregunta si el reembolso saldrá en tu próximo pago de fin de mes.
    suggested_lines:
    - Will the reimbursement be added to my next paycheck at the end of the month?
    - I also attached the PDF invoice that the hotel emailed me.
  - speaker: ai
    text: Wonderful! Everything is all set. Have a fantastic day!
