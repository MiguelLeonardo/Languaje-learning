id: c1-hotel-conference-block
title: Negotiating a corporate hotel room block
title_es: Negociar bloque corporativo de habitaciones
cefr: C1
topic: hotel-and-shopping
description: Negocia con el director de ventas de un hotel la cláusula de reducción
  (attrition), salas de trabajo y ascensos VIP.
phrases:
- id: twenty-percent-attrition
  text: Could we increase the allowable room-block attrition from ten percent to twenty
    percent until thirty days out?
  translation: ¿Podríamos ampliar el margen permitido de reducción del bloque del
    diez al veinte por ciento hasta treinta días antes?
  visual_hint: 🏨📊
  cloze:
  - 5
  - 11
  glossary:
  - word: attrition
    meaning: reducción permitida de habitaciones sin penalización
    ipa: əˈtrɪʃən
- id: waive-breakout-room-rental
  text: If our banquet food-and-beverage spend exceeds twenty thousand dollars, will
    you waive the breakout room rental?
  translation: Si nuestro consumo de banquetes supera los veinte mil dólares, ¿eximirán
    el alquiler de las salas de trabajo?
  visual_hint: 🍽️🏛️
  cloze:
  - 5
  - 10
  glossary:
  - word: breakout room
    meaning: sala para sesiones paralelas
    ipa: ˈbreɪkaʊt ruːm
- id: complimentary-suite-upgrades
  text: We'd also ask for three complimentary suite upgrades for our keynote speakers
    and board chair.
  translation: También solicitaríamos tres ascensos gratuitos a suite para nuestros
    conferencistas principales y presidenta del directorio.
  visual_hint: 🛎️🌟
  cloze:
  - 5
  - 10
  glossary:
  - word: complimentary
    meaning: sin costo / de cortesía
    ipa: ˌkɑːmplɪˈmentəri
- id: idm-hammer-out-terms
  text: Let's hammer out the attrition clause before we sign the group contract.
  translation: Cerremos los detalles de la cláusula de penalización antes de firmar
    el contrato grupal.
  visual_hint: 🔨📄
  cloze:
  - 4
  - 8
  glossary:
  - word: hammer out
    meaning: negociar y cerrar en detalle
    ipa: ˈhæmər aʊt
  kind: phrasal_verb
  apply_sentence: Both teams met for an hour to ____ complimentary meeting room terms.
  apply_answer: hammer out
  apply_translation: Ambos equipos se reunieron una hora para definir en detalle las
    salas sin costo.
- id: idm-silver-lining
  text: 'The higher room minimum has a silver lining: it unlocks free suite upgrades.'
  translation: 'El mínimo más alto de habitaciones tiene un lado positivo: desbloquea
    suites gratis.'
  visual_hint: 🌤️🏨
  cloze:
  - 4
  - 8
  glossary:
  - word: silver lining
    meaning: el lado positivo / rayo de esperanza
    ipa: ˈsɪlvər ˈlaɪnɪŋ
  kind: idiom
  apply_sentence: Even though dates shifted, the ____ was securing a much lower rate.
  apply_answer: silver lining
  apply_translation: Aunque cambiaron las fechas, el lado positivo fue asegurar una
    tarifa mucho menor.
roleplay:
  ai_role: hotel sales director
  user_role: summit producer
  setting: Negotiating a 50-room hotel contract for an annual leadership summit.
  turns:
  - speaker: ai
    text: We're delighted to host your fifty executives in October. Did you review
      the room-block draft?
  - speaker: user
    goal: Pide ampliar al 20% el margen de ajuste de habitaciones sin penalización.
    suggested_lines:
    - Could we increase the allowable room-block attrition from ten percent to twenty
      percent until thirty days out?
    - If our banquet food-and-beverage spend exceeds twenty thousand dollars, will
      you waive the breakout room rental?
  - speaker: ai
    text: We can grant 20% cumulative attrition up to thirty days prior to arrival.
  - speaker: user
    goal: Propón eximir el costo de las salas de trabajo si el banquete supera los
      $20,000.
    suggested_lines:
    - If our banquet food-and-beverage spend exceeds twenty thousand dollars, will
      you waive the breakout room rental?
    - We'd also ask for three complimentary suite upgrades for our keynote speakers
      and board chair.
  - speaker: ai
    text: Yes, hitting the $20,000 catering tier waves all meeting-space rental fees.
  - speaker: user
    goal: Solicita tres ascensos a suite sin costo para los conferencistas principales.
    suggested_lines:
    - We'd also ask for three complimentary suite upgrades for our keynote speakers
      and board chair.
    - Can your IT team provision a dedicated symmetrical gigabit VLAN for our livestream
      keynote?
  - speaker: ai
    text: I'll add three Junior Suite upgrades at the group rate plus VIP airport
      transfers.
  - speaker: user
    goal: Pregunta si pueden habilitar una red de internet dedicada para la transmisión.
    suggested_lines:
    - Can your IT team provision a dedicated symmetrical gigabit VLAN for our livestream
      keynote?
    - Route room-and-tax to the corporate master account, while guests settle their
      own incidentals.
  - speaker: ai
    text: Wonderful! Everything is all set. Have a fantastic day!
