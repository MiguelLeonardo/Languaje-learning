id: a2-reporting-stolen-phone
title: Filing a police report for a stolen phone
title_es: Obtener acta policial por robo de teléfono
cefr: A2
topic: health-and-emergencies
description: Solicita en la comisaría un acta policial con sello para que tu seguro
  te reponga el teléfono.
phrases:
- id: report-stolen-phone
  text: Good afternoon, I need to file a police report for my stolen mobile phone.
  translation: Buenas tardes, necesito levantar un acta policial por el robo de mi
    teléfono móvil.
  visual_hint: 📱👮
  cloze:
  - 4
  - 9
  glossary:
  - word: file a report
    meaning: levantar un reporte / denuncia
    ipa: faɪl ə rɪˈpɔːrt
- id: taken-from-coat-pocket
  text: Someone took it from my coat pocket on the crowded tram around noon.
  translation: Alguien lo sacó del bolsillo de mi abrigo en el tranvía lleno alrededor
    del mediodía.
  visual_hint: 🚊🧥
  cloze:
  - 4
  - 8
  glossary:
  - word: crowded
    meaning: lleno de gente / concurrido
    ipa: ˈkraʊdɪd
- id: locked-via-find-my
  text: I already locked the screen remotely using my friend's tablet and wrote down
    the IMEI number.
  translation: Ya bloqueé la pantalla a distancia con la tablet de mi amigo y anoté
    el número IMEI.
  visual_hint: 🔒🔢
  cloze:
  - 5
  - 10
  glossary:
  - word: remotely
    meaning: a distancia / remotamente
    ipa: rɪˈmoʊtli
- id: idm-keep-an-eye-on-a2
  text: I didn't keep an eye on my phone for a second.
  translation: No vigilé mi teléfono ni un segundo. (keep an eye on = vigilar)
  visual_hint: 👀📱
  cloze:
  - 3
  - 7
  glossary:
  - word: keep an eye on
    meaning: vigilar
    ipa: kiːp ən aɪ ɒn
  kind: idiom
  apply_sentence: Can you ____ my suitcase for a minute?
  apply_answer: keep an eye on
  apply_translation: ¿Puedes vigilar mi maleta un minuto?
- id: idm-take-down-a2
  text: Can you take down my name and number, please?
  translation: ¿Puede anotar mi nombre y número, por favor? (take down = anotar)
  visual_hint: ✍️👮
  cloze:
  - 3
  - 6
  glossary:
  - word: take down
    meaning: anotar
    ipa: teɪk daʊn
  kind: phrasal_verb
  apply_sentence: Please ____ this address before you forget it.
  apply_answer: take down
  apply_translation: Por favor, anota esta dirección antes de que la olvides.
roleplay:
  ai_role: desk officer
  user_role: tourist
  setting: Tourist police station reception desk.
  turns:
  - speaker: ai
    text: Good afternoon. Come to window two—are you safe and unharmed?
  - speaker: user
    goal: Explica que necesitas levantar un acta policial por el robo de tu teléfono.
    suggested_lines:
    - Good afternoon, I need to file a police report for my stolen mobile phone.
    - Someone took it from my coat pocket on the crowded tram around noon.
  - speaker: ai
    text: Yes, I'm glad you weren't hurt. Where and when did this happen?
  - speaker: user
    goal: Cuenta que lo sacaron de tu abrigo en el tranvía al mediodía.
    suggested_lines:
    - Someone took it from my coat pocket on the crowded tram around noon.
    - I already locked the screen remotely using my friend's tablet and wrote down
      the IMEI number.
  - speaker: ai
    text: Smart thinking! Having the serial or IMEI number helps our database a lot.
  - speaker: user
    goal: Indica que ya bloqueaste el equipo a distancia y tienes el número IMEI.
    suggested_lines:
    - I already locked the screen remotely using my friend's tablet and wrote down
      the IMEI number.
    - Could I get a stamped paper copy of the report to send to my insurance company?
  - speaker: ai
    text: I've typed all the details into the official incident form. Please sign
      at the bottom.
  - speaker: user
    goal: Pide una copia impresa y sellada del reporte para tu seguro.
    suggested_lines:
    - Could I get a stamped paper copy of the report to send to my insurance company?
    - It is a black iPhone 15 in a dark blue silicone case.
  - speaker: ai
    text: Wonderful! Everything is all set. Have a fantastic day!
