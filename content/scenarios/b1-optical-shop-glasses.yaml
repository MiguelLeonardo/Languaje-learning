id: b1-optical-shop-glasses
title: Repairing eyeglasses at an optical shop
title_es: Reparar lentes en una óptica
cefr: B1
topic: hotel-and-shopping
description: Pide a un óptico reemplazar el tornillo de la patilla de tus lentes y
  ajustar el puente nasal.
phrases:
- id: hinge-screw-fell-out
  text: Hello! The tiny screw on the left arm of my glasses just fell out.
  translation: ¡Hola! El pequeño tornillo de la patilla izquierda de mis lentes se
    acaba de caer.
  visual_hint: 👓🔩
  cloze:
  - 4
  - 9
  glossary:
  - word: screw
    meaning: tornillo
    ipa: skruː
- id: replace-and-tighten
  text: Do you have a replacement screw that fits this titanium hinge?
  translation: ¿Tienen un tornillo de repuesto que le quede a esta bisagra de titanio?
  visual_hint: 🛠️👓
  cloze:
  - 3
  - 7
  glossary:
  - word: hinge
    meaning: bisagra de la montura
    ipa: hɪndʒ
- id: sliding-down-my-nose
  text: They've also been sliding down my nose lately; could you adjust the nose pads?
  translation: Últimamente también se me resbalan por la nariz; ¿podría ajustar las
    plaquetas?
  visual_hint: 👃🔧
  cloze:
  - 4
  - 9
  glossary:
  - word: nose pads
    meaning: plaquetas nasales
    ipa: noʊz pædz
- id: idm-come-apart-hinge
  text: The right arm of my glasses started to come apart at the hinge.
  translation: La patilla derecha de mis lentes empezó a soltarse en la bisagra.
  visual_hint: 👓🔧
  cloze:
  - 4
  - 8
  glossary:
  - word: come apart
    meaning: desarmarse / soltarse
    ipa: kʌm əˈpɑːrt
  kind: phrasal_verb
  apply_sentence: Cheap plastic frames tend to ____ after a few months.
  apply_answer: come apart
  apply_translation: Los armazones de plástico barato tienden a desarmarse después
    de unos meses.
- id: idm-in-the-meantime
  text: In the meantime, could you lend me a spare case while you fix them?
  translation: Mientras tanto, ¿podría prestarme un estuche de repuesto mientras los
    repara?
  visual_hint: ⏳☕
  cloze:
  - 4
  - 9
  glossary:
  - word: in the meantime
    meaning: mientras tanto
    ipa: ɪn ðə ˈmiːntaɪm
  kind: expression
  apply_sentence: Your lenses will be ready at four; ____, feel free to grab a coffee.
  apply_answer: in the meantime
  apply_translation: Sus lentes estarán listos a las cuatro; mientras tanto, puede
    tomar un café.
roleplay:
  ai_role: optician
  user_role: customer
  setting: A downtown optical boutique.
  turns:
  - speaker: ai
    text: Oh dear, holding your glasses in two pieces! Let me take a look at the frame.
  - speaker: user
    goal: Explica que se cayó el tornillo de la patilla izquierda de tus lentes.
    suggested_lines:
    - Hello! The tiny screw on the left arm of my glasses just fell out.
    - Do you have a replacement screw that fits this titanium hinge?
  - speaker: ai
    text: The threads on the hinge are completely fine—it just needs a new 1.4-millimeter
      screw.
  - speaker: user
    goal: Pregunta si tienen un tornillo de repuesto para esa bisagra.
    suggested_lines:
    - Do you have a replacement screw that fits this titanium hinge?
    - They've also been sliding down my nose lately; could you adjust the nose pads?
  - speaker: ai
    text: I've put a new lock-screw in both sides so the right one doesn't loosen
      either.
  - speaker: user
    goal: Pide que ajusten las plaquetas porque se te resbalan.
    suggested_lines:
    - They've also been sliding down my nose lately; could you adjust the nose pads?
    - Thank you! How much do I owe you for the repair and cleaning?
  - speaker: ai
    text: I warmed the temple tips and adjusted the pads, plus ran them through our
      ultrasonic cleaner.
  - speaker: user
    goal: Pregunta cuánto debes por la reparación y el ajuste.
    suggested_lines:
    - Thank you! How much do I owe you for the repair and cleaning?
    - I'll buy a bottle of anti-fog lens spray and a microfiber cloth.
  - speaker: ai
    text: Wonderful! Everything is all set. Have a fantastic day!
