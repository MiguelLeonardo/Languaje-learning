id: c2-aviation-vip-lounge
title: Complex multi-leg itinerary rerouting
title_es: Reubicación de itinerario internacional complejo
cefr: C2
topic: travel-and-transport
description: Gestiona en mostrador ejecutivo una reprogramación interlineal con transferencia
  de equipaje ante cierre de espacio aéreo.
phrases:
- id: interline-endorsement
  text: Given the airspace closure, could you endorse our tickets over to your alliance
    carrier via Zurich?
  translation: Dado el cierre del espacio aéreo, ¿podría endosar nuestros boletos
    a su aerolínea aliada vía Zúrich?
  visual_hint: 🌐✈️
  cloze:
  - 2
  - 6
  - 12
  glossary:
  - word: endorse
    meaning: endosar / transferir el boleto
    ipa: ɪnˈdɔːrs
  - word: alliance carrier
    meaning: aerolínea de la misma alianza
    ipa: əˈlaɪəns ˈkæriər
- id: through-checked-luggage
  text: We need assurance that our checked luggage will be interlined through to the
    final destination.
  translation: Necesitamos la seguridad de que nuestro equipaje documentado será transferido
    hasta el destino final.
  visual_hint: 🧳🏷️
  cloze:
  - 2
  - 9
  - 14
  glossary:
  - word: assurance
    meaning: garantía / certeza
    ipa: əˈʃʊrəns
  - word: interlined
    meaning: transferido entre aerolíneas
    ipa: ˈɪntərlaɪnd
- id: minimum-connecting-time
  text: Does the forty-minute layover in Munich satisfy the legal minimum connecting
    time for non-Schengen transit?
  translation: ¿Cumple la escala de cuarenta minutos en Múnich con el tiempo mínimo
    legal de conexión para tránsito fuera de Schengen?
  visual_hint: ⏱️🛂
  cloze:
  - 3
  - 6
  - 10
  glossary:
  - word: layover
    meaning: escala
    ipa: ˈleɪoʊvər
  - word: minimum connecting time
    meaning: tiempo mínimo de conexión
    ipa: ˈmɪnɪməm kəˈnektɪŋ taɪm
- id: lounge-pull-out-all-stops
  text: The agent promised to pull out all the stops for my keynote.
  translation: La agente prometió hacer todo lo posible para mi conferencia. (pull
    out all the stops = esforzarse al máximo)
  visual_hint: 🎹🛫
  cloze:
  - 4
  - 8
  glossary:
  - word: pull out all the stops
    meaning: dar el máximo
    ipa: pʊl aʊt ɔːl ðə stɒps
  kind: idiom
  apply_sentence: Our hosts will ____ to welcome the delegates tonight.
  apply_answer: pull out all the stops
  apply_translation: Nuestros anfitriones harán todo lo posible por recibir a los
    delegados esta noche.
- id: lounge-tall-order
  text: Rebooking four legs in two hours is a tall order.
  translation: Reprogramar cuatro tramos en dos horas es una tarea difícil. (a tall
    order = algo muy exigente)
  visual_hint: 🧗📋
  cloze:
  - 3
  - 6
  glossary:
  - word: a tall order
    meaning: una tarea muy exigente
    ipa: tɔːl ˈɔːdə
  kind: idiom
  apply_sentence: Clearing every document in ten minutes is a ____.
  apply_answer: tall order
  apply_translation: Revisar todos los documentos en diez minutos es una tarea muy
    exigente.
roleplay:
  ai_role: concierge desk supervisor
  user_role: international keynote speaker
  setting: Executive airline lounge during an unexpected European airspace disruption.
  turns:
  - speaker: ai
    text: Good evening. Due to the weather system over Frankfurt, your direct flight
      has been suspended. How can we best reroute you?
  - speaker: user
    goal: Explica que das la conferencia inaugural mañana y pide endosar el boleto
      vía Zúrich.
    suggested_lines:
    - Given the airspace closure, could you endorse our tickets over to your alliance
      carrier via Zurich?
    - Time is of the essence, as I'm slated to deliver the opening keynote at nine
      tomorrow morning.
  - speaker: ai
    text: 'We have two options: via Munich with a forty-minute connection, or via
      Zurich leaving in fifty minutes.'
  - speaker: user
    goal: Pregunta si cuarenta minutos en Múnich cumplen el tiempo mínimo legal de
      conexión.
    suggested_lines:
    - Does the forty-minute layover in Munich satisfy the legal minimum connecting
      time for non-Schengen transit?
    - Is forty minutes enough for non-Schengen minimum connecting time?
  - speaker: ai
    text: Zurich is much safer at seventy-five minutes, and I can confirm two seats
      in Business Class.
  - speaker: user
    goal: Pide garantía de que el equipaje será transferido y el boleto electrónico
      revalidado.
    suggested_lines:
    - We need assurance that our checked luggage will be interlined through to the
      final destination.
    - Please ensure the e-ticket numbers are revalidated so we don't hit a snag at
      the transfer gate.
  - speaker: ai
    text: I've reissued the 13-digit e-tickets and sent a priority telex to baggage
      control to transfer your bags.
  - speaker: user
    goal: Agradece la gestión y confirma la puerta de salida hacia Zúrich.
    suggested_lines:
    - Thank you for revalidating the e-tickets; which gate does the Zurich flight
      depart from?
    - Please ensure the e-ticket numbers are revalidated so we don't hit a snag at
      the transfer gate.
  - speaker: ai
    text: Gate B24, boarding in twenty minutes. Have a seamless flight and a great
      keynote!
