id: c1-insurance-claim
title: Filing a medical insurance claim
title_es: Gestionar un reclamo con el seguro
cefr: C1
topic: health-and-emergencies
description: Defiende la cobertura de tu póliza médica de viaje y solicita el reembolso
  de gastos clínicos.
phrases:
- id: covered-under-policy
  text: According to my policy terms, emergency outpatient care is fully covered.
  translation: Según los términos de mi póliza, la atención ambulatoria de urgencia
    está totalmente cubierta.
  visual_hint: 📄🏥
  cloze:
  - 3
  - 7
  glossary:
  - word: policy terms
    meaning: condiciones de la póliza
  - word: outpatient care
    meaning: atención médica ambulatoria (sin hospitalización)
- id: itemized-invoice
  text: I've already attached the itemized hospital invoice and the medical report.
  translation: Ya he adjuntado la factura detallada del hospital y el informe médico.
  visual_hint: 📎🧾
  cloze:
  - 4
  - 9
  glossary:
  - word: itemized invoice
    meaning: factura desglosada / detallada
    ipa: ˈaɪtəmaɪzd ˈɪnvɔɪs
- id: expedite-reimbursement
  text: Could you please expedite the reimbursement given the amount involved?
  translation: ¿Podrían agilizar el reembolso dado el importe involucrado?
  visual_hint: ⚡🏦
  cloze:
  - 3
  - 5
  glossary:
  - word: expedite
    meaning: agilizar / acelerar un trámite
    ipa: ˈekspədaɪt
  - word: reimbursement
    meaning: reembolso de gastos
    ipa: ˌriːɪmˈbɜːrsmənt
- id: idm-fine-print-c1
  text: You should read the fine print on this claim carefully.
  translation: Deberías leer con atención la letra pequeña de esta reclamación. (fine
    print = letra pequeña)
  visual_hint: 📄🔍
  cloze:
  - 3
  - 6
  glossary:
  - word: fine print
    meaning: letra pequeña
    ipa: faɪn prɪnt
  kind: idiom
  apply_sentence: I never read the ____ before signing.
  apply_answer: fine print
  apply_translation: Nunca leo la letra pequeña antes de firmar.
- id: idm-jump-through-hoops-c1
  text: I had to jump through hoops to get reimbursed.
  translation: Tuve que pasar por mil trámites para que me reembolsaran. (jump through
    hoops = cumplir muchos requisitos)
  visual_hint: 🤹💸
  cloze:
  - 3
  - 6
  glossary:
  - word: jump through hoops
    meaning: pasar por mil trámites
    ipa: huːps
  kind: idiom
  apply_sentence: They make applicants ____ before approving anything.
  apply_answer: jump through hoops
  apply_translation: Hacen que los solicitantes pasen por mil trámites antes de aprobar
    nada.
roleplay:
  ai_role: insurance claims specialist
  user_role: policyholder
  setting: Phone call with international travel insurance support.
  turns:
  - speaker: ai
    text: Thank you for calling global claims. How can I assist with your case number?
  - speaker: user
    goal: Aclara que la atención ambulatoria de urgencia está cubierta por tu póliza.
    suggested_lines:
    - According to my policy terms, emergency outpatient care is fully covered.
  - speaker: ai
    text: I see. We still need the breakdown of charges from the clinic.
  - speaker: user
    goal: Indica que ya adjuntaste la factura desglosada y pide agilizar el reembolso.
    suggested_lines:
    - I've already attached the itemized hospital invoice and the medical report.
    - Could you please expedite the reimbursement given the amount involved?
  - speaker: ai
    text: I see the documents now. I've escalated your reimbursement for approval
      within forty-eight hours.
